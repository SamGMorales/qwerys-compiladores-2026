MGO-WRONG-ENGINE.correctedExample=Verifica el motor seleccionado o usa sintaxis MongoDB shell: db.usuarios.find({ campo: 'valor' })
RDS-WRONG-ENGINE.what=Sintaxis incorrecta para Redis
RDS-WRONG-ENGINE.why=Este query no parece ser un comando Redis.
RDS-WRONG-ENGINE.correctedExample=Verifica el motor seleccionado o usa comandos Redis: SET clave valor, GET clave, HSET hash campo valor.
CQL-WRONG-ENGINE.what=Sintaxis incorrecta para Cassandra
CQL-WRONG-ENGINE.why=Este query no parece ser CQL de Cassandra.
CQL-WRONG-ENGINE.correctedExample=Usa sintaxis CQL: SELECT … FROM keyspace.tabla WHERE partition_key \\= ?
ES-WRONG-ENGINE.what=Sintaxis incorrecta para Elasticsearch
ES-WRONG-ENGINE.why=Este query no parece ser JSON ni REST de Elasticsearch.
ES-WRONG-ENGINE.correctedExample=Usa JSON Query DSL ({ "query": { … } }) o REST: GET índice/_search
SQL-WRONG-ENGINE.what=Sintaxis incorrecta para SQL
SQL-WRONG-ENGINE.why=Este query no parece ser SQL para el motor relacional seleccionado.
SQL-WRONG-ENGINE.correctedExample=Verifica el motor (MySQL, PostgreSQL, SQL Server, Oracle, SQLite) o pega sintaxis SQL válida.
DDB-WRONG-ENGINE.what=Sintaxis incorrecta para DynamoDB
DDB-WRONG-ENGINE.why=Esta carga no parece PartiQL, expresiones SDK ni JSON de gestión de DynamoDB.
DDB-WRONG-ENGINE.correctedExample=Usa PartiQL, expresiones SDK (SET/REMOVE/ADD) o JSON con TransactItems.
UNKNOWN-ENGINE.what=Motor no reconocido
UNKNOWN-ENGINE.why=El motor de base de datos seleccionado no está soportado por el analizador.
UNKNOWN-ENGINE.correctedExample=Seleccione un motor soportado en el selector.
MGO-JS-001.what=Operador $where detectado — riesgo de seguridad
MGO-JS-001.why=$where ejecuta JavaScript en el servidor sobre cada documento, lo que abre vectores de inyección NoSQL y degrada el rendimiento.
MGO-JS-001.correctedExample=Reemplaza $where por filtros nativos ($eq, $in, $gte, $lte) o por un pipeline de agregación.
MGO-REGEX-001.what=Expresión regular sin índice
MGO-REGEX-001.why=Las búsquedas con $regex o literales /.../  generalmente no usan índices B-tree salvo patrones con prefijo fijo (^texto).
MGO-REGEX-001.correctedExample=Considera un índice de texto, un campo normalizado para búsqueda, o restringe el conjunto de documentos antes con otros filtros.
MGO-NOFILTER-001.what=Operación sin filtro
MGO-NOFILTER-001.why=find/update/delete sin filtro puede afectar TODOS los documentos de la colección.
MGO-NOFILTER-001.correctedExample=Añade un criterio explícito o confirma que deseas procesar la colección completa.
MGO-LOOKUP-001.what=$lookup incompleto
MGO-LOOKUP-001.why=$lookup requiere localField+foreignField, o la sintaxis con pipeline.
MGO-LOOKUP-001.correctedExample=Usa: {$lookup:{from:'col',localField:'a',foreignField:'b',as:'res'}} o la sintaxis con pipeline subquery.
MGO-UNWIND-001.what=$unwind: path debe empezar con $
MGO-UNWIND-001.why=El campo de $unwind debe ser una referencia de campo que empieza con $.
MGO-UNWIND-001.correctedExample=Cambia a: {$unwind: '$nombreCampo'}
MGO-GROUP-001.what=$group sin campo _id
MGO-GROUP-001.why=$group requiere el campo _id para definir el criterio de agrupación.
MGO-GROUP-001.correctedExample=Añade _id: null para agrupar todos los documentos, o _id: '$campo' para agrupar por campo.
MGO-FACET-001.what=Stage no permitido dentro de $facet
MGO-FACET-001.why=$out, $merge e $indexStats no pueden usarse dentro de subpipelines de $facet.
MGO-FACET-001.correctedExample=Mueve estos stages fuera del $facet o reestructura el pipeline.
MGO-PIPELINE-001.what=Pipeline sin $match inicial
MGO-PIPELINE-001.why=Un pipeline con más de 5 stages que no comienza con $match puede procesar todos los documentos innecesariamente.
MGO-PIPELINE-001.correctedExample=Añade {$match: { critero }} al inicio del pipeline para reducir el volumen de documentos procesados.
MGO-GRAPH-001.what=$graphLookup con profundidad excesiva
MGO-GRAPH-001.why=maxDepth mayor de 10 en $graphLookup puede causar problemas graves de rendimiento en grafos grandes.
MGO-GRAPH-001.correctedExample=Reduce maxDepth o añade restricción con restrictSearchWithMatch para limitar el espacio de búsqueda.
MGO-TX-OUT-001.what=$out / $merge en transacción
MGO-TX-OUT-001.why=$out y $merge no pueden usarse dentro de transacciones MongoDB.
MGO-TX-OUT-001.correctedExample=Ejecuta el stage fuera de la transacción o usa una colección temporal intermedia.
MGO-TX-001.what=Transacción iniciada sin commit/abort visible
MGO-TX-001.why=Hay startTransaction() pero no se ve commitTransaction() ni abortTransaction() en el mismo script.
MGO-TX-001.correctedExample=Asegura siempre commit en el camino feliz y abort o manejo explícito en errores; revisa callbacks async.
MGO-TX-002.what=Operaciones con transacción manual
MGO-TX-002.why=Hay escrituras contra db.* con startTransaction manual y no se usa session.withTransaction().
MGO-TX-002.correctedExample=withTransaction() reintenta ante errores transitorios y centraliza el rollback; migra el flujo al callback del driver.
MGO-TX-003.what=Transacción muy larga
MGO-TX-003.why=maxCommitTimeMS, timeout u opciones similares sugieren una ventana mayor de ~60s que MongoDB suele abortar.
MGO-TX-003.correctedExample=Acorta el trabajo por intento, mueve I/O largo fuera de la transacción y baja maxCommitTimeMS/timeout razonablemente.
MGO-TX-004.what=Opciones de startTransaction inválidas
MGO-TX-004.why=startTransaction debe recibir un documento de opciones, no una cadena suelta ni un arreglo literal JSON.
MGO-TX-004.correctedExample=Pasa un objeto: { readConcern: { level: 'local' }, maxCommitTimeMS: 9000 } según lo que necesites.
MGO-CS-001.what=Change stream activo
MGO-CS-001.why=Se abre db.collection.watch(): el cursor sigue vivo hasta que lo cierres.
MGO-CS-001.correctedExample=Usa try-with-resources, close explícito o el patrón del driver para no dejar cursores colgados.
MGO-CS-002.what=watch() sin pipeline
MGO-CS-002.why=No hay lista de etapas [$match, ...] para filtrar eventos en el servidor.
MGO-CS-002.correctedExample=Añade al inicio [$match: { ... }] para reducir tráfico y carga si no necesitas todos los cambios.
MGO-CS-003.what=resumeAfter no válido
MGO-CS-003.why=resumeAfter debe ser el documento opaco del token de reanudación (incluye _id según el driver), no null ni {} vacío.
MGO-CS-003.correctedExample=Guarda y reutiliza resumeToken / getResumeToken() de la iteración anterior; no construyas tokens a mano.
MGO-CS-004.what=fullDocument: updateLookup en colecciones grandes
MGO-CS-004.why=updateLookup trae el documento completo en actualizaciones y puede ser muy costoso en colecciones grandes.
MGO-CS-004.correctedExample=Considera defaultSchema, whenNeeded o filtra/proyecta antes si solo necesitas parte del documento.
MGO-ARRAY-001.what=$elemMatch sin condición
MGO-ARRAY-001.why=$elemMatch sin ninguna condición no tiene efecto útil.
MGO-ARRAY-001.correctedExample=Añade al menos una condición dentro de $elemMatch: {$elemMatch: {campo: valor}}
MGO-ARRAY-002.what=$push / $addToSet: usa $each para múltiples valores
MGO-ARRAY-002.why=Para añadir múltiples valores a la vez es más eficiente usar $each.
MGO-ARRAY-002.correctedExample=Usa: {$push: {$each: [val1, val2]}} en lugar de múltiples $push individuales.
MGO-ARRAY-003.what=$pull con condición vacía
MGO-ARRAY-003.why=Una condición vacía {} en $pull eliminará todos los elementos del array.
MGO-ARRAY-003.correctedExample=Añade una condición específica o confirma que deseas vaciar el array.
MGO-TEXT-001.what=Búsqueda de texto sin índice de texto
MGO-TEXT-001.why=$text requiere que exista un índice de texto en la colección para funcionar.
MGO-TEXT-001.correctedExample=Crea el índice con: db.coleccion.createIndex({ campo: 'text' })
MGO-TEXT-002.what=Idioma no soportado en $text
MGO-TEXT-002.why=El valor de $language no es un idioma reconocido por MongoDB.
MGO-TEXT-002.correctedExample=Consulta la documentación de MongoDB para ver los idiomas soportados, o elimina $language para usar el idioma por defecto.
MGO-GEO-001.what=Query geoespacial sin índice geoespacial
MGO-GEO-001.why=$near y $nearSphere requieren un índice 2dsphere o 2d en el campo de coordenadas.
MGO-GEO-001.correctedExample=Crea el índice con: db.coleccion.createIndex({ ubicacion: '2dsphere' })
MGO-GEO-002.what=Polígono GeoJSON no cerrado
MGO-GEO-002.why=Los polígonos GeoJSON deben estar cerrados: el primer y último punto de coordenadas deben ser idénticos.
MGO-GEO-002.correctedExample=Asegúrate de que el último elemento del array de coordenadas sea igual al primero.
MGO-GEO-003.what=$near sin $maxDistance
MGO-GEO-003.why=Sin $maxDistance, $near puede devolver resultados de toda la colección, degradando el rendimiento.
MGO-GEO-003.correctedExample=Añade $maxDistance: metros para limitar el radio de búsqueda.
MGO-JS-002.what=$function detectado — JavaScript en el servidor
MGO-JS-002.why=$function ejecuta JavaScript personalizado en el servidor, lo que puede causar problemas de rendimiento y seguridad.
MGO-JS-002.correctedExample=Usa operadores de agregación nativos cuando sea posible en lugar de $function.
MGO-JS-003.what=mapReduce está deprecado
MGO-JS-003.why=mapReduce está deprecado desde MongoDB 5.0 y puede ser eliminado en versiones futuras.
MGO-JS-003.correctedExample=Migra a pipeline de agregación: $group, $project, $reduce y similares ofrecen la misma funcionalidad con mejor rendimiento.
MGO-OBJECTID-001.what=Comparación de ObjectId como string
MGO-OBJECTID-001.why=Comparar un string hexadecimal de 24 caracteres directamente con _id siempre fallará, porque _id es de tipo ObjectId.
MGO-OBJECTID-001.correctedExample=Usa el wrapper ObjectId: { _id: ObjectId('tu-id-aqui') }
RDS-SYNTAX-001.what=Consulta Redis vacía o inválida
RDS-SYNTAX-001.why=La consulta no tiene contenido o no se pudo interpretar su estructura.
RDS-SYNTAX-001.correctedExample=Escribe un comando Redis válido, por ejemplo: SET mykey "valor" o GET mykey.
RDS-INJ-001.what=Posible inyección de comandos detectada
RDS-INJ-001.why=El comando contiene caracteres peligrosos (;, saltos de línea, $(), backticks) que pueden permitir inyección.
RDS-INJ-001.correctedExample=Evita concatenar entrada del usuario directamente en comandos. Usa clientes parametrizados o Lua con ARGV.
RDS-CMD-001.what=Comando Redis no reconocido
RDS-CMD-001.why=El comando ingresado no está en el catálogo de comandos soportados por el analizador.
RDS-CMD-001.correctedExample=Usa uno de los comandos catalogados: strings, hashes, lists, sets, sorted sets, admin, streams, geo, HLL, scripting, bitfield.
RDS-HMSET-001.what=HMSET está deprecado — usa HSET
RDS-HMSET-001.why=HMSET fue deprecado en Redis 4.0 y puede ser eliminado en versiones futuras.
RDS-HMSET-001.correctedExample=Reemplaza HMSET con HSET. Desde Redis 4.0, HSET acepta múltiples pares campo/valor directamente.
RDS-KEYS-001.what=KEYS * bloquea el servidor
RDS-KEYS-001.why=KEYS * realiza un escaneo completo y bloqueante de todas las claves. Puede congelar Redis en producción.
RDS-KEYS-001.correctedExample=Usa SCAN con cursor y MATCH para iterar claves sin bloquear el servidor, o mantén un conjunto índice.
RDS-KEYS-002.what=KEYS con patrón también escanea todo el keyspace
RDS-KEYS-002.why=KEYS user:* no es seguro en producción: Redis recorre todas las claves y filtra por patrón, bloqueando el servidor.
RDS-KEYS-002.correctedExample=SCAN 0 MATCH user:* COUNT 100
RDS-FLUSH-001.what=Operación destructiva: elimina TODAS las claves
RDS-FLUSH-001.why=FLUSHDB elimina todas las claves de la base de datos actual. FLUSHALL las elimina en todas las bases de datos.
RDS-FLUSH-001.correctedExample=Agrega CONFIRM como último argumento solo en entornos controlados, o elimina el comando completamente.
RDS-SESS-001.what=Clave de sesión sin expiración — posible fuga de memoria
RDS-SESS-001.why=Una clave con nombre 'session' o 'token' fue establecida sin tiempo de expiración.
RDS-SESS-001.correctedExample=Agrega EX/PX/EXAT/PXAT al SET o usa EXPIRE para que las claves de sesión/token sean eviccionadas automáticamente.
RDS-ARGS-001.what=Número de argumentos incorrecto
RDS-ARGS-001.why=El comando recibió una cantidad de argumentos inválida según su firma oficial.
RDS-ARGS-001.correctedExample=Revisa la firma del comando en la documentación oficial de Redis.
RDS-TX-001.what=WATCH dentro de una transacción activa
RDS-TX-001.why=WATCH debe llamarse antes de MULTI, no dentro del bloque de transacción.
RDS-TX-001.correctedExample=Llama WATCH en las claves antes de abrir MULTI, o usa UNWATCH antes de iniciar la transacción.
RDS-TX-002.what=EXEC sin MULTI previo
RDS-TX-002.why=EXEC fue llamado sin haber abierto una transacción con MULTI.
RDS-TX-002.correctedExample=Envía MULTI primero, encola los comandos y luego ejecuta EXEC.
RDS-TX-003.what=DISCARD sin bloque MULTI activo
RDS-TX-003.why=DISCARD solo aplica después de MULTI y antes de que EXEC haya sido ejecutado.
RDS-TX-003.correctedExample=Abre una transacción con MULTI antes de usar DISCARD.
RDS-TX-004.what=Comandos bloqueantes dentro de MULTI/EXEC
RDS-TX-004.why=BLPOP/BRPOP/BRPOPLPUSH dentro de transacciones pueden causar comportamiento inesperado.
RDS-TX-004.correctedExample=Evita BLPOP/BRPOP/BRPOPLPUSH dentro de MULTI/EXEC. Usa LPOP/RPOP o diseña la lógica fuera de la transacción.
RDS-PUB-001.what=Mezcla de SUBSCRIBE y PSUBSCRIBE
RDS-PUB-001.why=Usar SUBSCRIBE y PSUBSCRIBE en la misma conexión está permitido pero puede generar confusión en el mantenimiento.
RDS-PUB-001.correctedExample=Usa un solo estilo o documenta claramente qué canales son por patrón y cuáles son exactos.
RDS-PUB-002.what=Nombre de canal vacío en PUBLISH
RDS-PUB-002.why=Se intentó publicar en un canal con nombre vacío.
RDS-PUB-002.correctedExample=Usa un nombre de canal no vacío como argumento de PUBLISH.
RDS-PUB-003.what=PUBSUB CHANNELS * puede ser lento
RDS-PUB-003.why=Listar todos los canales con PUBSUB CHANNELS * puede ser lento en instancias Redis de alto tráfico.
RDS-PUB-003.correctedExample=Usa un patrón más específico o monitorea el conteo de canales en staging antes de ejecutar en producción.
RDS-XStream-001.what=XREADGROUP requiere GROUP grupo consumidor
RDS-XStream-001.why=XREADGROUP necesita los argumentos GROUP con nombre de grupo y nombre de consumidor.
RDS-XStream-001.correctedExample=Agrega GROUP migrupo miconsumidor después de las opciones y las claves de stream.
RDS-XStream-002.what=El stream puede no existir — usa MKSTREAM
RDS-XStream-002.why=XGROUP CREATE sobre un stream que no existe fallará sin MKSTREAM.
RDS-XStream-002.correctedExample=Agrega MKSTREAM al final de XGROUP CREATE para crear el stream automáticamente si no existe.
RDS-XStream-003.what=XPENDING sin rango devuelve solo resumen
RDS-XStream-003.why=Sin los parámetros start/end/count, XPENDING devuelve únicamente un resumen agregado.
RDS-XStream-003.correctedExample=Pasa start/end/count después de key y group para inspeccionar entradas pendientes específicas.
RDS-XStream-004.what=XADD MAXLEN sin ~ usa truncado exacto (lento)
RDS-XStream-004.why=El truncado exacto con MAXLEN \\= es mucho más costoso que el truncado aproximado con ~.
RDS-XStream-004.correctedExample=Usa MAXLEN ~ N para truncado aproximado a menos que necesites una longitud estrictamente exacta.
RDS-XStream-010.what=XADD requiere clave, ID y al menos un par campo-valor
RDS-XStream-010.why=XADD necesita: clave de stream, ID (* para auto) y al menos un par campo/valor.
RDS-XStream-010.correctedExample=Formato correcto: XADD key * campo valor [campo valor ...] (con MAXLEN/~ opcionales).
RDS-GEO-001.what=GEORADIUS está deprecado desde Redis 6.2
RDS-GEO-001.why=GEORADIUS y GEORADIUSBYMEMBER fueron reemplazados por GEOSEARCH a partir de Redis 6.2.
RDS-GEO-001.correctedExample=Reescribe usando GEOSEARCH/GEOSEARCHSTORE con las opciones FROMMEMBER/FROMLONLAT.
RDS-GEO-002.what=Latitud fuera del rango válido para GEOADD
RDS-GEO-002.why=La latitud debe estar entre -85.05112878 y 85.05112878 para ser representable en el sistema geoespacial de Redis.
RDS-GEO-002.correctedExample=Verifica el orden (longitud, latitud, nombre) y los rangos válidos en GEOADD.
RDS-GEO-003.what=Longitud fuera del rango válido para GEOADD
RDS-GEO-003.why=La longitud debe estar entre -180 y 180.
RDS-GEO-003.correctedExample=GEOADD espera longitud antes que latitud para cada punto: GEOADD key lon lat member.
RDS-GEO-004.what=Unidad de distancia inválida en GEODIST
RDS-GEO-004.why=La unidad especificada no es válida para GEODIST.
RDS-GEO-004.correctedExample=Usa una de las unidades válidas como último argumento: m, km, mi o ft.
RDS-HLL-001.what=PFCOUNT con muchas claves — considera PFMERGE primero
RDS-HLL-001.why=PFCOUNT con más de 10 claves realiza una fusión cross-slot costosa en entornos Redis Cluster.
RDS-HLL-001.correctedExample=Usa PFMERGE para fusionar en una sola clave y luego PFCOUNT una vez.
RDS-HLL-002.what=Clave destino de PFMERGE también es fuente
RDS-HLL-002.why=PFMERGE tiene la misma clave como destino y fuente. Es válido pero puede ser confuso.
RDS-HLL-002.correctedExample=Verifica que fusionar una clave HyperLogLog consigo misma sea intencional.
RDS-Script-001.what=SCRIPT FLUSH elimina todos los scripts en caché
RDS-Script-001.why=SCRIPT FLUSH borra todos los scripts Lua del caché del servidor Redis. No ejecutar en producción sin precaución.
RDS-Script-001.correctedExample=Usa solo en entornos dev/staging o durante mantenimiento controlado.
RDS-Script-002.what=Script largo — considera EVALSHA con SCRIPT LOAD
RDS-Script-002.why=Los scripts largos se reenvían completos en cada llamada a EVAL. EVALSHA evita retransmitir el script.
RDS-Script-002.correctedExample=Carga el script una vez con SCRIPT LOAD y luego usa EVALSHA con el digest SHA1 resultante.
RDS-Script-003.what=Accede a claves Redis a través del array KEYS en scripts
RDS-Script-003.why=Los scripts Lua que acceden a claves sin usar KEYS[] pueden no funcionar correctamente en Redis Cluster.
RDS-Script-003.correctedExample=Reemplaza los argumentos de clave literales con KEYS[1], KEYS[2], ... según el valor de numkeys.
RDS-BIT-001.what=El offset del bitfield debe ser no negativo
RDS-BIT-001.why=GET/SET/INCRBY dentro de BITFIELD no admiten offsets negativos.
RDS-BIT-001.correctedExample=Usa offsets no negativos (enteros ≥ 0) para GET/SET/INCRBY en BITFIELD.
RDS-BIT-002.what=BITCOUNT sobre clave inexistente devuelve 0
RDS-BIT-002.why=Esto no es un error — Redis trata una clave inexistente como un bitmap de ceros.
RDS-BIT-002.correctedExample=No se requiere ningún cambio. El comportamiento es correcto y esperado.
RDS-BIT-003.what=BITOP NOT requiere exactamente una clave fuente
RDS-BIT-003.why=BITOP NOT solo acepta una clave fuente, no múltiples.
RDS-BIT-003.correctedExample=Usa el formato: BITOP NOT claveDestino claveFuente
CQL-FILTER-001.what=ALLOW FILTERING detectado — riesgo de full scan
CQL-FILTER-001.why=ALLOW FILTERING fuerza a Cassandra a escanear todas las particiones del clúster para resolver la query. En tablas grandes esto causa timeouts y degradación severa del rendimiento.
CQL-FILTER-001.correctedExample=Agrega la partition key al WHERE para restringir el escaneo. Si necesitas filtrar por esta columna frecuentemente, considera una tabla de consulta dedicada.
CQL-FULLSCAN-001.what=SELECT sin WHERE — full scan del clúster
CQL-FULLSCAN-001.why=Un SELECT sin cláusula WHERE lee todas las particiones del clúster, lo que es extremadamente costoso en Cassandra y puede causar timeouts en tablas con millones de filas.
CQL-FULLSCAN-001.correctedExample=Agrega una cláusula WHERE con la partition key para restringir el escaneo al mínimo necesario.
CQL-NOWHERE-001.what=UPDATE sin WHERE — afecta particiones indeterminadas
CQL-NOWHERE-001.why=Un UPDATE sin cláusula WHERE en Cassandra puede afectar filas no deseadas y la mayoría de los drivers rechazarán esta operación.
CQL-NOWHERE-001.correctedExample=Especifica la partition key en WHERE para apuntar exactamente a las filas que deseas actualizar.
CQL-NOWHERE-002.what=DELETE sin WHERE — eliminación masiva no controlada
CQL-NOWHERE-002.why=Un DELETE sin cláusula WHERE puede eliminar filas no deseadas. Es una operación peligrosa en clústeres de producción.
CQL-NOWHERE-002.correctedExample=Especifica la partition key en WHERE para apuntar exactamente a las filas que deseas eliminar.
CQL-JOIN-001.what=JOIN no soportado en Cassandra
CQL-JOIN-001.why=Cassandra no soporta operaciones JOIN entre tablas. El modelo de datos está diseñado para queries por tabla única optimizadas por partition key.
CQL-JOIN-001.correctedExample=Denormaliza el modelo de datos o realiza queries separadas y combina los resultados del lado del cliente.
CQL-ORDERBY-001.what=ORDER BY solo válido en clustering columns
CQL-ORDERBY-001.why=ORDER BY en CQL solo es válido para columnas de clustering key, y solo puede ordenar en el sentido opuesto al definido en la tabla. Un ORDER BY en otras columnas fallará en tiempo de ejecución.
CQL-ORDERBY-001.correctedExample=Asegúrate de que la columna en ORDER BY sea una clustering column. Si necesitas otro orden, considera una tabla de consulta con diferente clustering order.
CQL-TTL-001.what=TTL muy corto (menos de 60 segundos)
CQL-TTL-001.why=El TTL especificado es menor a 60 segundos, lo que puede causar expiración inesperada de datos en producción.
CQL-TTL-001.correctedExample=Usa TTL >\\= 60 segundos o elimina el TTL si los datos deben ser persistentes.
CQL-EMPTY.what=Consulta CQL vacía
CQL-EMPTY.why=No se proporcionó ningún contenido CQL para analizar.
CQL-EMPTY.correctedExample=Escribe una consulta CQL válida, por ejemplo: SELECT * FROM tabla WHERE id \\= ? o INSERT INTO tabla (col) VALUES (?).
CQL-LEX.what=Error léxico en la consulta CQL
CQL-LEX.why=El analizador encontró un carácter o secuencia que no pudo interpretar como token CQL válido.
CQL-LEX.correctedExample=Revisa la sintaxis del query y corrige el error señalado para continuar.
CQL-SYN-001.what=Error de sintaxis en CQL
CQL-SYN-001.why=La consulta CQL no es válida en la línea o columna indicada.
CQL-SYN-001.correctedExample=Revisa la sintaxis CQL y corrige el error señalado; revisa comillas, tipos y palabras clave.
CQL-STRUCT-START.what=La consulta CQL no comienza con un comando válido
CQL-STRUCT-START.why=Una sentencia CQL debe comenzar con SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, BATCH u otro comando válido.
CQL-STRUCT-START.correctedExample=Inicia la sentencia con un comando CQL válido: SELECT, INSERT INTO, UPDATE, DELETE FROM, etc.
CQL-STRUCT-SELECT.what=SELECT sin cláusula FROM
CQL-STRUCT-SELECT.why=Toda sentencia SELECT en CQL debe especificar la tabla de origen con FROM.
CQL-STRUCT-SELECT.correctedExample=Usa SELECT columnas FROM keyspace.tabla WHERE condición.
CQL-STRUCT-INSERT.what=INSERT sin INTO
CQL-STRUCT-INSERT.why=La sintaxis de INSERT en CQL requiere la palabra clave INTO seguida del nombre de la tabla.
CQL-STRUCT-INSERT.correctedExample=Usa el formato: INSERT INTO tabla [(columnas)] VALUES (...) [USING TTL n].
CQL-STRUCT-INSERT-VALUES.what=INSERT sin cláusula VALUES
CQL-STRUCT-INSERT-VALUES.why=Una sentencia INSERT debe incluir VALUES (...) con los datos a insertar.
CQL-STRUCT-INSERT-VALUES.correctedExample=Proporciona una cláusula VALUES o usa INSERT JSON si tu driver lo soporta.
CQL-STRUCT-UPDATE.what=UPDATE sin cláusula SET
CQL-STRUCT-UPDATE.why=Toda sentencia UPDATE en CQL debe especificar las columnas a modificar con SET.
CQL-STRUCT-UPDATE.correctedExample=Usa el formato: UPDATE tabla [USING TTL n] SET col \\= valor [, ...] WHERE condición.
CQL-STRUCT-DELETE.what=DELETE sin cláusula FROM
CQL-STRUCT-DELETE.why=La sentencia DELETE en CQL debe especificar la tabla origen con FROM.
CQL-STRUCT-DELETE.correctedExample=Usa el formato: DELETE [columnas] FROM tabla WHERE condición.
CQL-STRUCT-CREATE-TABLE.what=Estructura de CREATE TABLE incompleta o inválida
CQL-STRUCT-CREATE-TABLE.why=La sentencia CREATE TABLE no sigue la estructura mínima requerida por CQL. Falta el nombre de la tabla o la lista de definición de columnas.
CQL-STRUCT-CREATE-TABLE.correctedExample=Usa: CREATE TABLE [IF NOT EXISTS] tabla (columna tipo [PRIMARY KEY], ..., PRIMARY KEY ((pk), ck)).
CQL-BATCH-001.what=BATCH no termina con APPLY BATCH
CQL-BATCH-001.why=Un bloque BATCH debe cerrarse obligatoriamente con APPLY BATCH. Sin este cierre la sentencia es inválida y será rechazada por Cassandra.
CQL-BATCH-001.correctedExample=Agrega APPLY BATCH; al final del bloque para completar la transacción por lotes.
CQL-BATCH-002.what=BATCH COUNTER contiene sentencias no-contador
CQL-BATCH-002.why=Un BATCH marcado como COUNTER solo puede contener actualizaciones de columnas counter. INSERT, DELETE y updates regulares no están permitidos dentro de este tipo de batch.
CQL-BATCH-002.correctedExample=Mueve las sentencias INSERT/DELETE/UPDATE regulares fuera del BATCH COUNTER, o cambia el tipo de batch.
CQL-BATCH-003.what=BATCH UNLOGGED abarca múltiples tablas
CQL-BATCH-003.why=Los BATCH no registrados que abarcan varias tablas pierden la atomicidad. Solo el mismo token de partición garantiza atomicidad en Cassandra.
CQL-BATCH-003.correctedExample=Limita el BATCH UNLOGGED a una sola tabla/partición, o usa sentencias separadas para mayor claridad.
CQL-BATCH-004.what=BATCH demasiado grande — anti-patrón en Cassandra
CQL-BATCH-004.why=Los BATCH grandes aumentan la presión en memoria del coordinador y pueden causar timeouts. Son un anti-patrón conocido en Cassandra.
CQL-BATCH-004.correctedExample=Divide el trabajo en lotes más pequeños o usa escrituras asíncronas con límites de concurrencia en el driver.
CQL-BATCH-005.what=BATCH de rendimiento — prefiere UNLOGGED
CQL-BATCH-005.why=Cuando todos los INSERT apuntan a la misma partición, BATCH puede usarse para rendimiento. UNLOGGED es la opción más eficiente en este caso.
CQL-BATCH-005.correctedExample=Usa BEGIN UNLOGGED BATCH cuando todas las operaciones apunten a la misma partición.
CQL-COL-001.what=Append de lista vacía sin efecto
CQL-COL-001.why=Agregar una lista vacía [] a una columna list no produce ningún cambio en los datos almacenados. La operación es redundante.
CQL-COL-001.correctedExample=Elimina la operación redundante o proporciona elementos en la lista antes de hacer append.
CQL-COL-002.what=Merge de mapa vacío sin efecto
CQL-COL-002.why=Fusionar un mapa vacío {} con una columna map no produce ningún cambio en los datos almacenados. La operación es redundante.
CQL-COL-002.correctedExample=Elimina la operación redundante o proporciona entradas en el mapa antes de hacer merge.
CQL-COL-003.what=No se puede eliminar celda de columna de clave primaria
CQL-COL-003.why=En Cassandra no es posible eliminar entradas individuales de map cuando la clave referenciada es una columna de clave primaria.
CQL-COL-003.correctedExample=Para eliminar la fila completa usa DELETE FROM tabla WHERE partition_key \\= ?.
CQL-COL-004.what=Índice de lista negativo
CQL-COL-004.why=El índice de acceso a una lista en CQL debe ser un entero no negativo. Los índices negativos no son válidos en Cassandra.
CQL-COL-004.correctedExample=Usa un índice de lista válido (>\\= 0) en la expresión de corchetes.
CQL-LIST-001.what=Mutaciones frecuentes en listas son costosas
CQL-LIST-001.why=Las operaciones de mutación en columnas list (append, prepend, por índice) son internamente costosas en Cassandra porque requieren leer antes de escribir.
CQL-LIST-001.correctedExample=Prefiere SET o MAP como tipo de colección, o modela la relación uno-a-muchos con columnas de clustering.
CQL-LWT-001.what=Lightweight Transaction (LWT) — usa protocolo Paxos
CQL-LWT-001.why=INSERT ... IF NOT EXISTS y UPDATE ... IF condition usan el protocolo de consenso Paxos, que tiene una latencia significativamente mayor que las escrituras regulares.
CQL-LWT-001.correctedExample=Usa LWT solo cuando necesites semántica linealizable. Para casos sin conflictos, prefiere INSERT regular.
CQL-LWT-002.what=Condición IF en columna de clave primaria
CQL-LWT-002.why=Las condiciones de LWT (IF condition) no pueden referenciar columnas de partition key ni clustering columns. Solo pueden aplicarse a columnas regulares.
CQL-LWT-002.correctedExample=Mueve las condiciones a columnas regulares únicamente. Las columnas PK van en la cláusula WHERE.
CQL-LWT-003.what=LWT dentro de BATCH — misma partición únicamente
CQL-LWT-003.why=Las Lightweight Transactions dentro de un BATCH están permitidas solo cuando todos los statements apuntan a la misma partición. BATCH LWT cross-partition no está soportado.
CQL-LWT-003.correctedExample=Asegúrate de que todos los statements del BATCH LWT compartan la misma partition key.
CQL-LWT-004.what=BATCH con LWT de múltiples particiones
CQL-LWT-004.why=Cassandra no soporta BATCH que combinen Lightweight Transactions de diferentes particiones. Esto generará un error en tiempo de ejecución.
CQL-LWT-004.correctedExample=Separa los LWT por partición o revisa el diseño para agrupar datos en la misma partición.
CQL-LWT-005.what=Columnas en condición IF no reconocidas
CQL-LWT-005.why=Las columnas referenciadas en la condición IF no corresponden a las columnas definidas en el CREATE TABLE detectado en este script.
CQL-LWT-005.correctedExample=Verifica que los nombres de columnas en IF coincidan exactamente con la definición de la tabla.
CQL-MV-001.what=Vista materializada sin clave primaria completa
CQL-MV-001.why=Una Materialized View debe incluir todas las columnas de clave primaria de la tabla base. Si falta alguna, Cassandra rechazará la sentencia.
CQL-MV-001.correctedExample=Incluye todas las columnas partition key y clustering key de la tabla base en la PRIMARY KEY de la vista.
CQL-MV-002.what=Vista materializada: WHERE sin IS NOT NULL en columnas PK
CQL-MV-002.why=El WHERE de una Materialized View debe incluir IS NOT NULL para todas las columnas de clave primaria. Las filas con PK null no pueden replicarse en vistas.
CQL-MV-002.correctedExample=Agrega AND columna IS NOT NULL en el WHERE para cada columna de partition/clustering key de la tabla base.
CQL-MV-003.what=Demasiadas Materialized Views por tabla
CQL-MV-003.why=Tener más de 3 Materialized Views sobre la misma tabla base multiplica el overhead de escritura en Cassandra, ya que cada escritura debe replicarse en todas las vistas.
CQL-MV-003.correctedExample=Reduce el número de vistas o denormaliza los datos explícitamente en tablas de consulta separadas.
CQL-UDT-001.what=UDT en colección sin wrapper FROZEN
CQL-UDT-001.why=En Cassandra los User-Defined Types usados dentro de colecciones (LIST, SET, MAP) deben estar envueltos con FROZEN<TypeName>. Sin FROZEN el servidor rechazará la sentencia.
CQL-UDT-001.correctedExample=Usa FROZEN<NombreDelTipo> dentro del tipo de colección: LIST<FROZEN<mi_tipo>> o MAP<text, FROZEN<mi_tipo>>.
CQL-UDT-002.what=Operación no soportada en UDT
CQL-UDT-002.why=Cassandra solo permite agregar campos a un User-Defined Type con ALTER TYPE ... ADD. Renombrar o eliminar campos no está soportado y requiere recrear las tablas dependientes.
CQL-UDT-002.correctedExample=Crea un nuevo UDT con la estructura deseada y migra los datos, o recrea las tablas que dependen de este tipo.
CQL-TTL-002.what=TTL de 0 elimina la expiración del dato
CQL-TTL-002.why=Un TTL de 0 no borra el dato — elimina el TTL existente y hace el dato permanente. Este comportamiento es frecuentemente confundido con eliminación.
CQL-TTL-002.correctedExample=Omite USING TTL si quieres que el dato sea permanente, o usa DELETE si quieres eliminarlo.
CQL-TTL-003.what=TTL negativo no es válido
CQL-TTL-003.why=El valor de TTL debe ser un entero positivo que representa el tiempo de vida en segundos. Un TTL negativo es inválido y será rechazado por Cassandra.
CQL-TTL-003.correctedExample=Proporciona un TTL positivo en segundos, por ejemplo: USING TTL 86400 para 24 horas.
CQL-TTL-004.what=TTL() no disponible en columnas de clave primaria
CQL-TTL-004.why=La función TTL() solo puede aplicarse a columnas regulares. Las columnas de partition key y clustering key no tienen TTL individual.
CQL-TTL-004.correctedExample=Usa TTL(columna_regular) seleccionando solo columnas que no sean parte de la clave primaria.
CQL-TTL-005.what=TTL() requiere un nombre de columna específico
CQL-TTL-005.why=TTL(*) no es sintaxis válida en Cassandra. La función TTL() requiere el nombre de una columna específica, no un wildcard.
CQL-TTL-005.correctedExample=Usa TTL(nombre_columna) con una columna regular concreta: SELECT TTL(descripcion) FROM tabla WHERE id \\= ?.
CQL-WT-001.what=WRITETIME no disponible en columnas de clave primaria
CQL-WT-001.why=La función WRITETIME() solo puede aplicarse a columnas regulares. Las columnas de partition key y clustering key no tienen timestamp de escritura individual.
CQL-WT-001.correctedExample=Selecciona WRITETIME(columna_regular) con una columna que no sea parte de la clave primaria.
CQL-WT-002.what=WRITETIME() requiere un nombre de columna específico
CQL-WT-002.why=WRITETIME(*) no es sintaxis válida en Cassandra. La función WRITETIME() requiere el nombre de una columna concreta, no un wildcard.
CQL-WT-002.correctedExample=Usa WRITETIME(nombre_columna) con una columna regular: SELECT WRITETIME(email) FROM usuarios WHERE id \\= ?.
CQL-IDX-001.what=Índice secundario en partition key es redundante
CQL-IDX-001.why=Las columnas de partition key ya están indexadas de forma nativa en Cassandra. Crear un índice secundario sobre ellas es redundante y no mejora el rendimiento.
CQL-IDX-001.correctedExample=Elimina el índice secundario sobre la partition key. Las queries por partition key ya son eficientes sin índice adicional.
CQL-IDX-002.what=Índice secundario sin nombre
CQL-IDX-002.why=Los índices sin nombre reciben nombres autogenerados por Cassandra. Esto dificulta la administración y el mantenimiento a largo plazo.
CQL-IDX-002.correctedExample=Asigna un nombre descriptivo al índice: CREATE INDEX nombre_descriptivo ON tabla (columna).
CQL-IDX-003.what=Índice secundario en columna de alta cardinalidad
CQL-IDX-003.why=Los índices secundarios en Cassandra son ineficientes para columnas con muchos valores únicos (alta cardinalidad) como emails o UUIDs. Cada nodo debe ser consultado en full scan.
CQL-IDX-003.correctedExample=Considera denormalización con tablas de consulta, o usa SASI/SAI (Storage-Attached Index) si tu versión de Cassandra lo soporta.
CQL-IDX-004.what=CREATE CUSTOM INDEX sin clase USING
CQL-IDX-004.why=Un CREATE CUSTOM INDEX requiere especificar la implementación con USING 'clase.del.indice'. Sin esta cláusula la sentencia está incompleta.
CQL-IDX-004.correctedExample=Especifica la clase del índice adjunto: CREATE CUSTOM INDEX ON tabla(columna) USING 'org.apache.cassandra.index.sasi.SASIIndex'.
CQL-DCL-001.what=Operación de permisos DCL detectada
CQL-DCL-001.why=Las sentencias GRANT, REVOKE o CREATE/DROP USER/ROLE afectan la seguridad del clúster. Aplicar permisos incorrectos puede bloquear acceso o crear vulnerabilidades.
CQL-DCL-001.correctedExample=Aplica el principio de menor privilegio. Verifica el alcance del rol y keyspace/tabla antes de ejecutar en producción.
DDB-JOIN.what=DynamoDB PartiQL no admite JOIN
DDB-JOIN.why=PartiQL en DynamoDB no permite combinar tablas con JOIN. Cada sentencia debe operar sobre una sola tabla.
DDB-JOIN.correctedExample=Usa una tabla por sentencia, consulta ítems relacionados con peticiones separadas o diseña claves PK/SK y GSI acordes al patrón de acceso.
DDB-GROUP.what=DynamoDB PartiQL no admite GROUP BY
DDB-GROUP.why=No existe GROUP BY en PartiQL de DynamoDB; la agregación debe hacerse fuera del motor o con datos preagregados.
DDB-GROUP.correctedExample=Preagrega en la aplicación, usa un GSI con totales preparados u otra herramienta de análisis.
DDB-HAVING.what=DynamoDB PartiQL no admite HAVING
DDB-HAVING.why=HAVING no está soportado en PartiQL de DynamoDB porque no hay GROUP BY ni agregaciones SQL clásicas en ese contexto.
DDB-HAVING.correctedExample=Filtra antes de agregar fuera de DynamoDB o rediseña el patrón de acceso.
DDB-WHERE-SELECT.what=SELECT sin WHERE — escaneo de tabla costoso
DDB-WHERE-SELECT.why=En DynamoDB una lectura sin condición de clave de partición suele implicar escaneo amplio (Scan), caro en RCU y latencia.
DDB-WHERE-SELECT.correctedExample=Añade igualdad (u operador de clave admitido) sobre la partition key en WHERE para acotar la lectura.
DDB-SELECT-STAR.what=Evita SELECT * en DynamoDB
DDB-SELECT-STAR.why=Leer todos los atributos consume más capacidad de lectura de la necesaria.
DDB-SELECT-STAR.correctedExample=Lista solo las columnas o atributos necesarios (proyección) para reducir el coste en RCU.
DDB-ORDER.what=ORDER BY solo es eficiente sobre la sort key en una partición
DDB-ORDER.why=En Query, el orden coherente con la clave de ordenación aplica dentro de una misma partition key; en otros casos puede forzar patrones inesperados o costosos.
DDB-ORDER.correctedExample=Asegúrate de que ORDER BY use la sort key dentro de una sola partition key o elimínalo si no aplica tu modelo.
DDB-UPDATE-NO-WHERE.what=UPDATE sin WHERE — falta la clave de partición
DDB-UPDATE-NO-WHERE.why=En DynamoDB PartiQL el UPDATE debe identificar ítems mediante condiciones de clave; sin WHERE la operación no es válida en la práctica.
DDB-UPDATE-NO-WHERE.correctedExample=Añade WHERE con partition key (y sort key si la tabla la define).
DDB-DELETE-NO-WHERE.what=DELETE sin WHERE — falta la clave de partición
DDB-DELETE-NO-WHERE.why=Eliminar sin especificar la clave de partición no define qué ítems borrar de forma segura en DynamoDB.
DDB-DELETE-NO-WHERE.correctedExample=Añade WHERE con partition key (y sort key cuando sea obligatorio).
DDB-PK-NEG.what=Condición de desigualdad o NOT IN sobre clave de partición
DDB-PK-NEG.why=DynamoDB no soporta operadores distintos de igualdad en la partition key como parte de una condición de clave eficiente.
DDB-PK-NEG.correctedExample=Si la columna es la PK, usa igualdad u operadores admitidos; si no es la PK, confirma el esquema. Para NOT IN sobre atributo de clave, valora filtros o rediseño.
DDB-LIKE-LEAD.what=Comodín inicial en LIKE — riesgo de escaneo
DDB-LIKE-LEAD.why=Un patrón LIKE que empieza por '%' no puede usar un índice de prefijo y tiende a escanear muchos datos.
DDB-LIKE-LEAD.correctedExample=Evita '%' al inicio; ancla el prefijo o usa begins_with / consultas por prefijo según el SDK.
DDB-EXPR-EMPTY.what=Expresión DynamoDB vacía
DDB-EXPR-EMPTY.why=No se proporcionó texto para analizar (FilterExpression, KeyConditionExpression, etc.).
DDB-EXPR-EMPTY.correctedExample=Envía una cadena de expresión no vacía.
DDB-EXPR-LEX.what=Error léxico en la expresión DynamoDB
DDB-EXPR-LEX.why=El analizador encontró un carácter o token inválido en la sintaxis de expresión del SDK.
DDB-EXPR-LEX.correctedExample=Corrige la sintaxis cerca de la posición indicada en el mensaje del servidor (o en el detalle devuelto).
DDB-EXPR-PARSE.what=Error de análisis en la expresión DynamoDB
DDB-EXPR-PARSE.why=La expresión no pudo parsearse como árbol válido (paréntesis, operadores o argumentos mal formados).
DDB-EXPR-PARSE.correctedExample=Revisa paréntesis, operadores y argumentos de llamadas a funciones.
DDB-EXPR-INPUT.what=Entrada JSON inválida para el analizador de expresiones
DDB-EXPR-INPUT.why=El payload estructurado debe incluir kind, expression y mapas coherentes cuando apliquen.
DDB-EXPR-INPUT.correctedExample=Proporciona JSON válido con kind y expression según la API del analizador.
DDB-KCE-NO-OR.what=KeyConditionExpression no admite OR
DDB-KCE-NO-OR.why=Las condiciones de clave en Query deben expresarse como una conjunción (AND), no con OR entre ramas.
DDB-KCE-NO-OR.correctedExample=Usa solo AND o emite consultas separadas.
DDB-KCE-PK-META.what=Falta metadata de la partition key
DDB-KCE-PK-META.why=Sin el nombre del atributo de partition key no se puede validar la forma de la KeyConditionExpression.
DDB-KCE-PK-META.correctedExample=Incluye partitionKeyAttributeName y expressionAttributeNames en el JSON de análisis.
DDB-KCE-PK-MISSING.what=KeyConditionExpression debe incluir la partition key
DDB-KCE-PK-MISSING.why=En Query la condición de clave debe referir la partition key con el operador admitido.
DDB-KCE-PK-MISSING.correctedExample=Añade una igualdad entre la ruta de la PK (o su placeholder #) y un valor :placeholder.
DDB-KCE-PK-MULTI.what=Más de una condición sobre la partition key
DDB-KCE-PK-MULTI.why=Solo se permite una condición atómica sobre la partition key en KeyConditionExpression.
DDB-KCE-PK-MULTI.correctedExample=Fusiona la lógica en una sola condición sobre la PK.
DDB-KCE-PK-OP.what=Forma u operador no válido para la partition key
DDB-KCE-PK-OP.why=La partition key en KeyConditionExpression solo admite \\= (no BETWEEN ni IN ni begins_with sobre la PK).
DDB-KCE-PK-OP.correctedExample=Usa \\= entre la ruta de la PK y un único placeholder de valor; usa begins_with solo sobre la sort key si aplica.
DDB-KCE-SK-OP.what=Operador no admitido en la sort key
DDB-KCE-SK-OP.why=La sort key en KeyConditionExpression admite \\=, comparaciones de rango, BETWEEN y begins_with; IN y otros operadores no son válidos ahí.
DDB-KCE-SK-OP.correctedExample=Usa \\=, <, >, <\\=, >\\=, BETWEEN o begins_with según tu caso; IN no está soportado para sort keys en KeyConditionExpression.
DDB-KCE-SK-FUNC.what=Solo begins_with() está permitido en la sort key aquí
DDB-KCE-SK-FUNC.why=En KeyConditionExpression, además de comparadores, la única función típica sobre la sort key es begins_with.
DDB-KCE-SK-FUNC.correctedExample=Elimina otras llamadas a funciones sobre la ruta de la sort key.
DDB-FE-ATTR-EXISTS-ARGS.what=attribute_exists requiere un argumento
DDB-FE-ATTR-EXISTS-ARGS.why=La función attribute_exists debe recibir exactamente una ruta de atributo.
DDB-FE-ATTR-EXISTS-ARGS.correctedExample=Usa attribute_exists(#ruta.atributo).
DDB-FE-ATTR-NOT-EXISTS-ARGS.what=attribute_not_exists requiere un argumento
DDB-FE-ATTR-NOT-EXISTS-ARGS.why=La función attribute_not_exists debe recibir exactamente una ruta de atributo.
DDB-FE-ATTR-NOT-EXISTS-ARGS.correctedExample=Usa attribute_not_exists(#ruta.atributo).
DDB-FE-CONTAINS-ARGS.what=contains requiere dos argumentos
DDB-FE-CONTAINS-ARGS.why=La firma es contains(path, operando).
DDB-FE-CONTAINS-ARGS.correctedExample=Indica la ruta del atributo y el placeholder del valor o subcadena.
DDB-FE-BEGINS-ARGS.what=begins_with requiere dos argumentos
DDB-FE-BEGINS-ARGS.why=La firma es begins_with(path, prefijo).
DDB-FE-BEGINS-ARGS.correctedExample=Indica la ruta del atributo y el placeholder del prefijo.
DDB-FE-SIZE-COMP.what=size() debe ir en una comparación
DDB-FE-SIZE-COMP.why=size(attr) solo tiene sentido comparado con un valor (por ejemplo size(#a) > :n).
DDB-FE-SIZE-COMP.correctedExample=Envuelve size(...) en el lado izquierdo o derecho de \\=, <>, <, >, <\\= o >\\=.
DDB-FE-IN-LARGE.what=IN con muchos valores puede degradar el rendimiento
DDB-FE-IN-LARGE.why=Listas muy largas en IN aumentan presión y tamaño de la expresión.
DDB-FE-IN-LARGE.correctedExample=Divide en lotes o rediseña el patrón de acceso.
DDB-FE-TYPE-MIX.what=Comparar dos rutas de atributo puede dar resultados inesperados
DDB-FE-TYPE-MIX.why=Comparar atributo con atributo sin valores tipados facilita errores semánticos en DynamoDB.
DDB-FE-TYPE-MIX.correctedExample=Compara cada lado con un placeholder de valor con tipo claro cuando sea posible.
DDB-FE-KEY-FILTER.what=Igualdad de PK en FilterExpression
DDB-FE-KEY-FILTER.why=FilterExpression se aplica después de leer; condicionar la partition key ahí desperdicia RCU frente a KeyConditionExpression en Query.
DDB-FE-KEY-FILTER.correctedExample=Promueve la igualdad de partition key a KeyConditionExpression en operaciones Query.
DDB-PE-NAME-MAP.what=Falta entrada en ExpressionAttributeNames
DDB-PE-NAME-MAP.why=Cada placeholder #name debe mapearse al nombre real del atributo.
DDB-PE-NAME-MAP.correctedExample=Añade en expressionAttributeNames la clave # usada en la expresión.
DDB-PE-VAL-MAP.what=ProjectionExpression no debe usar valores : sin mapear
DDB-PE-VAL-MAP.why=Las proyecciones listan rutas de atributo; los placeholders :val pertenecen a ExpressionAttributeValues en otros tipos de expresión.
DDB-PE-VAL-MAP.correctedExample=Quita :valores de ProjectionExpression o mapea solo nombres con # según la API.
DDB-PE-DUP.what=Atributo duplicado en ProjectionExpression
DDB-PE-DUP.why=La misma ruta aparece más de una vez en la lista separada por comas.
DDB-PE-DUP.correctedExample=Elimina rutas repetidas.
DDB-UE-SET-REMOVE.what=SET y REMOVE sobre el mismo atributo
DDB-UE-SET-REMOVE.why=No puedes asignar y eliminar el mismo path en un único UpdateExpression.
DDB-UE-SET-REMOVE.correctedExample=Deja solo SET o solo REMOVE para ese atributo.
DDB-UE-ADD-TYPE.what=ADD solo para Number y Set
DDB-UE-ADD-TYPE.why=La acción ADD en UpdateExpression no aplica a String ni Map.
DDB-UE-ADD-TYPE.correctedExample=Usa SET para cadenas/mapas o ajusta el tipo del atributo.
DDB-UE-DEL-TYPE.what=DELETE solo en conjuntos (sets)
DDB-UE-DEL-TYPE.why=DELETE elimina elementos de conjuntos SS, NS o BS.
DDB-UE-DEL-TYPE.correctedExample=Verifica que el atributo sea un set tipado antes de usar DELETE.
DDB-UE-IFNE-WHERE.what=if_not_exists solo en SET
DDB-UE-IFNE-WHERE.why=if_not_exists no puede usarse en cláusulas REMOVE, ADD o DELETE del mismo UpdateExpression.
DDB-UE-IFNE-WHERE.correctedExample=Mueve if_not_exists a una cláusula SET.
DDB-UE-LAPPEND.what=list_append espera listas
DDB-UE-LAPPEND.why=El segundo argumento de list_append debe corresponder a una lista en ExpressionAttributeValues.
DDB-UE-LAPPEND.correctedExample=Asegura que el segundo operando sea un placeholder mapeado a un array JSON.
DDB-CE-TAUTO.what=Condición siempre verdadera
DDB-CE-TAUTO.why=Comparar el mismo placeholder consigo mismo no evita escrituras no deseadas.
DDB-CE-TAUTO.correctedExample=Compara con un valor distinto o usa attribute_exists / size según el caso.
DDB-CE-PK-EXISTS.what=attribute_exists en la clave primaria es redundante
DDB-CE-PK-EXISTS.why=La clave primaria siempre existe en el ítem almacenado en DynamoDB.
DDB-CE-PK-EXISTS.correctedExample=Puedes omitir attribute_exists sobre la partition key (y sort key).
ES-STRUCT-001.what=Tipo de aggregation usado como tipo de query
ES-STRUCT-001.why=Una clave de aggregation aparece directamente dentro del bloque 'query' en lugar de dentro de 'aggs'.
ES-STRUCT-001.correctedExample=Mueve la aggregation al bloque correcto: {"aggs":{"nombre":{"tipo":{...}}}}
ES-MATCH-ALL.what=match_all sin filtros escanea TODOS los documentos
ES-MATCH-ALL.why=Una query match_all sin filtros recorre el índice completo, lo cual es muy costoso en índices grandes.
ES-MATCH-ALL.correctedExample=Agrega un filtro dentro de bool: {"query":{"bool":{"filter":[...]}}}
ES-WILDCARD-LEAD.what=Wildcard inicial causa full index scan
ES-WILDCARD-LEAD.why=Un patrón que empieza con * o ? no puede usar el índice invertido y escanea todo el índice.
ES-WILDCARD-LEAD.correctedExample=Usa edge n-grams en el mapping del campo en lugar de wildcards con prefijo.
ES-REGEX.what=Regexp query consume mucha CPU
ES-REGEX.why=Las queries de expresión regular se evalúan término a término y pueden desestabilizar el clúster en índices grandes.
ES-REGEX.correctedExample=Usa un campo keyword con terms query, o edge n-grams para búsquedas de prefijo.
ES-SCRIPT.what=Script query ejecuta en cada documento
ES-SCRIPT.why=Los scripts se evalúan por cada documento del índice, lo cual es muy lento e inseguro en producción.
ES-SCRIPT.correctedExample=Indexa el valor calculado en tiempo de escritura y consulta el campo indexado.
ES-SIZE-LIMIT.what=size supera el límite máximo de Elasticsearch (10000)
ES-SIZE-LIMIT.why=Elasticsearch no puede devolver más de 10000 documentos en una sola petición.
ES-SIZE-LIMIT.correctedExample=Usa search_after o la Scroll API para paginación más allá de 10000 resultados.
ES-DEEP-PAGE.what=Paginación profunda (from + size > 10000)
ES-DEEP-PAGE.why=La paginación deep por from+size es costosa y está desactivada por defecto en Elasticsearch.
ES-DEEP-PAGE.correctedExample=Usa search_after para paginación profunda — es stateless y escala bien.
ES-CROSS-001.what=Múltiples queries sin límite de tamaño
ES-CROSS-001.why=Varias queries en el script no tienen 'size' definido y podrían recuperar grandes volúmenes.
ES-CROSS-001.correctedExample=Añade 'size' a cada query para controlar el número de resultados.
ES-CROSS-002.what=Mezcla de tipos de query en el script
ES-CROSS-002.why=El script combina queries de solo agregación con queries de búsqueda. Verifica la intención.
ES-CROSS-002.correctedExample=Separa las queries de agregación y búsqueda si sirven propósitos distintos.
ES-NESTED-DEPTH.what=Query demasiado anidado (profundidad > 5)
ES-NESTED-DEPTH.why=Queries con más de 5 niveles de anidamiento reducen significativamente el rendimiento.
ES-NESTED-DEPTH.correctedExample=Aplana la query o usa bool para combinar condiciones al mismo nivel.
ES-TRACK-TOTAL.what=track_total_hits: false omite el conteo exacto de documentos
ES-TRACK-TOTAL.why=Esta opción mejora el rendimiento pero la respuesta no incluirá el total exacto de documentos.
ES-TRACK-TOTAL.correctedExample=Es una optimización válida. Quítalo si necesitas el total exacto.
ES-SOURCE-FETCH.what=Obtener _source completo es costoso en conjuntos grandes
ES-SOURCE-FETCH.why=Devolver el _source completo transfiere todos los campos aunque no los necesites.
ES-SOURCE-FETCH.correctedExample=Usa 'fields' para seleccionar solo los atributos necesarios en lugar de _source: true.
ES-EXPLAIN.what=explain: true es solo para depuración
ES-EXPLAIN.why=El modo explain calcula y devuelve la puntuación de relevancia detallada, añadiendo sobrecarga significativa.
ES-EXPLAIN.correctedExample=Elimina explain: true antes de usar la query en producción.
ES-PROFILE.what=profile: true es solo para depuración
ES-PROFILE.why=El modo profile mide los tiempos internos de ejecución, añadiendo sobrecarga significativa.
ES-PROFILE.correctedExample=Elimina profile: true antes de usar la query en producción.
ES-DATE-FORMAT.what=Range de fechas sin 'format' puede causar ambigüedad
ES-DATE-FORMAT.why=Sin especificar el formato, Elasticsearch puede interpretar la fecha de forma incorrecta según la configuración del índice.
ES-DATE-FORMAT.correctedExample=Especifica 'format' en la range query para evitar ambigüedad: "format": "yyyy-MM-dd"
ES-DATE-TZ.what=Range de fechas sin time_zone puede dar resultados inesperados
ES-DATE-TZ.why=Sin time_zone, las comparaciones de fechas usan UTC, lo cual puede ser incorrecto para datos multi-zona.
ES-DATE-TZ.correctedExample=Agrega time_zone: '+00:00' o tu zona objetivo a la range query.
ES-DATE-HIST-INTERVAL.what=date_histogram requiere calendar_interval o fixed_interval
ES-DATE-HIST-INTERVAL.why=Sin especificar el intervalo, la aggregation date_histogram no puede agrupar los documentos por tiempo.
ES-DATE-HIST-INTERVAL.correctedExample=Agrega calendar_interval (ej. '1d', '1M') o fixed_interval (ej. '7d', '1h').
ES-DATE-HIST-DEPRECATED.what=El parámetro 'interval' en date_histogram está deprecado desde ES 7.2
ES-DATE-HIST-DEPRECATED.why=El campo 'interval' fue reemplazado por 'calendar_interval' y 'fixed_interval' en Elasticsearch 7.2.
ES-DATE-HIST-DEPRECATED.correctedExample=Reemplaza 'interval' con 'calendar_interval' o 'fixed_interval'.
ES-FUZZY-HIGH.what=fuzziness > 2 impacta el rendimiento sin mejorar el recall
ES-FUZZY-HIGH.why=Valores de fuzziness mayores a 2 generan demasiadas variaciones de término y ralentizan la búsqueda.
ES-FUZZY-HIGH.correctedExample=Usa fuzziness: 1 o 2; considera AUTO para fuzziness adaptada al largo del campo.
ES-REGEXP-STATES.what=Regexp sin límite max_determinized_states puede causar errores de memoria
ES-REGEXP-STATES.why=Las expresiones regulares complejas generan autómatas grandes. Sin límite, pueden agotar la memoria del nodo.
ES-REGEXP-STATES.correctedExample=Agrega max_determinized_states: 10000 para limitar la complejidad del autómata.
ES-MLT-FREQ.what=more_like_this sin min_term_freq incluye términos muy raros
ES-MLT-FREQ.why=Sin min_term_freq, la query incluye términos que aparecen muy pocas veces y aportan poco al resultado.
ES-MLT-FREQ.correctedExample=Establece min_term_freq: 2 para filtrar términos que aparecen solo una vez.
ES-PHRASE-SLOP.what=slop alto en match_phrase reduce significativamente la precisión
ES-PHRASE-SLOP.why=Un slop mayor a 5 permite demasiada distancia entre las palabras de la frase, devolviendo resultados poco relevantes.
ES-PHRASE-SLOP.correctedExample=Mantén slop <\\= 2 para precisión razonable; usa match para búsquedas más amplias.
ES-NESTED-NO-PATH.what=Aggregation nested requiere el campo 'path'
ES-NESTED-NO-PATH.why=Sin 'path', la aggregation nested no sabe qué campo del documento es de tipo nested.
ES-NESTED-NO-PATH.correctedExample=Agrega path: 'nombre_campo' donde nombre_campo es el campo de objeto anidado.
ES-REV-NESTED-CONTEXT.what=reverse_nested debe usarse dentro de una aggregation nested
ES-REV-NESTED-CONTEXT.why=reverse_nested solo tiene sentido como sub-aggregation de nested para volver al documento raíz.
ES-REV-NESTED-CONTEXT.correctedExample=Coloca reverse_nested como sub-aggregation de una aggregation nested.
ES-TERMS-NO-SIZE.what=terms aggregation sin size explícito devuelve solo los 10 primeros
ES-TERMS-NO-SIZE.why=El valor por defecto de size en terms es 10, lo cual puede ocultar buckets relevantes.
ES-TERMS-NO-SIZE.correctedExample=Establece size explícitamente para controlar cuántos buckets se devuelven.
ES-CARDINALITY-THRESHOLD.what=precision_threshold > 40000 usa memoria excesiva con ganancia mínima
ES-CARDINALITY-THRESHOLD.why=Valores de precision_threshold mayores a 40000 consumen mucha memoria sin mejorar significativamente la precisión.
ES-CARDINALITY-THRESHOLD.correctedExample=Establece precision_threshold entre 1000 y 40000 para el mejor balance memoria/precisión.
ES-BUCKET-SCRIPT-PATH.what=bucket_script requiere buckets_path para referenciar aggregations hermanas
ES-BUCKET-SCRIPT-PATH.why=Sin buckets_path, el script de bucket_script no tiene acceso a los valores de las aggregations hermanas.
ES-BUCKET-SCRIPT-PATH.correctedExample=Agrega buckets_path: { var1: 'nombre_agg' } a bucket_script.
ES-BUCKET-SEL-FIELDS.what=bucket_selector requiere buckets_path y script
ES-BUCKET-SEL-FIELDS.why=bucket_selector necesita ambos campos: las referencias a aggregations hermanas y la condición de filtrado.
ES-BUCKET-SEL-FIELDS.correctedExample=Agrega buckets_path (referencias) y script (condición) a bucket_selector.
ES-MOVING-AVG-DEPRECATED.what=moving_avg está deprecado — usa moving_fn
ES-MOVING-AVG-DEPRECATED.why=La aggregation moving_avg fue reemplazada por moving_fn en versiones recientes de Elasticsearch.
ES-MOVING-AVG-DEPRECATED.correctedExample=Reemplaza moving_avg con moving_fn usando MovingFunctions.unweightedAvg(values).
ES-AGG-DEPTH.what=Aggregations anidadas demasiado profundas (> 4 niveles)
ES-AGG-DEPTH.why=Las aggregations con más de 4 niveles de anidamiento impactan la memoria y el rendimiento del clúster.
ES-AGG-DEPTH.correctedExample=Reestructura las aggregations para reducir el anidamiento o usa composite aggregation.
ES-FUNC-SCORE-QUERY.what=function_score sin query evalúa TODOS los documentos
ES-FUNC-SCORE-QUERY.why=Sin una query interna, function_score aplica las funciones de puntuación a todos los documentos del índice.
ES-FUNC-SCORE-QUERY.correctedExample=Agrega una query dentro de function_score para filtrar documentos antes de aplicar las funciones.
ES-FUNC-SCORE-REPLACE.what=boost_mode 'replace' ignora la puntuación original de relevancia
ES-FUNC-SCORE-REPLACE.why=Con boost_mode: replace, la puntuación original de la query es completamente descartada.
ES-FUNC-SCORE-REPLACE.correctedExample=Usa boost_mode: 'multiply' o 'sum' para combinar la puntuación original con la de la función.
ES-SCRIPT-SCORE-LANG.what=script_score sin lang usa 'painless' por defecto
ES-SCRIPT-SCORE-LANG.why=Sin especificar el lenguaje, Elasticsearch asume painless. Es conveniente hacerlo explícito.
ES-SCRIPT-SCORE-LANG.correctedExample=Agrega lang: 'painless' para hacer la intención explícita.
ES-CONST-SCORE-BOOST.what=constant_score sin boost usa 1.0 por defecto
ES-CONST-SCORE-BOOST.why=Sin especificar boost, todos los documentos reciben puntuación 1.0, lo cual puede no ser la intención.
ES-CONST-SCORE-BOOST.correctedExample=Agrega boost: 1.5 (o el valor deseado) para hacer la puntuación explícita.
ES-GEO-DIST-UNIT.what=geo_distance sin unit usa metros por defecto
ES-GEO-DIST-UNIT.why=Sin especificar la unidad, la distancia se interpreta en metros, lo cual puede ser inesperado.
ES-GEO-DIST-UNIT.correctedExample=Agrega unit: 'km', 'mi', 'm', etc. para hacer la intención explícita.
ES-GEO-BBOX-LAT.what=geo_bounding_box: latitud de top_left debe ser mayor que la de bottom_right
ES-GEO-BBOX-LAT.why=Las coordenadas del bounding box están invertidas — top_left debe tener mayor latitud que bottom_right.
ES-GEO-BBOX-LAT.correctedExample=Intercambia top_left y bottom_right, o corrige los valores de latitud.
ES-GEO-SHAPE-REL.what=geo_shape sin relation usa 'intersects' por defecto
ES-GEO-SHAPE-REL.why=Sin especificar la relación espacial, Elasticsearch usa 'intersects', lo cual puede no ser la intención.
ES-GEO-SHAPE-REL.correctedExample=Agrega relation: 'intersects', 'within' o 'contains' para hacer la intención explícita.
ES-KNN-K.what=knn requiere el campo 'k' (número de vecinos más cercanos)
ES-KNN-K.why=Sin 'k', la query knn no sabe cuántos vecinos devolver.
ES-KNN-K.correctedExample=Agrega k: 10 (o el número deseado) a la query knn.
ES-KNN-CANDIDATES.what=knn sin num_candidates puede reducir el recall
ES-KNN-CANDIDATES.why=Sin num_candidates, Elasticsearch usa un valor por defecto que puede no ser suficiente para buena precisión.
ES-KNN-CANDIDATES.correctedExample=Establece num_candidates a al menos 1.5 * k para buena exactitud (ej. k\\=10 → num_candidates\\=15).
MGO-SV-001.what=Falta un campo obligatorio según tus reglas
MGO-SV-001.why=Es como una ficha con casillas obligatorias: dejaste una en blanco y el sistema la devuelve.
MGO-SV-001.correctedExample=Añade el campo con un valor razonable o actualiza las reglas si el requisito cambió.
MGO-SV-002.what=Campo extra no permitido por tus reglas
MGO-SV-002.why=Como llevar un objeto más a una mudanza donde la lista dice solo cinco cajas: sobra algo no aprobado.
MGO-SV-002.correctedExample=Quita el campo inesperado o amplía las reglas para incluirlo en propiedades permitidas.
MGO-SV-003.what=El tipo de dato no encaja con la regla
MGO-SV-003.why=Como poner letras donde pedían un número de teléfono: la forma no coincide.
MGO-SV-003.correctedExample=Adapta el valor al formato esperado o corrige la regla si el modelo de datos cambió.
LUA-001.what=Manejo de errores frágil en el script
LUA-001.why=Como apagar toda la casa si falla una bombilla: mejor un interruptor por habitación.
LUA-001.correctedExample=Usa la variante segura para que los errores se puedan tratar sin abortar todo.
LUA-002.what=Bucle que quizá nunca termina
LUA-002.why=Como una lavadora en ciclo infinito si nadie pulsa fin: pon una forma de parar.
LUA-002.correctedExample=Añade un tope, una condición que cambie o una salida explícita para que no quede colgado.
LUA-003.what=Variable global en el script
LUA-003.why=Como escribir en la pizarra común del aula en vez de en tu cuaderno: todos lo ven y se ensucia.
LUA-003.correctedExample=Declara variables con local para que cada ejecución sea ordenada y más rápida.
LUA-004.what=Claves y script pueden no coincidir en clúster
LUA-004.why=Como un repartidor con tres direcciones en la nota pero visita cuatro: el clúster exige la lista exacta.
LUA-004.correctedExample=Pasa todas las claves en la lista declarada y usa KEYS[n] dentro del script.
LUA-005.what=Argumentos usados como números sin convertir
LUA-005.why=Como sumar etiquetas de precio sin quitar el símbolo de moneda: convierte primero.
LUA-005.correctedExample=Convierte con una función numérica antes de operar.
LUA-006.what=Script muy largo
LUA-006.why=Como un manual de cien páginas en una sola hoja: mejor capítulos manejables.
LUA-006.correctedExample=Divídelo en scripts más pequeños o carga ayudas una vez y reutiliza su hash.
LUA-007.what=Muchas llamadas a Redis dentro de un bucle
LUA-007.why=Como pedir al conserje una cosa por cada escalón en vez de una lista al final.
LUA-007.correctedExample=Agrupa trabajo con pipeline en el cliente fuera de Lua o reduce lo que hace cada vuelta.
RDS-PIP-001.what=Comando arriesgado dentro de una transacción en cola
RDS-PIP-001.why=Como cerrar con llave y luego planear quemar el archivo: hazlo fuera del flujo encadenado.
RDS-PIP-001.correctedExample=Saca escaneos amplios y borrados totales fuera de MULTI/EXEC o evítalos en producción.
RDS-PIP-002.what=Lote enorme de comandos en cola
RDS-PIP-002.why=Como apilar mil platos para un solo viaje: mejor varios viajes manejables.
RDS-PIP-002.correctedExample=Parte en lotes más pequeños o ajusta timeouts solo tras medir tamaños seguros.
RDS-PIP-003.what=Vigilancia sin cierre
RDS-PIP-003.why=Como vigilar la puerta pero nunca decidir si entras o te vas: cierra el flujo.
RDS-PIP-003.correctedExample=Empareja WATCH con MULTI, trabajo en cola y EXEC, o cancela con UNWATCH.
RDS-ACL-001.what=Reglas de cuenta demasiado amplias
RDS-ACL-001.why=Como un pase que abre todos los armarios del edificio: demasiado para una sola persona.
RDS-ACL-001.correctedExample=Reduce categorías y patrones a lo que esa identidad realmente necesita.
RDS-ACL-002.what=Perfil de solo lectura con alcance de claves muy amplio
RDS-ACL-002.why=Como un pase de solo mirar que vale para todo el almacén: aún es sensible si se pierde.
RDS-ACL-002.correctedExample=Ajusta el prefijo de claves a los namespaces reales de tu aplicación.
RDS-ACL-003.what=Borrar el usuario por defecto
RDS-ACL-003.why=Como tirar la única llave maestra sin haber copiado otra.
RDS-ACL-003.correctedExample=Asegura otra cuenta de administración antes de borrar cuentas base.
RDS-MOD-001.what=Dependencia del módulo JSON
RDS-MOD-001.why=Como usar una app que pide un plugin que aún no está instalado en el teléfono.
RDS-MOD-001.correctedExample=Instala y habilita RedisJSON en todos los nodos antes de depender de esto en producción.
RDS-MOD-002.what=Dependencia del módulo de búsqueda
RDS-MOD-002.why=Como pedir catálogo por voz en una tienda que solo tiene estantes sin lector.
RDS-MOD-002.correctedExample=Aprovisiona el módulo de búsqueda y el índice antes de usar FT.* en rutas críticas.
CAS-BATCH-001.what=Lote enorme de sentencias
CAS-BATCH-001.why=Como meter cincuenta maletas en un ascensor pequeño: sube en varios viajes.
CAS-BATCH-001.correctedExample=Parte en lotes más pequeños o usa escrituras asíncronas con límite de concurrencia.
CAS-BATCH-002.what=Lote cruza particiones
CAS-BATCH-002.why=Como mezclar cartas a distintas ciudades en un solo sobre: ordena por destino.
CAS-BATCH-002.correctedExample=Agrupa escrituras que compartan partición o envía lotes separados por partición.
CAS-BATCH-003.what=Buen uso de lote sin registro en una partición
CAS-BATCH-003.why=Como una ruta de reparto solo por un barrio: eficiente cuando todo va al mismo sitio.
CAS-BATCH-003.correctedExample=Mantén el patrón y evita mezclar particiones distintas en el mismo lote.
CAS-BATCH-004.what=Lote registrado donde bastaría sin registro
CAS-BATCH-004.why=Como seguro de envío exprés para una carta al vecino: un modo más ligero basta.
CAS-BATCH-004.correctedExample=Usa BEGIN UNLOGGED BATCH cuando todas las mutaciones compartan la misma partición.
CAS-BATCH-005.what=Lote de contadores mezclado
CAS-BATCH-005.why=Como una fila solo monedas con alguien pagando con mueble: separa lo incompatible.
CAS-BATCH-005.correctedExample=Mueve inserts, borrados y updates normales fuera de ese lote.
CAS-LWT-001.what=Escritura condicional en partición caliente
CAS-LWT-001.why=Como pedir votación para cada paso en una cola enorme: funciona pero se atasca.
CAS-LWT-001.correctedExample=Reparte claves calientes, reduce Paxos o rediseña el acceso.
CAS-LWT-002.what=Varias escrituras condicionales en un lote
CAS-LWT-002.why=Como varias firmas de veto en el mismo sobre: Cassandra las cuenta aparte.
CAS-LWT-002.correctedExample=Como máximo una condicional por lote o ejecútalas fuera del BATCH.
CAS-LWT-003.what=Lee el sí o no del resultado
CAS-LWT-003.why=Como preguntar si el cierre quedó bien en vez de irte sin mirar.
CAS-LWT-003.correctedExample=En la aplicación lee el resultado aplicado o CAS antes de asumir cambios.
CAS-UDF-001.what=No declaraste si la función es estable
CAS-UDF-001.why=Como una receta sin tiempo de horno: el motor necesita saber si el resultado es repetible.
CAS-UDF-001.correctedExample=Añade la cláusula que tu versión de Cassandra admite o mantén el cuerpo sin azar ni efectos raros.
CAS-UDF-002.what=La función podría tardar demasiado dentro de consultas
CAS-UDF-002.why=Como hacer maratón en la cola del banco: todos detrás esperan.
CAS-UDF-002.correctedExample=Simplifica la lógica, baja iteraciones o mueve el trabajo pesado a la aplicación.
CAS-UDF-003.what=La función toca el mundo exterior
CAS-UDF-003.why=Como pedirle al cajero que salga a la calle a mitad de cobro: rompe la caja segura.
CAS-UDF-003.correctedExample=Quita accesos externos; las UDF deben ser puras y rápidas en Cassandra.
CAS-UDA-001.what=Agregado sin valor inicial
CAS-UDA-001.why=Como un marcador sin cero al inicio: define por dónde empieza la cuenta.
CAS-UDA-001.correctedExample=Añade INITCOND con un literal compatible con el tipo de estado, aunque sea null.
CAS-UDA-002.what=Función de estado no aparece en el script
CAS-UDA-002.why=Como citar el capítulo cinco en un libro de cuatro capítulos.
CAS-UDA-002.correctedExample=Define SFUNC antes en la migración o corrige nombre y keyspace.
CAS-TRG-001.what=No podemos verificar la clase del disparador
CAS-TRG-001.why=Como contratar magia sin ensayo general: pruébalo en el escenario real.
CAS-TRG-001.correctedExample=Despliega el JAR en cada nodo y prueba en preproducción.
CAS-TRG-002.what=Disparador sobre datos de sistema
CAS-TRG-002.why=Como instalar una alarma en la sala de calderas municipal: no permitido.
CAS-TRG-002.correctedExample=Usa disparadores solo en tablas de aplicación bajo tus keyspaces.
CAS-DCL-001.what=Rol puede entrar pero sin contraseña
CAS-DCL-001.why=Como un carnet que abre puertas pero sin PIN nunca asignado: inseguro.
CAS-DCL-001.correctedExample=Añade una contraseña fuerte y define LOGIN o SUPERUSER solo cuando haga falta.
CAS-DCL-002.what=Permiso total de conceder o quitar
CAS-DCL-002.why=Como llaves maestras de todo el edificio cuando solo pedían un armario.
CAS-DCL-002.correctedExample=Enumera permisos concretos sobre recursos concretos en lugar de ALL.
CAS-DCL-003.what=Marcado como superusuario
CAS-DCL-003.why=Como dar mando total del aeropuerto a un becario: úsalo muy raro.
CAS-DCL-003.correctedExample=Reserva superusuario para cuentas de emergencia y usa roles acotados en lo demás.
CAS-DCL-004.what=Cambio de permisos a todo un keyspace
CAS-DCL-004.why=Como pintar todo el piso porque manchaste una pared: reduce el pincel.
CAS-DCL-004.correctedExample=Si solo una tabla lo necesita, acota a TABLE keyspace.tabla.
CAS-DCL-005.what=Combinación rara de roles
CAS-DCL-005.why=Como dar la llave de casa a alguien que solo tiene tarjeta de biblioteca: no encaja.
CAS-DCL-005.correctedExample=Activa LOGIN en el rol delegado u otorga un rol pensado para uso interactivo.
CAS-AUTH-001.what=La contraseña se ve débil
CAS-AUTH-001.why=Como un candado de tres ruedas: fácil de adivinar.
CAS-AUTH-001.correctedExample=Usa al menos ocho caracteres mezclando letras, números y símbolos para cuentas humanas.
DDB-TX-001.what=Demasiadas acciones en una sola transacción
DDB-TX-001.why=Como meter cien cartas de golpe en un buzón que solo admite diez.
DDB-TX-001.correctedExample=Divide en varias transacciones u ordena el trabajo para que no todo vaya junto.
DDB-TX-002.what=Lecturas y escrituras mezcladas en la misma API de transacción
DDB-TX-002.why=Como cobrar y inventariar en la misma cola imposible: separa colas.
DDB-TX-002.correctedExample=Usa la API de solo lectura para Gets o quita los Gets de este payload.
DDB-TX-003.what=Comprobación condicional sin regla escrita
DDB-TX-003.why=Como pedir al árbitro que pite sin decirle la regla.
DDB-TX-003.correctedExample=Añade ConditionExpression describiendo qué debe cumplirse.
DDB-TX-004.what=Varias tablas en una transacción
DDB-TX-004.why=Como un contrato para tres casas distintas en un solo sobre: anota el motivo.
DDB-TX-004.correctedExample=Documenta por qué es intencional o parte el trabajo; puedes marcar justificación en la herramienta.
DDB-COND-001.what=Funciones de actualización dentro de una condición
DDB-COND-001.why=Como usar el temporizador del horno para abrir la puerta: cada cosa en su sitio.
DDB-COND-001.correctedExample=Mueve esas comprobaciones a UpdateExpression o usa ítems de transacción adecuados.
DDB-COND-002.what=La comprobación de existencia sin ruta real
DDB-COND-002.why=Como preguntar «¿existe?» sin decir qué cosa.
DDB-COND-002.correctedExample=Pasa un nombre como #pk o status, no un token :valor.
DDB-COND-003.what=Medir tamaño en un campo numérico
DDB-COND-003.why=Como medir el peso del sonido: los números piden comparaciones, no talla.
DDB-COND-003.correctedExample=Compara números con operadores numéricos o guarda longitudes en otro atributo.
DDB-STR-001.what=Flujo de cambios activo sin caducidad de ítems
DDB-STR-001.why=Como grabar cámaras sin política de borrado de cintas: define retención de datos también.
DDB-STR-001.correctedExample=Activa TTL en la tabla si las filas deben borrarse solas además del stream.
DDB-STR-002.what=Consumidor de stream sin cola de mensajes fallidos
DDB-STR-002.why=Como un buzón de devoluciones sin cajón para paquetes rotos.
DDB-STR-002.correctedExample=Añade ruta OnFailure o DeadLetterConfig para que los fallos no boucen sin fin.
DDB-BAK-001.what=En producción las copias continuas parecen apagadas
DDB-BAK-001.why=Como dejar el extintor precintado en estreno: enciende la seguridad en prod.
DDB-BAK-001.correctedExample=Activa copias continuas y prueba restauraciones con calendario.
DDB-BAK-002.what=Restaurar al mismo nombre que el origen
DDB-BAK-002.why=Como copiar un libro encima del original aún en la estantería.
DDB-BAK-002.correctedExample=Restaura a un nombre nuevo y luego cambia tráfico con cuidado.
DDB-BAK-003.what=Recuperación punto en el tiempo desactivada
DDB-BAK-003.why=Como fotos anuales frente a diarias: menos detalle al recuperar.
DDB-BAK-003.correctedExample=Activa PITR cuando la tabla importa y necesitas ventanas finas de restauración.
DDB-API-001.what=Seleccionar todo en una tabla grande
DDB-API-001.why=Como vaciar un almacén por una puerta: ve por tandas y lleva solo lo pedido.
DDB-API-001.correctedExample=Pagina con claves de continuación y proyecta solo lo necesario.
DDB-API-002.what=Actualización sin filtrar la clave de partición
DDB-API-002.why=Como actualizar la agenda sin decir el contacto: nombra la fila primero.
DDB-API-002.correctedExample=Añade WHERE con igualdad de clave de partición y sort key si aplica.
PNL-001.what=Bucle que quizá no termina
PNL-001.why=Como una cinta sin botón de paro visible: asegura una forma de salir.
PNL-001.correctedExample=Añade un tope, cambia la condición en cada paso, o return/break en el cuerpo.
PNL-002.what=Campo no listado en el esquema conocido
PNL-002.why=Como pedir el pasillo doce en un súper de diez pasillos.
PNL-002.correctedExample=Corrige el nombre o actualiza el mapping que pasas al analizador.
PNL-003.what=Cambiar datos guardados en el tipo de script equivocado
PNL-003.why=Como reescribir el libro durante la lectura pública: hazlo en el mostrador de préstamo.
PNL-003.correctedExample=Mueve los cambios a un script de actualización o de ingest.
PNL-004.what=El script debe devolver un valor
PNL-004.why=Como un examen que pide la respuesta final y solo mostraste el desarrollo.
PNL-004.correctedExample=Termina con un return explícito con la puntuación o valor que pide el llamador.
PNL-005.what=Bucle pesado dentro de un script de agregación
PNL-005.why=Como contar frijoles en cada caja mientras la fila del súper espera.
PNL-005.correctedExample=Prefiere doc values, params o métricas precalculadas en lugar de bucles grandes por bucket.
PNL-006.what=Lectura de documento sin red de seguridad
PNL-006.why=Como abrir taquillas sin comprobar número: ten plan si falla.
PNL-006.correctedExample=Envuelve el acceso a doc en try/catch o valores por defecto seguros.
PNL-007.what=Aleatoriedad dentro de la puntuación
PNL-007.why=Como lanzar dados para calificar: el resultado no coincidirá mañana.
PNL-007.correctedExample=Usa pesos fijos o pasa cualquier aleatorio desde fuera con params.
ES-IP-001.what=Pipeline sin manejo de fallos
ES-IP-001.why=Como una fábrica sin botón rojo de parada cuando atasca una máquina.
ES-IP-001.correctedExample=Añade on_failure en pipeline o en cada paso para que los errores se vean.
ES-IP-002.what=Cadena muy larga de processors
ES-IP-002.why=Como veinte pasos en una sola receta: conviene menús por partes.
ES-IP-002.correctedExample=Divide en pipelines más pequeños y encadena con el processor pipeline.
ES-IP-003.what=Referencia a pipeline anidado
ES-IP-003.why=Como enlazar a otro libro sin comprobar si está en la biblioteca.
ES-IP-003.correctedExample=Confirma que el pipeline hijo existe en cada clúster antes de producción.
ES-IP-004.what=Foreach sin processor interno
ES-IP-004.why=Como un bucle que dice «por cada ítem haz…» pero sin decir qué hacer.
ES-IP-004.correctedExample=Añade processor: { "set": { ... } } u otro processor dentro de foreach.
ES-IP-005.what=Lenguaje del script no indicado
ES-IP-005.why=Como enviar pilas sin decir si son recargables: aclara la etiqueta.
ES-IP-005.correctedExample=Escribe lang explícito para que operadores sepan qué motor corre.
ES-IP-006.what=Patrón grok muy complejo
ES-IP-006.why=Como pedir a un solo regex que lea el periódico entero: trocea.
ES-IP-006.correctedExample=Simplifica el patrón o reparte el análisis en varios processors.
ES-IP-007.what=Renombrar tras borrar el mismo campo
ES-IP-007.why=Como borrar la etiqueta y luego pedir leerla: cambia el orden.
ES-IP-007.correctedExample=Reordena para renombrar antes de remove o ajusta nombres.
ES-RX-001.what=Reindex monohilo
ES-RX-001.why=Como mudar un almacén con un solo carrito: alquila más carritos.
ES-RX-001.correctedExample=Pon slices en auto o un entero positivo para paralelizar por shards.
ES-RX-002.what=Script de reindex ignora borrados
ES-RX-002.why=Como empacar sin mirar si el pedido fue cancelado.
ES-RX-002.correctedExample=Protege con if (ctx.op \\=\\= 'index' || ctx.op \\=\\= 'create') { ... }.
ES-RX-003.what=Nota de reindex mismo clúster
ES-RX-003.why=Como fotocopiar en casa frente a enviar a otra oficina: este modo es interno.
ES-RX-003.correctedExample=Para copia entre clústeres añade source.remote con el alias remoto.
ES-ILM-001.what=Fase caliente sin rollover
ES-ILM-001.why=Como un cubo de basura sin plan de vaciado: se llena.
ES-ILM-001.correctedExample=Añade rollover con umbral de edad, tamaño o documentos.
ES-ILM-002.what=Fase delete sin ventana de retención
ES-ILM-002.why=Como tirar papeles sin regla de «guardar un año».
ES-ILM-002.correctedExample=Define min_age, por ejemplo 90d, como ventana clara antes de borrar.
ES-ILM-003.what=Shrink antes de forcemerge
ES-ILM-003.why=Como planchar antes de lavar: invierte el orden habitual.
ES-ILM-003.correctedExample=Prefiere forcemerge antes de shrink para un flujo ILM típico.
ES-ILM-004.what=Fase cold sin congelar
ES-ILM-004.why=Como guardar abrigos sin bolsa al vacío: congelar compacta.
ES-ILM-004.correctedExample=Añade freeze en cold cuando quieras archivo de solo lectura más barato en heap.
ES-ILM-005.what=Política ILM sin fase delete
ES-ILM-005.why=Como un armario sin día de limpieza: se llena.
ES-ILM-005.correctedExample=Añade fase delete u otra limpieza gestionada para datos caducos.
ES-SNP-001.what=Repositorio de snapshots sin compresión
ES-SNP-001.why=Como mudanza sin bolsas al vacío: ocupa más.
ES-SNP-001.correctedExample=Activa compress donde el tipo de repositorio lo permita.
ES-SNP-002.what=Restaurar sin patrón de renombre
ES-SNP-002.why=Como mover muebles a una habitación aún ocupada: etiqueta nuevas habitaciones.
ES-SNP-002.correctedExample=Usa rename_pattern y rename_replacement para aterrizar en nombres nuevos.
ES-SNP-003.what=Repositorio sin pista de verificación
ES-SNP-003.why=Como detector de humo sin recordatorio de prueba: agenda revisiones.
ES-SNP-003.correctedExample=Programa POST _snapshot/repo/_verify o SLM con cron.
ES-SNP-004.what=Snapshot incluye estado global
ES-SNP-004.why=Como respaldar la llave maestra del edificio cuando solo querías un piso.
ES-SNP-004.correctedExample=Prefiere false salvo que quieras restaurar metadatos globales a propósito.
ES-TPL-001.what=Faltan parámetros de plantilla
ES-TPL-001.why=Como un formulario con huecos que la carta pide pero no rellenaste.
ES-TPL-001.correctedExample=Añade cada nombre bajo params o bloques {{^nombre}} por defecto.
ES-TPL-002.what=Parámetros opcionales sin valores por defecto
ES-TPL-002.why=Como toppings opcionales sin línea de «ninguno» en el pedido.
ES-TPL-002.correctedExample=Añade {{^nombre}}...{{/nombre}} para cada opcional que pueda faltar.
ES-TPL-003.what=Plantilla parece ensamblaje inseguro
ES-TPL-003.why=Como pegar frases de desconocidos en un contrato: usa marcadores seguros.
ES-TPL-003.correctedExample=Construye consultas desde campos JSON estructurados, no pegando texto de usuario.
ES-TPL-004.what=Valida la plantilla antes de producción
ES-TPL-004.why=Como ensayar con el micrófono real, no solo en papel.
ES-TPL-004.correctedExample=Llama POST _render/template con params parecidos a producción antes del go-live.
ES-RND-001.what=Parámetros de render alineados
ES-RND-001.why=Como ensayo donde cada actor trajo justo su atributo.
ES-RND-001.correctedExample=Mantén esta práctica de prueba en CI también para plantillas almacenadas por id.
ES-RND-002.what=Claves de params no usadas
ES-RND-002.why=Como meter zapatos de playa en una maleta de negocios que no los nombra.
ES-RND-002.correctedExample=Elimina claves no usadas para peticiones claras.
CQL-BATCH-APPLY.what=Lote sin cerrar correctamente
CQL-BATCH-APPLY.why=Como sellar una carta pero olvidar la frase de cierre que el formulario exige.
CQL-BATCH-APPLY.correctedExample=Cierra el lote con APPLY BATCH antes del punto y coma para que el servidor lo acepte.
CQL-BATCH-LARGE.what=Lote de Cassandra muy grande
CQL-BATCH-LARGE.why=Como meter a todo el edificio en un solo ascensor: varios viajes son más seguros.
CQL-BATCH-LARGE.correctedExample=Divide en lotes más pequeños o usa escrituras asíncronas con concurrencia segura.
DDB-MGMT-JSON.what=JSON inválido para gestión en DynamoDB
DDB-MGMT-JSON.why=Como un formulario ilegible que la oficina devuelve sin procesar.
DDB-MGMT-JSON.correctedExample=Corrige llaves, comas y comillas y vuelve a enviar la petición de gestión.
DDB-STR-VIEW.what=Tipo de vista de stream desconocido
DDB-STR-VIEW.why=Como elegir un modo de cámara que tu modelo no ofrece.
DDB-STR-VIEW.correctedExample=Usa KEYS_ONLY, NEW_IMAGE, OLD_IMAGE o NEW_AND_OLD_IMAGES.
DDB-TX-JSON.what=JSON inválido para transacción
DDB-TX-JSON.why=Como una lista de compra rota por la mitad: el cajero no ve el carrito completo.
DDB-TX-JSON.correctedExample=Valida la estructura JSON y asegura que TransactItems sea un array antes de reintentar.
ES-CROSS-003.what=Estilos de API de Elasticsearch mezclados
ES-CROSS-003.why=Como mezclar cartas, paquetes y trámites legales en un solo sobre: sepáralos por ventanilla.
ES-CROSS-003.correctedExample=Envía cada tipo a su ruta HTTP correcta (/_search, /_ingest/pipeline, /_reindex, etc.).
ES-CROSS-004.what=Varias definiciones de pipeline de ingest juntas
ES-CROSS-004.why=Como apilar varias tarjetas de receta: el horno no elige el orden por ti.
ES-CROSS-004.correctedExample=Documenta dependencias entre pipelines en tu runbook o CI.
LUA-PARSE-ERROR.what=No se pudo analizar el script Lua
LUA-PARSE-ERROR.why=Como un patrón de punto omitido: las siguientes filas no cuadran.
LUA-PARSE-ERROR.correctedExample=Revisa comillas, llaves, estructura if/for/end y comentarios cerca de la línea indicada.
MGO-AGG-PERF-001.what=Pipeline largo sin filtro temprano
MGO-AGG-PERF-001.why=Como lavar todos los platos del edificio antes de elegir qué estantería llenar: filtra primero.
MGO-AGG-PERF-001.correctedExample=Coloca primero un $match selectivo para reducir el conjunto de trabajo.
MGO-ELEM-001.what=Consulta de elemento sin condición real
MGO-ELEM-001.why=Como decir «cualquier fila» sin decir qué columna comprobar.
MGO-ELEM-001.correctedExample=Añade al menos un predicado dentro de $elemMatch, por ejemplo una comparación sobre un campo.
MGO-GEO-IDX-001.what=La consulta geo necesita índice
MGO-GEO-IDX-001.why=Como usar mapas sin mapas descargados: la ruta no carga.
MGO-GEO-IDX-001.correctedExample=Crea el índice geo adecuado antes de depender de estas consultas en producción.
MGO-GEO-NEAR-001.what=Consulta near sin tope de distancia
MGO-GEO-NEAR-001.why=Como pedir todos los restaurantes del mundo ordenados por distancia: di hasta dónde vas.
MGO-GEO-NEAR-001.correctedExample=Añade $maxDistance (y opcionalmente $minDistance) para acotar el radio.
MGO-GEO-POLY-001.what=Anillo del polígono sin cerrar
MGO-GEO-POLY-001.why=Como una valla que no vuelve al primer poste.
MGO-GEO-POLY-001.correctedExample=Cierra cada anillo lineal copiando la primera coordenada al final.
MGO-JS-101.what=Script de servidor lee campos con “this”
MGO-JS-101.why=Como un cuaderno que se reescribe solo: más difícil de revisar con seguridad.
MGO-JS-101.correctedExample=Prefiere operadores de consulta, agregación o $expr en lugar de JavaScript en servidor.
MGO-JS-102.what=Llamada peligrosa en JavaScript de servidor
MGO-JS-102.why=Como dar el mando maestro de tu casa a un desconocido: revoca llamadas riesgosas.
MGO-JS-102.correctedExample=Elimina estas llamadas; pueden permitir abusos o comportamiento inesperado.
MGO-OID-001.what=ObjectId comparado como texto plano
MGO-OID-001.why=Como comparar el número del casillero en papel con la chapita de la llave: formas distintas.
MGO-OID-001.correctedExample=Usa ObjectId("...") o el tipo BSON que espere tu driver.
MGO-PUSH-001.what=Empujar varios valores sin $each
MGO-PUSH-001.why=Como varios platos en una sola etiqueta: usa el divisor del carrito.
MGO-PUSH-001.correctedExample=Envuelve los valores como { $each: [ ... ] } dentro de $push o $addToSet.
MGO-PULL-001.what=Regla $pull vacía
MGO-PULL-001.why=Como «quita todas las pegatinas» sin decir cuál: puede irse todo.
MGO-PULL-001.correctedExample=Añade predicados explícitos a $pull o confirma que quieres vaciar coincidencias.
MGO-TEXT-LANG-001.what=Idioma de búsqueda de texto no reconocido
MGO-TEXT-LANG-001.why=Como corregir ortografía en un idioma sin diccionario instalado.
MGO-TEXT-LANG-001.correctedExample=Elige un código admitido u omite $language para usar el valor por defecto del índice.
PNL-PARSE-ERROR.what=No se pudo analizar el script Painless
PNL-PARSE-ERROR.why=Como una fórmula con un paréntesis de más: la hoja deja de calcular.
PNL-PARSE-ERROR.correctedExample=Revisa llaves, punto y coma, uso de def y comentarios en el error.
RDS-TX-005.what=Transacción abierta al final del script
RDS-TX-005.why=Como dejar la caja a mitad de cobro sin pagar ni anular: el registro queda bloqueado.
RDS-TX-005.correctedExample=Cierra siempre MULTI con EXEC para aplicar o DISCARD para cancelar antes de finalizar.
SEM-001.what=DELETE sin cláusula WHERE
SEM-001.why=Sin WHERE, este comando borraría TODOS los registros de la tabla. Es como decir elimina todos los archivos de la carpeta sin especificar cuál.
SEM-001.correctedExample=DELETE FROM usuarios WHERE id \\= 42;
SEM-002.what=UPDATE sin cláusula WHERE
SEM-002.why=Sin WHERE, este UPDATE cambiaría TODAS las filas. Es como editar cada hoja de un cuaderno cuando solo querías una página.
SEM-002.correctedExample=UPDATE usuarios SET activo \\= false WHERE id \\= 42;
