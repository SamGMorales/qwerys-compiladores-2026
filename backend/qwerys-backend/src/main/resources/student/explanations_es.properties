OPT-001.what=Estás seleccionando TODAS las columnas de la tabla
OPT-001.why=Imagina pedir un libro completo cuando solo necesitas un capítulo — la base de datos trabaja de más
OPT-001.correctedExample=SELECT id, nombre, email FROM usuarios WHERE activo \\= true
OPT-002.what=Esta consulta podría no usar ningún índice
OPT-002.why=Sin índice, la base de datos revisa cada fila una por una, como buscar una palabra en un libro sin índice al final
OPT-002.correctedExample=CREATE INDEX idx_usuario_email ON usuarios(email)
OPT-003.what=Este patrón puede ejecutar una query extra por cada resultado
OPT-003.why=Si tienes 100 usuarios, podrías ejecutar 101 queries en lugar de 1 — muy lento
OPT-003.correctedExample=Usa JOIN para obtener todo en una sola consulta
SEM-001.what=DELETE sin cláusula WHERE eliminará TODOS los registros de la tabla. Agrega WHERE para filtrar qué registros borrar.
SEM-001.why=DELETE sin cláusula WHERE eliminará TODOS los registros de la tabla. Agrega WHERE para filtrar qué registros borrar.
SEM-002.what=UPDATE sin cláusula WHERE modificará TODOS los registros de la tabla. Agrega WHERE para filtrar qué registros actualizar.
SEM-002.why=UPDATE sin cláusula WHERE modificará TODOS los registros de la tabla. Agrega WHERE para filtrar qué registros actualizar.
SE001.what=Falta la lista de columnas después de SELECT.
SE001.why=Falta la lista de columnas después de SELECT.
SE002.what=Falta el nombre de la tabla después de FROM.
SE002.why=Falta el nombre de la tabla después de FROM.
SE003.what=La condición WHERE está incompleta. Usa una expresión completa como: columna \\= valor
SE003.why=La condición WHERE está incompleta. Usa una expresión completa como: columna \\= valor
SE004.what=SELECT * con JOIN puede devolver columnas duplicadas o inesperadas. Especifica las columnas que necesitas.
SE004.why=SELECT * con JOIN puede devolver columnas duplicadas o inesperadas. Especifica las columnas que necesitas.
SE007.what=Posible inyección SQL detectada. Usa consultas parametrizadas en vez de concatenación de strings.
SE007.why=Posible inyección SQL detectada. Usa consultas parametrizadas en vez de concatenación de strings.
SE008.what=Columna duplicada en SELECT. Elimina la referencia duplicada.
SE008.why=Columna duplicada en SELECT. Elimina la referencia duplicada.
SE009.what=La columna de ORDER BY no está en la lista de SELECT.
SE009.why=La columna de ORDER BY no está en la lista de SELECT.
SE010.what=LIMIT sin ORDER BY puede devolver resultados inconsistentes. Agrega ORDER BY para paginación determinista.
SE010.why=LIMIT sin ORDER BY puede devolver resultados inconsistentes. Agrega ORDER BY para paginación determinista.
PARSE-INCOMPLETE.what=La query está incompleta. Revisa que la sintaxis esté cerrada correctamente.
PARSE-INCOMPLETE.why=La query está incompleta. Revisa que la sintaxis esté cerrada correctamente.
PARSE-INCOMPLETE-LIKE.what=LIKE requiere un valor de búsqueda entre comillas, por ejemplo: LIKE '%texto%'
PARSE-INCOMPLETE-LIKE.why=LIKE requiere un valor de búsqueda entre comillas, por ejemplo: LIKE '%texto%'
SYN-001-SQL.what=Error de sintaxis SQL
SYN-001-SQL.why=El analizador detectó un fallo de sintaxis en la posición indicada del texto.
SYN-001-SQL.correctedExample=Corrige la construcción señalada en el mensaje; revisa paréntesis, comas y palabras clave.
SYN-001-PARTIQL.what=Error de sintaxis PartiQL (DynamoDB)
SYN-001-PARTIQL.why=La sentencia PartiQL no es válida en la posición indicada.
SYN-001-PARTIQL.correctedExample=Revisa SELECT/INSERT/UPDATE/DELETE PartiQL y los literales admitidos por DynamoDB.
ES-SYNTAX-001.what=JSON inválido — el query no puede ser analizado
ES-SYNTAX-001.why=El query no es un JSON válido. El analizador no puede continuar.
ES-SYNTAX-001.correctedExample=Verifica la sintaxis JSON: llaves, corchetes, comas y comillas bien balanceados.
SE-LIKE-ALL.what=LIKE '%' coincide con TODOS los registros — equivale a eliminar el WHERE. Especifica un término de búsqueda real.
SE-LIKE-ALL.why=LIKE '%' coincide con TODOS los registros — equivale a eliminar el WHERE. Especifica un término de búsqueda real.
SE-LIKE-SHORT.what=Término de búsqueda demasiado corto (1-2 caracteres). Podría devolver millones de filas. Usa al menos 3 caracteres.
SE-LIKE-SHORT.why=Término de búsqueda demasiado corto (1-2 caracteres). Podría devolver millones de filas. Usa al menos 3 caracteres.
SE-NULL-EQUALS.what=Usa IS NULL o IS NOT NULL para comparar con NULL. Las comparaciones con \\= NULL siempre devuelven falso en SQL.
SE-NULL-EQUALS.why=Usa IS NULL o IS NOT NULL para comparar con NULL. Las comparaciones con \\= NULL siempre devuelven falso en SQL.
SE-BETWEEN-INV.what=El rango BETWEEN está invertido. El primer valor debe ser menor que el segundo. Ej: BETWEEN 1 AND 100.
SE-BETWEEN-INV.why=El rango BETWEEN está invertido. El primer valor debe ser menor que el segundo. Ej: BETWEEN 1 AND 100.
SE-DIV-ZERO.what=División por cero detectada en la expresión. Esto causará un error en tiempo de ejecución.
SE-DIV-ZERO.why=División por cero detectada en la expresión. Esto causará un error en tiempo de ejecución.
SE-EMPTY-STR.what=Comparación con string vacío ('') detectada. Verifica si es intencional o si falta el valor real.
SE-EMPTY-STR.why=Comparación con string vacío ('') detectada. Verifica si es intencional o si falta el valor real.
SE-CARTESIAN.what=Producto cartesiano detectado: múltiples tablas en FROM sin condición de JOIN. Esto multiplica todas las filas entre sí.
SE-CARTESIAN.why=Producto cartesiano detectado: múltiples tablas en FROM sin condición de JOIN. Esto multiplica todas las filas entre sí.
SE-TAUTOLOGY.what=WHERE 1\\=1 no filtra nada — siempre es verdadero. Devuelve todos los registros.
SE-TAUTOLOGY.why=WHERE 1\\=1 no filtra nada — siempre es verdadero. Devuelve todos los registros.
SE-IMPOSSIBLE.what=WHERE 1\\=0 o WHERE FALSE nunca devuelve filas. Esta query siempre retornará vacío.
SE-IMPOSSIBLE.why=WHERE 1\\=0 o WHERE FALSE nunca devuelve filas. Esta query siempre retornará vacío.
SE-SELF-CMP.what=Una columna se compara consigo misma. Esta condición siempre es verdadera y no filtra nada.
SE-SELF-CMP.why=Una columna se compara consigo misma. Esta condición siempre es verdadera y no filtra nada.
SE-BETWEEN-SINGLE.what=BETWEEN con el mismo valor en ambos extremos equivale a un simple \\= . Usa \\= valor en su lugar.
SE-BETWEEN-SINGLE.why=BETWEEN con el mismo valor en ambos extremos equivale a un simple \\= . Usa \\= valor en su lugar.
SE-EMPTY-IN.what=La lista IN () está vacía. Esta condición nunca es verdadera — la query retornará cero filas.
SE-EMPTY-IN.why=La lista IN () está vacía. Esta condición nunca es verdadera — la query retornará cero filas.
SE-CONTRADICTS.what=La misma columna tiene dos valores distintos requeridos con AND. Esto es imposible — ninguna fila puede cumplir ambas condiciones al mismo tiempo.
SE-CONTRADICTS.why=La misma columna tiene dos valores distintos requeridos con AND. Esto es imposible — ninguna fila puede cumplir ambas condiciones al mismo tiempo.
SE-RANGE-IMPOSSIBLE.what=El rango numérico es imposible: la condición exige que el valor sea mayor Y menor al mismo tiempo con valores que se contradicen.
SE-RANGE-IMPOSSIBLE.why=El rango numérico es imposible: la condición exige que el valor sea mayor Y menor al mismo tiempo con valores que se contradicen.
SE-DANGER-SCOPE.what=DELETE o UPDATE con WHERE 1\\=1 afectará TODOS los registros aunque tenga cláusula WHERE. Esto es tan peligroso como no tener WHERE.
SE-DANGER-SCOPE.why=DELETE o UPDATE con WHERE 1\\=1 afectará TODOS los registros aunque tenga cláusula WHERE. Esto es tan peligroso como no tener WHERE.
SE-INSERT-NO-COLS.what=INSERT sin lista de columnas explícita es frágil. Si la tabla cambia (columnas añadidas, eliminadas o reordenadas), este INSERT fallará silenciosamente. Usa: INSERT INTO tabla (col1, col2) VALUES (val1, val2).
SE-INSERT-NO-COLS.why=INSERT sin lista de columnas explícita es frágil. Si la tabla cambia (columnas añadidas, eliminadas o reordenadas), este INSERT fallará silenciosamente. Usa: INSERT INTO tabla (col1, col2) VALUES (val1, val2).
SCH-001.what=Una tabla que usas en la consulta no aparece en el esquema de la base conectada.
SCH-001.why=Puede ser un error de escritura, un esquema distinto (dbo vs public), o que la tabla aún no se haya creado en esa base.
SCH-001.correctedExample=-- Verifica el nombre en el Explorador de esquemas o crea la tabla antes de consultar.
SCH-001-MONGODB.what=La colección no existe en la base de datos conectada
SCH-001-MONGODB.why=La colección no existe en la base de datos conectada
SCH-001-CASSANDRA.what=La tabla no existe en el keyspace conectado
SCH-001-CASSANDRA.why=La tabla no existe en el keyspace conectado
SCH-001-ELASTICSEARCH.what=El índice no existe en el cluster conectado
SCH-001-ELASTICSEARCH.why=El índice no existe en el cluster conectado
SCH-001-REDIS.what=La clave no existe en la base de datos Redis conectada
SCH-001-REDIS.why=La clave no existe en la base de datos Redis conectada
SCH-001-DYNAMODB.what=La tabla no existe en DynamoDB
SCH-001-DYNAMODB.why=La tabla no existe en DynamoDB
SCH-002.what=Una columna de tu consulta no coincide con las columnas reales de la tabla.
SCH-002.why=Revisa mayúsculas, alias (t.col) y si la columna fue renombrada o eliminada en migraciones.
SCH-002.correctedExample=SELECT id, nombre FROM usuarios WHERE activo = 1;
SCH-003.what=Estás comparando tipos de datos que el motor no puede tratar como equivalentes.
SCH-003.why=Por ejemplo texto contra número, o fecha contra cadena sin conversión explícita (CAST/CONVERT).
SCH-003.correctedExample=WHERE fecha_nacimiento >= CAST('2000-01-01' AS DATE)
SCH-CONN.what=No se pudo usar la base de datos real para validar tu consulta.
SCH-CONN.why=La conexión falló (host, puerto, credenciales o ruta de archivo). El análisis de sintaxis siguió, pero sin comprobar tablas reales.
SCH-EMPTY.what=La conexión funcionó, pero no se encontraron tablas o colecciones.
SCH-EMPTY.why=Quizá apuntas a una base vacía, un archivo SQLite nuevo, o un nombre de base incorrecto.
MY001.what=ON DUPLICATE KEY requiere un índice UNIQUE o PRIMARY KEY en la tabla. Sin él, el comportamiento es el de un INSERT normal.
MY001.why=ON DUPLICATE KEY requiere un índice UNIQUE o PRIMARY KEY en la tabla. Sin él, el comportamiento es el de un INSERT normal.
MY002.what=Columna no agregada en SELECT que no está en GROUP BY. MySQL 5.x lo permite con ONLY_FULL_GROUP_BY desactivado, pero MySQL 8+ lo rechaza. Agrega la columna al GROUP BY o usa una función de agregación.
MY002.why=Columna no agregada en SELECT que no está en GROUP BY. MySQL 5.x lo permite con ONLY_FULL_GROUP_BY desactivado, pero MySQL 8+ lo rechaza. Agrega la columna al GROUP BY o usa una función de agregación.
MY003.what=LIMIT sin ORDER BY devuelve filas en orden arbitrario. Agrega ORDER BY para resultados predecibles.
MY003.why=LIMIT sin ORDER BY devuelve filas en orden arbitrario. Agrega ORDER BY para resultados predecibles.
MY004.what=La función PASSWORD() o ENCRYPT() fue eliminada en MySQL 8.0. Usa bcrypt u otro mecanismo de hash a nivel de aplicación.
MY004.why=La función PASSWORD() o ENCRYPT() fue eliminada en MySQL 8.0. Usa bcrypt u otro mecanismo de hash a nivel de aplicación.
MY005.what=JSON_TABLE() requiere MySQL 8.0 o superior. Verifica la versión de tu servidor antes de usar esta función.
MY005.why=JSON_TABLE() requiere MySQL 8.0 o superior. Verifica la versión de tu servidor antes de usar esta función.
MY006.what=La columna AUTO_INCREMENT debe estar definida como clave (PRIMARY KEY o UNIQUE INDEX). MySQL lo exige.
MY006.why=La columna AUTO_INCREMENT debe estar definida como clave (PRIMARY KEY o UNIQUE INDEX). MySQL lo exige.
PG001.what=ILIKE es insensible a mayúsculas pero puede hacer full table scan. Para tablas grandes, crea un índice GIN con pg_trgm: CREATE INDEX ON tabla USING gin(columna gin_trgm_ops).
PG001.why=ILIKE es insensible a mayúsculas pero puede hacer full table scan. Para tablas grandes, crea un índice GIN con pg_trgm: CREATE INDEX ON tabla USING gin(columna gin_trgm_ops).
PG002.what=La cláusula RETURNING está vacía. Especifica al menos una columna: RETURNING id, updated_at.
PG002.why=La cláusula RETURNING está vacía. Especifica al menos una columna: RETURNING id, updated_at.
PG003.what=SERIAL/BIGSERIAL están obsoletos en PostgreSQL 14+. Usa columnas de identidad: columna INT GENERATED ALWAYS AS IDENTITY.
PG003.why=SERIAL/BIGSERIAL están obsoletos en PostgreSQL 14+. Usa columnas de identidad: columna INT GENERATED ALWAYS AS IDENTITY.
PG004.what=Uso incorrecto de operador de array (@>, <@, &&). Deben aparecer entre dos expresiones de array.
PG004.why=Uso incorrecto de operador de array (@>, <@, &&). Deben aparecer entre dos expresiones de array.
PG005.what=LATERAL debe referenciar una subconsulta o una función. Ejemplo: JOIN LATERAL (SELECT ...) AS t ON true.
PG005.why=LATERAL debe referenciar una subconsulta o una función. Ejemplo: JOIN LATERAL (SELECT ...) AS t ON true.
PG006.what=WITH RECURSIVE requiere UNION ALL entre el caso base y el recursivo.
PG006.why=WITH RECURSIVE requiere UNION ALL entre el caso base y el recursivo.
LT001.what=SQLite no soporta RIGHT JOIN ni FULL OUTER JOIN. Reescribe usando LEFT JOIN con el orden de tablas invertido.
LT001.why=SQLite no soporta RIGHT JOIN ni FULL OUTER JOIN. Reescribe usando LEFT JOIN con el orden de tablas invertido.
LT002.what=ALTER TABLE DROP COLUMN requiere SQLite 3.35+. ALTER TABLE RENAME COLUMN requiere SQLite 3.25+. En versiones anteriores, debes recrear la tabla.
LT002.why=ALTER TABLE DROP COLUMN requiere SQLite 3.35+. ALTER TABLE RENAME COLUMN requiere SQLite 3.25+. En versiones anteriores, debes recrear la tabla.
LT003.what=Las claves foráneas en SQLite están desactivadas por defecto. Ejecuta PRAGMA foreign_keys \\= ON al inicio de cada conexión.
LT003.why=Las claves foráneas en SQLite están desactivadas por defecto. Ejecuta PRAGMA foreign_keys \\= ON al inicio de cada conexión.
LT004.what=SQLite no tiene un tipo DATE/DATETIME nativo. Los valores se almacenan como TEXT, REAL o INTEGER. Usa las funciones date() / datetime() / strftime() para comparaciones.
LT004.why=SQLite no tiene un tipo DATE/DATETIME nativo. Los valores se almacenan como TEXT, REAL o INTEGER. Usa las funciones date() / datetime() / strftime() para comparaciones.
LT005.what=Las funciones de ventana (OVER) requieren SQLite 3.25 o superior. Verifica con SELECT sqlite_version().
LT005.why=Las funciones de ventana (OVER) requieren SQLite 3.25 o superior. Verifica con SELECT sqlite_version().
LT006.what=Una tabla WITHOUT ROWID requiere definir una PRIMARY KEY explícita.
LT006.why=Una tabla WITHOUT ROWID requiere definir una PRIMARY KEY explícita.
SS001.what=SELECT TOP sin ORDER BY devuelve filas arbitrarias. Agrega ORDER BY para resultados deterministas.
SS001.why=SELECT TOP sin ORDER BY devuelve filas arbitrarias. Agrega ORDER BY para resultados deterministas.
SS002.what=WITH (NOLOCK) puede devolver lecturas sucias (datos no confirmados). Considera usar READ COMMITTED SNAPSHOT ISOLATION en su lugar.
SS002.why=WITH (NOLOCK) puede devolver lecturas sucias (datos no confirmados). Considera usar READ COMMITTED SNAPSHOT ISOLATION en su lugar.
SS003.what=Tabla temporal creada con SELECT INTO #temp. Recuerda hacer DROP TABLE cuando termines, o la tabla persiste durante la conexión.
SS003.why=Tabla temporal creada con SELECT INTO #temp. Recuerda hacer DROP TABLE cuando termines, o la tabla persiste durante la conexión.
SS004.what=Cursor detectado. Los cursores son mucho más lentos que las operaciones en set. Reescribe usando UPDATE/INSERT/DELETE con JOINs o funciones de ventana.
SS004.why=Cursor detectado. Los cursores son mucho más lentos que las operaciones en set. Reescribe usando UPDATE/INSERT/DELETE con JOINs o funciones de ventana.
SS005.what=Sintaxis de JOIN implícito detectada en WHERE. Usa JOIN ... ON explícito para mayor legibilidad.
SS005.why=Sintaxis de JOIN implícito detectada en WHERE. Usa JOIN ... ON explícito para mayor legibilidad.
SS006.what=MERGE sin cláusula OUTPUT. Considera agregar OUTPUT para capturar las filas insertadas, actualizadas o eliminadas.
SS006.why=MERGE sin cláusula OUTPUT. Considera agregar OUTPUT para capturar las filas insertadas, actualizadas o eliminadas.
SS007.what=@@IDENTITY puede devolver IDs generados por triggers, no solo del INSERT actual. Usa SCOPE_IDENTITY() para obtener el ID del ámbito actual.
SS007.why=@@IDENTITY puede devolver IDs generados por triggers, no solo del INSERT actual. Usa SCOPE_IDENTITY() para obtener el ID del ámbito actual.
SS008.what=Los tipos text, ntext e image están obsoletos desde SQL Server 2005. Reemplaza con: text → varchar(MAX), ntext → nvarchar(MAX), image → varbinary(MAX).
SS008.why=Los tipos text, ntext e image están obsoletos desde SQL Server 2005. Reemplaza con: text → varchar(MAX), ntext → nvarchar(MAX), image → varbinary(MAX).
ORA001.what=Oracle requiere FROM DUAL para SELECT sin tabla real. Ejemplo: SELECT 1+1 FROM DUAL.
ORA001.why=Oracle requiere FROM DUAL para SELECT sin tabla real. Ejemplo: SELECT 1+1 FROM DUAL.
ORA002.what=ROWNUM > n en WHERE siempre devuelve 0 filas. ROWNUM se asigna antes del ORDER BY. Envuelve la query en una subconsulta.
ORA002.why=ROWNUM > n en WHERE siempre devuelve 0 filas. ROWNUM se asigna antes del ORDER BY. Envuelve la query en una subconsulta.
ORA003.what=ROWNUM sin ORDER BY devuelve filas en orden impredecible. Envuelve la query: SELECT * FROM (SELECT * FROM tabla ORDER BY col) WHERE ROWNUM <\\= n.
ORA003.why=ROWNUM sin ORDER BY devuelve filas en orden impredecible. Envuelve la query: SELECT * FROM (SELECT * FROM tabla ORDER BY col) WHERE ROWNUM <\\= n.
ORA004.what=NVL evalúa ambos argumentos aunque el primero no sea NULL. COALESCE hace short-circuit y es más eficiente cuando el segundo argumento es costoso.
ORA004.why=NVL evalúa ambos argumentos aunque el primero no sea NULL. COALESCE hace short-circuit y es más eficiente cuando el segundo argumento es costoso.
ORA005.what=DECODE es exclusivo de Oracle y no es portable. Reemplaza con CASE WHEN estándar.
ORA005.why=DECODE es exclusivo de Oracle y no es portable. Reemplaza con CASE WHEN estándar.
ORA006.what=En Oracle usa VARCHAR2 en lugar de VARCHAR. Oracle reserva el derecho de cambiar la semántica de VARCHAR en versiones futuras.
ORA006.why=En Oracle usa VARCHAR2 en lugar de VARCHAR. Oracle reserva el derecho de cambiar la semántica de VARCHAR en versiones futuras.
ORA007.what=El tipo DATE de Oracle incluye hora y minutos (a diferencia del DATE estándar SQL). Para comparar solo fecha usa TRUNC(fecha_col).
ORA007.why=El tipo DATE de Oracle incluye hora y minutos (a diferencia del DATE estándar SQL). Para comparar solo fecha usa TRUNC(fecha_col).
ORA008.what=CONNECT BY sin START WITH inicia desde TODAS las filas, causando degradación exponencial. Agrega START WITH con tu condición raíz.
ORA008.why=CONNECT BY sin START WITH inicia desde TODAS las filas, causando degradación exponencial. Agrega START WITH con tu condición raíz.
ORA009.what=Conversión implícita de tipo detectada entre CHAR/VARCHAR2 y NUMBER. Esto impide el uso de índices. Usa TO_NUMBER() o almacena los números como NUMBER.
ORA009.why=Conversión implícita de tipo detectada entre CHAR/VARCHAR2 y NUMBER. Esto impide el uso de índices. Usa TO_NUMBER() o almacena los números como NUMBER.
DDL-001.what=La vista selecciona todas las columnas de la tabla base. Si cambia la tabla, la vista puede romperse o mostrar columnas que no esperabas. Indica solo las columnas que necesitas en la definición de la vista.
DDL-001.why=La vista selecciona todas las columnas de la tabla base. Si cambia la tabla, la vista puede romperse o mostrar columnas que no esperabas. Indica solo las columnas que necesitas en la definición de la vista.
DDL-002.what=La definición del índice no deja claro sobre qué columnas debe trabajar. Sin columnas concretas el índice no tiene sentido para el motor. Revisa el CREATE INDEX y enumera las columnas correctas.
DDL-002.why=La definición del índice no deja claro sobre qué columnas debe trabajar. Sin columnas concretas el índice no tiene sentido para el motor. Revisa el CREATE INDEX y enumera las columnas correctas.
DDL-003.what=Alteras la tabla renombrando o quitando una columna. Vistas, informes u otros objetos pueden seguir usando ese nombre y fallar después. Revisa qué depende de esa columna y actualízalo antes de aplicar el cambio.
DDL-003.why=Alteras la tabla renombrando o quitando una columna. Vistas, informes u otros objetos pueden seguir usando ese nombre y fallar después. Revisa qué depende de esa columna y actualízalo antes de aplicar el cambio.
DDL-004.what=Eliminas una tabla sin la opción «si existe». Si el nombre no coincide, todo el script puede detenerse en mitad de un despliegue. Usa IF EXISTS para que el cambio sea más seguro y repetible.
DDL-004.why=Eliminas una tabla sin la opción «si existe». Si el nombre no coincide, todo el script puede detenerse en mitad de un despliegue. Usa IF EXISTS para que el cambio sea más seguro y repetible.
DDL-005.what=Eliminas una base de datos completa; es una operación destructiva e irreversible sin copia de seguridad. Confirma entorno, backup y que nadie usa esa base en producción antes de ejecutar.
DDL-005.why=Eliminas una base de datos completa; es una operación destructiva e irreversible sin copia de seguridad. Confirma entorno, backup y que nadie usa esa base en producción antes de ejecutar.
DCL-001.what=Concedes todos los permisos sobre el objeto. Suele ser más de lo necesario y aumenta el daño si alguien abusa de esa cuenta. Otorga solo SELECT, INSERT, UPDATE o DELETE según lo que cada persona realmente necesite.
DCL-001.why=Concedes todos los permisos sobre el objeto. Suele ser más de lo necesario y aumenta el daño si alguien abusa de esa cuenta. Otorga solo SELECT, INSERT, UPDATE o DELETE según lo que cada persona realmente necesite.
DCL-002.what=Quitas permisos a una cuenta muy privilegiada (por ejemplo un administrador). Podrías perder acceso de mantenimiento sin querer. Verifica el usuario y el impacto antes de aplicar la revocación.
DCL-002.why=Quitas permisos a una cuenta muy privilegiada (por ejemplo un administrador). Podrías perder acceso de mantenimiento sin querer. Verifica el usuario y el impacto antes de aplicar la revocación.
TCL-001.what=Abriste una transacción y no aparece un COMMIT ni un ROLLBACK al cerrar el flujo. Puede dejar bloqueos y cambios sin confirmar. Cierra con COMMIT para guardar o ROLLBACK para deshacer.
TCL-001.why=Abriste una transacción y no aparece un COMMIT ni un ROLLBACK al cerrar el flujo. Puede dejar bloqueos y cambios sin confirmar. Cierra con COMMIT para guardar o ROLLBACK para deshacer.
TCL-002.what=Hay un ROLLBACK sin haber abierto antes una transacción (BEGIN o equivalente). El orden no encaja. Asegúrate de que cada transacción tenga inicio y fin claros.
TCL-002.why=Hay un ROLLBACK sin haber abierto antes una transacción (BEGIN o equivalente). El orden no encaja. Asegúrate de que cada transacción tenga inicio y fin claros.
TCL-003.what=Reutilizas el mismo nombre para más de un punto de retorno dentro de la transacción. Es fácil volver al sitio equivocado en un error. Usa un nombre distinto para cada SAVEPOINT.
TCL-003.why=Reutilizas el mismo nombre para más de un punto de retorno dentro de la transacción. Es fácil volver al sitio equivocado en un error. Usa un nombre distinto para cada SAVEPOINT.
TCL-004.what=El nivel de aislamiento permite leer cambios aún no confirmados por otros. Los resultados pueden ser inconsistentes o «sucios». Si necesitas lecturas estables, sube el nivel de aislamiento.
TCL-004.why=El nivel de aislamiento permite leer cambios aún no confirmados por otros. Los resultados pueden ser inconsistentes o «sucios». Si necesitas lecturas estables, sube el nivel de aislamiento.
SCR-MULTI-001.what=Varias sentencias tienen errores bloqueantes
SCR-MULTI-001.why=Más de una sentencia de este script falla la validación. Corrígelas en orden; las posteriores pueden depender de que las anteriores sean válidas.
SCR-MULTI-001.correctedExample=Despliega cada sentencia numerada, resuelve los errores de arriba a abajo y vuelve a analizar el script completo.
