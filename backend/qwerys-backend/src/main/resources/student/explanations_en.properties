OPT-001.what=Estás seleccionando TODAS las columnas de la tabla
OPT-001.why=Imagina pedir un libro completo cuando solo necesitas un capítulo — la base de datos trabaja de más
OPT-001.correctedExample=SELECT id, nombre, email FROM usuarios WHERE activo \\= true
OPT-001.what=You are selecting ALL columns from the table
OPT-001.why=Like ordering a whole book when you only need one chapter — the database does extra work
OPT-001.correctedExample=SELECT id, name, email FROM users WHERE active \\= true
OPT-002.what=Esta consulta podría no usar ningún índice
OPT-002.why=Sin índice, la base de datos revisa cada fila una por una, como buscar una palabra en un libro sin índice al final
OPT-002.correctedExample=CREATE INDEX idx_usuario_email ON usuarios(email)
OPT-002.what=This query may not use any index
OPT-002.why=Without an index, the database checks every row one by one, like searching a book without an index at the back
OPT-002.correctedExample=CREATE INDEX idx_user_email ON users(email)
OPT-003.what=Este patrón puede ejecutar una query extra por cada resultado
OPT-003.why=Si tienes 100 usuarios, podrías ejecutar 101 queries en lugar de 1 — muy lento
OPT-003.correctedExample=Usa JOIN para obtener todo en una sola consulta
OPT-003.what=This pattern may run an extra query per result
OPT-003.why=With 100 users you might run 101 queries instead of 1 — very slow
OPT-003.correctedExample=Use JOIN to fetch everything in a single query
SEM-001.what=DELETE without WHERE will delete ALL records in the table. Add a WHERE clause to filter which records to delete.
SEM-001.why=DELETE without WHERE will delete ALL records in the table. Add a WHERE clause to filter which records to delete.
SEM-002.what=UPDATE without WHERE will modify ALL records in the table. Add a WHERE clause to filter which records to update.
SEM-002.why=UPDATE without WHERE will modify ALL records in the table. Add a WHERE clause to filter which records to update.
