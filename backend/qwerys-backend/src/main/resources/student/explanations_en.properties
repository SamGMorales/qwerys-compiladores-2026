SCH-CONN.what=The live database could not be used to validate your query.
SCH-CONN.why=Connection failed (host, port, credentials, or file path). Syntax analysis still ran without real schema checks.
SCH-EMPTY.what=Connection succeeded but no tables or collections were found.
SCH-EMPTY.why=You may be pointing at an empty database, a new SQLite file, or the wrong database name.
MY001.what=ON DUPLICATE KEY requires a UNIQUE index or PRIMARY KEY on the table. Without one, this statement behaves as a plain INSERT.
MY001.why=ON DUPLICATE KEY requires a UNIQUE index or PRIMARY KEY on the table. Without one, this statement behaves as a plain INSERT.
MY002.what=Non-aggregated column in SELECT is not in GROUP BY. MySQL 5.x allows this when ONLY_FULL_GROUP_BY is off, but MySQL 8+ enforces it by default. Add the column to GROUP BY or wrap it in an aggregate function.
MY002.why=Non-aggregated column in SELECT is not in GROUP BY. MySQL 5.x allows this when ONLY_FULL_GROUP_BY is off, but MySQL 8+ enforces it by default. Add the column to GROUP BY or wrap it in an aggregate function.
MY003.what=LIMIT without ORDER BY returns rows in an arbitrary order. Add ORDER BY to get predictable results.
MY003.why=LIMIT without ORDER BY returns rows in an arbitrary order. Add ORDER BY to get predictable results.
MY004.what=The PASSWORD() or ENCRYPT() function was removed in MySQL 8.0. Use bcrypt or another application-level hashing mechanism instead.
MY004.why=The PASSWORD() or ENCRYPT() function was removed in MySQL 8.0. Use bcrypt or another application-level hashing mechanism instead.
MY005.what=JSON_TABLE() requires MySQL 8.0 or later. Verify your server version before using this function.
MY005.why=JSON_TABLE() requires MySQL 8.0 or later. Verify your server version before using this function.
MY006.what=An AUTO_INCREMENT column must be defined as a key (PRIMARY KEY or UNIQUE INDEX). MySQL requires this.
MY006.why=An AUTO_INCREMENT column must be defined as a key (PRIMARY KEY or UNIQUE INDEX). MySQL requires this.
PG001.what=ILIKE is case-insensitive but may perform a full table scan. For large tables, create a GIN index with pg_trgm: CREATE INDEX ON table USING gin(column gin_trgm_ops).
PG001.why=ILIKE is case-insensitive but may perform a full table scan. For large tables, create a GIN index with pg_trgm: CREATE INDEX ON table USING gin(column gin_trgm_ops).
PG002.what=The RETURNING clause is empty. Specify at least one column: RETURNING id, updated_at.
PG002.why=The RETURNING clause is empty. Specify at least one column: RETURNING id, updated_at.
PG003.what=SERIAL and BIGSERIAL are deprecated in PostgreSQL 14+. Use identity columns instead: column INT GENERATED ALWAYS AS IDENTITY.
PG003.why=SERIAL and BIGSERIAL are deprecated in PostgreSQL 14+. Use identity columns instead: column INT GENERATED ALWAYS AS IDENTITY.
PG004.what=Malformed PostgreSQL array operator usage (@>, <@, &&). These operators must appear between two array expressions.
PG004.why=Malformed PostgreSQL array operator usage (@>, <@, &&). These operators must appear between two array expressions.
PG005.what=LATERAL must reference a subquery or a set-returning function. Example: JOIN LATERAL (SELECT ...) AS t ON true.
PG005.why=LATERAL must reference a subquery or a set-returning function. Example: JOIN LATERAL (SELECT ...) AS t ON true.
PG006.what=WITH RECURSIVE requires UNION ALL between the base case and the recursive case.
PG006.why=WITH RECURSIVE requires UNION ALL between the base case and the recursive case.
LT001.what=SQLite does not support RIGHT JOIN or FULL OUTER JOIN. Rewrite using LEFT JOIN with the table order reversed.
LT001.why=SQLite does not support RIGHT JOIN or FULL OUTER JOIN. Rewrite using LEFT JOIN with the table order reversed.
LT002.what=ALTER TABLE DROP COLUMN requires SQLite 3.35+. ALTER TABLE RENAME COLUMN requires SQLite 3.25+. On older versions you must recreate the table.
LT002.why=ALTER TABLE DROP COLUMN requires SQLite 3.35+. ALTER TABLE RENAME COLUMN requires SQLite 3.25+. On older versions you must recreate the table.
LT003.what=SQLite foreign key enforcement is disabled by default. Run PRAGMA foreign_keys \\= ON at the start of each connection.
LT003.why=SQLite foreign key enforcement is disabled by default. Run PRAGMA foreign_keys \\= ON at the start of each connection.
LT004.what=SQLite has no native DATE or DATETIME type. Values are stored as TEXT, REAL, or INTEGER. Use date() / datetime() / strftime() functions for comparisons.
LT004.why=SQLite has no native DATE or DATETIME type. Values are stored as TEXT, REAL, or INTEGER. Use date() / datetime() / strftime() functions for comparisons.
LT005.what=Window functions (OVER clause) require SQLite 3.25 or later. Check your version with SELECT sqlite_version().
LT005.why=Window functions (OVER clause) require SQLite 3.25 or later. Check your version with SELECT sqlite_version().
LT006.what=A WITHOUT ROWID table must have an explicit PRIMARY KEY defined.
LT006.why=A WITHOUT ROWID table must have an explicit PRIMARY KEY defined.
SS001.what=SELECT TOP without ORDER BY returns arbitrary rows. Add ORDER BY to get deterministic results.
SS001.why=SELECT TOP without ORDER BY returns arbitrary rows. Add ORDER BY to get deterministic results.
SS002.what=WITH (NOLOCK) may return dirty reads (uncommitted data). Consider using READ COMMITTED SNAPSHOT ISOLATION instead.
SS002.why=WITH (NOLOCK) may return dirty reads (uncommitted data). Consider using READ COMMITTED SNAPSHOT ISOLATION instead.
SS003.what=Temporary table created with SELECT INTO #temp. Remember to DROP TABLE when done, or it will persist for the duration of the connection.
SS003.why=Temporary table created with SELECT INTO #temp. Remember to DROP TABLE when done, or it will persist for the duration of the connection.
SS004.what=CURSOR detected. Cursors are significantly slower than set-based operations. Rewrite using UPDATE/INSERT/DELETE with JOINs or window functions.
SS004.why=CURSOR detected. Cursors are significantly slower than set-based operations. Rewrite using UPDATE/INSERT/DELETE with JOINs or window functions.
SS005.what=Old-style implicit JOIN syntax detected in WHERE clause. Use explicit JOIN ... ON syntax for clarity.
SS005.why=Old-style implicit JOIN syntax detected in WHERE clause. Use explicit JOIN ... ON syntax for clarity.
SS006.what=MERGE statement without OUTPUT clause. Consider adding OUTPUT to capture inserted, updated, or deleted rows.
SS006.why=MERGE statement without OUTPUT clause. Consider adding OUTPUT to capture inserted, updated, or deleted rows.
SS007.what=@@IDENTITY may return IDs generated by triggers, not just the current INSERT. Use SCOPE_IDENTITY() to get the ID from the current scope only.
SS007.why=@@IDENTITY may return IDs generated by triggers, not just the current INSERT. Use SCOPE_IDENTITY() to get the ID from the current scope only.
SS008.what=The data types text, ntext, and image are deprecated since SQL Server 2005. Replace with: text → varchar(MAX), ntext → nvarchar(MAX), image → varbinary(MAX).
SS008.why=The data types text, ntext, and image are deprecated since SQL Server 2005. Replace with: text → varchar(MAX), ntext → nvarchar(MAX), image → varbinary(MAX).
ORA001.what=Oracle requires FROM DUAL for SELECT without a real table. Example: SELECT 1+1 FROM DUAL.
ORA001.why=Oracle requires FROM DUAL for SELECT without a real table. Example: SELECT 1+1 FROM DUAL.
ORA002.what=ROWNUM > n in WHERE always returns zero rows. ROWNUM is assigned before ORDER BY, so the condition is always false. Wrap the query in a subquery.
ORA002.why=ROWNUM > n in WHERE always returns zero rows. ROWNUM is assigned before ORDER BY, so the condition is always false. Wrap the query in a subquery.
ORA003.what=ROWNUM without ORDER BY returns rows in an unpredictable order. Wrap the query: SELECT * FROM (SELECT * FROM table ORDER BY col) WHERE ROWNUM <\\= n.
ORA003.why=ROWNUM without ORDER BY returns rows in an unpredictable order. Wrap the query: SELECT * FROM (SELECT * FROM table ORDER BY col) WHERE ROWNUM <\\= n.
ORA004.what=NVL evaluates both arguments even when the first is not NULL. COALESCE short-circuits and is more efficient when the second argument is expensive to compute.
ORA004.why=NVL evaluates both arguments even when the first is not NULL. COALESCE short-circuits and is more efficient when the second argument is expensive to compute.
ORA005.what=DECODE is Oracle-specific and not portable to other databases. Replace with standard SQL CASE WHEN.
ORA005.why=DECODE is Oracle-specific and not portable to other databases. Replace with standard SQL CASE WHEN.
ORA006.what=Use VARCHAR2 instead of VARCHAR in Oracle. Oracle reserves the right to change VARCHAR semantics in future releases.
ORA006.why=Use VARCHAR2 instead of VARCHAR in Oracle. Oracle reserves the right to change VARCHAR semantics in future releases.
ORA007.what=Oracle DATE includes a time component (unlike ANSI SQL DATE). For date-only comparisons use TRUNC(date_col).
ORA007.why=Oracle DATE includes a time component (unlike ANSI SQL DATE). For date-only comparisons use TRUNC(date_col).
ORA008.what=CONNECT BY without START WITH begins traversal from ALL rows, causing exponential performance degradation. Add START WITH with your root condition.
ORA008.why=CONNECT BY without START WITH begins traversal from ALL rows, causing exponential performance degradation. Add START WITH with your root condition.
ORA009.what=Potential implicit type conversion between CHAR/VARCHAR2 and NUMBER. This prevents index usage and causes full table scans. Use TO_NUMBER() or store numbers as NUMBER type.
ORA009.why=Potential implicit type conversion between CHAR/VARCHAR2 and NUMBER. This prevents index usage and causes full table scans. Use TO_NUMBER() or store numbers as NUMBER type.
DDL-001.what=The view selects every column from the base table. If the table changes, the view may break or expose unexpected columns. List only the columns you really need in the view definition.
DDL-001.why=The view selects every column from the base table. If the table changes, the view may break or expose unexpected columns. List only the columns you really need in the view definition.
DDL-002.what=The index definition does not clearly specify which columns it should cover. An index needs concrete columns to be useful. Fix CREATE INDEX and list the correct columns.
DDL-002.why=The index definition does not clearly specify which columns it should cover. An index needs concrete columns to be useful. Fix CREATE INDEX and list the correct columns.
DDL-003.what=You alter the table by renaming or dropping a column. Views, reports, or other objects may still reference that name and fail afterward. Check dependents and update them before applying the change.
DDL-003.why=You alter the table by renaming or dropping a column. Views, reports, or other objects may still reference that name and fail afterward. Check dependents and update them before applying the change.
DDL-004.what=You drop a table without an "if exists" safeguard. If the name does not match, the whole script can stop mid-deploy. Use IF EXISTS for safer, repeatable scripts.
DDL-004.why=You drop a table without an "if exists" safeguard. If the name does not match, the whole script can stop mid-deploy. Use IF EXISTS for safer, repeatable scripts.
DDL-005.what=You drop an entire database—destructive and hard to undo without backups. Confirm environment, backups, and that nothing production-critical relies on that database before running.
DDL-005.why=You drop an entire database—destructive and hard to undo without backups. Confirm environment, backups, and that nothing production-critical relies on that database before running.
DCL-001.what=You grant all privileges on the object. That is usually more access than people need and increases damage if an account is abused. Grant only SELECT, INSERT, UPDATE, or DELETE as each role truly requires.
DCL-001.why=You grant all privileges on the object. That is usually more access than people need and increases damage if an account is abused. Grant only SELECT, INSERT, UPDATE, or DELETE as each role truly requires.
DCL-002.what=You revoke privileges from a highly privileged account (for example an administrator). You might accidentally lock out maintenance access. Verify the login and impact before applying the revoke.
DCL-002.why=You revoke privileges from a highly privileged account (for example an administrator). You might accidentally lock out maintenance access. Verify the login and impact before applying the revoke.
TCL-001.what=You opened a transaction but no COMMIT or ROLLBACK appears by the end of the flow. Locks and uncommitted changes may linger. Finish with COMMIT to save or ROLLBACK to discard.
TCL-001.why=You opened a transaction but no COMMIT or ROLLBACK appears by the end of the flow. Locks and uncommitted changes may linger. Finish with COMMIT to save or ROLLBACK to discard.
TCL-002.what=There is a ROLLBACK without a matching start of transaction (BEGIN or equivalent). The order does not line up. Ensure each transaction has a clear beginning and end.
TCL-002.why=There is a ROLLBACK without a matching start of transaction (BEGIN or equivalent). The order does not line up. Ensure each transaction has a clear beginning and end.
TCL-003.what=You reuse the same savepoint name more than once inside the transaction. It is easy to roll back to the wrong place on error. Give each SAVEPOINT a unique name.
TCL-003.why=You reuse the same savepoint name more than once inside the transaction. It is easy to roll back to the wrong place on error. Give each SAVEPOINT a unique name.
TCL-004.what=The isolation level allows reading changes other transactions have not committed yet. Results can be inconsistent or "dirty." If you need stable reads, use a stricter isolation level.
TCL-004.why=The isolation level allows reading changes other transactions have not committed yet. Results can be inconsistent or "dirty." If you need stable reads, use a stricter isolation level.
SCR-MULTI-001.what=Multiple statements failed validation
SCR-MULTI-001.why=More than one statement in this script has blocking errors. Fix them in order; later statements may depend on earlier ones succeeding.
SCR-MULTI-001.correctedExample=Expand each numbered statement below, resolve errors from top to bottom, then re-analyze the whole script.
PROC-001.what=You declare a variable and never use it in the block. Remove it or use it to keep the code clear.
PROC-001.why=You declare a variable and never use it in the block. Remove it or use it to keep the code clear.
PROC-002.what=You use a name that is not declared in this scope. The engine will not know what value to use. Declare it first or fix the spelling.
PROC-002.why=You use a name that is not declared in this scope. The engine will not know what value to use. Declare it first or fix the spelling.
PROC-003.what=The same variable is declared twice in the same scope. Remove the duplicate declaration or rename one of them.
PROC-003.why=The same variable is declared twice in the same scope. Remove the duplicate declaration or rename one of them.
PROC-004.what=You assign to something that is not declared as a variable here. Declare it first or correct the name.
PROC-004.why=You assign to something that is not declared as a variable here. Declare it first or correct the name.
PROC-005.what=The block is empty and does nothing useful. Remove it or add the logic you need.
PROC-005.why=The block is empty and does nothing useful. Remove it or add the logic you need.
PROC-010.what=The IF condition is always true, so the branches are misleading. Simplify the code or fix the condition so it reflects a real decision.
PROC-010.why=The IF condition is always true, so the branches are misleading. Simplify the code or fix the condition so it reflects a real decision.
PROC-011.what=The WHILE condition is always satisfied; the loop may run forever and hang the session. Change the condition or guarantee a clear exit.
PROC-011.why=The WHILE condition is always satisfied; the loop may run forever and hang the session. Change the condition or guarantee a clear exit.
PROC-012.what=The loop has no clear way to exit when it should finish. Add an exit condition (for example EXIT WHEN) so it cannot spin endlessly.
PROC-012.why=The loop has no clear way to exit when it should finish. Add an exit condition (for example EXIT WHEN) so it cannot spin endlessly.
PROC-013.what=The FOR range appears to run backwards without a supported stepping direction. Check the bounds so the iteration matches your intent.
PROC-013.why=The FOR range appears to run backwards without a supported stepping direction. Check the bounds so the iteration matches your intent.
PROC-014.what=The CASE does not say what happens when no branch matches. Add ELSE or make sure every situation is covered.
PROC-014.why=The CASE does not say what happens when no branch matches. Add ELSE or make sure every situation is covered.
PROC-015.what=The procedure calls itself without a clear base case; it can overflow the stack or never stop. Define when recursion must stop.
PROC-015.why=The procedure calls itself without a clear base case; it can overflow the stack or never stop. Define when recursion must stop.
PROC-020.what=You declare a cursor and never open it; it will never run. Open it where needed or remove the declaration.
PROC-020.why=You declare a cursor and never open it; it will never run. Open it where needed or remove the declaration.
PROC-021.what=You open a cursor and never close it. That can leak server resources. Always close the cursor when you are done.
PROC-021.why=You open a cursor and never close it. That can leak server resources. Always close the cursor when you are done.
PROC-022.what=You fetch from the cursor before opening it. Open the cursor first, then fetch.
PROC-022.why=You fetch from the cursor before opening it. Open the cursor first, then fetch.
PROC-023.what=You fetch from the cursor after it was closed. Re-open if you need more rows or fix the order of OPEN, FETCH, and CLOSE.
PROC-023.why=You fetch from the cursor after it was closed. Re-open if you need more rows or fix the order of OPEN, FETCH, and CLOSE.
PROC-024.what=You use a cursor to pull a single row; often a direct query into variables is simpler. Consider SELECT INTO or your engine’s equivalent.
PROC-024.why=You use a cursor to pull a single row; often a direct query into variables is simpler. Consider SELECT INTO or your engine’s equivalent.
PROC-026.what=You OPEN a cursor that is not declared in this block. The engine does not know which query to run. DECLARE the cursor (DECLARE … CURSOR …) before OPEN or fix the name.
PROC-026.why=You OPEN a cursor that is not declared in this block. The engine does not know which query to run. DECLARE the cursor (DECLARE … CURSOR …) before OPEN or fix the name.
PROC-030.what=This block can fail at runtime and has no error handling. Add a way to catch and record failures so they are not silent.
PROC-030.why=This block can fail at runtime and has no error handling. Add a way to catch and record failures so they are not silent.
PROC-031.what=You catch every error without re-raising or logging properly. Failures stay hidden and debugging is painful. Handle specific cases or at least log and re-throw when appropriate.
PROC-031.why=You catch every error without re-raising or logging properly. Failures stay hidden and debugging is painful. Handle specific cases or at least log and re-throw when appropriate.
PROC-032.what=You raise an error without enough message or context. Maintainers will not know what failed. Add a clear message and, if applicable, an error code.
PROC-032.why=You raise an error without enough message or context. Maintainers will not know what failed. Add a clear message and, if applicable, an error code.
PROC-033.what=The error handler only ignores the failure or prints something trivial. The real problem disappears. Log the error and decide whether it should propagate or be fixed.
PROC-033.why=The error handler only ignores the failure or prints something trivial. The real problem disappears. Log the error and decide whether it should propagate or be fixed.
PROC-034.what=The same error situation is handled twice in one block. Remove the duplicate or unify the logic so behavior is predictable.
PROC-034.why=The same error situation is handled twice in one block. Remove the duplicate or unify the logic so behavior is predictable.
PROC-SEM-001.what=You assign to a variable but never read it afterward in conditions or expressions. Remove it or use it where it matters.
PROC-SEM-001.why=You assign to a variable but never read it afterward in conditions or expressions. Remove it or use it where it matters.
PROC-SEM-002.what=You read a variable that was never given a value after declaration. Assign before use or fix the control flow.
PROC-SEM-002.why=You read a variable that was never given a value after declaration. Assign before use or fix the control flow.
PROC-SEM-003.what=This is a function and a path reaches the end without returning a value. Ensure every branch returns or raises a controlled error.
PROC-SEM-003.why=This is a function and a path reaches the end without returning a value. Ensure every branch returns or raises a controlled error.
PROC-SEM-004.what=There is code after an unconditional return or raise; it never runs. Delete it or move logic above the exit.
PROC-SEM-004.why=There is code after an unconditional return or raise; it never runs. Delete it or move logic above the exit.
PROC-SEM-005.what=Recursion has no base case the analyzer can see. Define when it must stop or replace with a bounded loop.
PROC-SEM-005.why=Recursion has no base case the analyzer can see. Define when it must stop or replace with a bounded loop.
PROC-SEM-006.what=The loop condition never changes inside the body; the loop might never finish. Update the controlling variable or condition each iteration.
PROC-SEM-006.why=The loop condition never changes inside the body; the loop might never finish. Update the controlling variable or condition each iteration.
PROC-SEM-007.what=The cursor is opened on one branch and closed on another depending on flow; if paths mismatch it may stay open. Use one clear path to open and close, or a single finally-style block.
PROC-SEM-007.why=The cursor is opened on one branch and closed on another depending on flow; if paths mismatch it may stay open. Use one clear path to open and close, or a single finally-style block.
PROC-SEM-008.what=You compare a variable to itself; the condition does not filter anything useful. Fix the comparison to use two distinct values.
PROC-SEM-008.why=You compare a variable to itself; the condition does not filter anything useful. Fix the comparison to use two distinct values.
PROC-SEM-009.what=What you return does not match the function’s declared type. Align the declared type with the returned value.
PROC-SEM-009.why=What you return does not match the function’s declared type. Align the declared type with the returned value.
PROC-SEM-010.what=You modify an input-only parameter. Callers do not expect side effects on inputs. Use a local variable for internal changes.
PROC-SEM-010.why=You modify an input-only parameter. Callers do not expect side effects on inputs. Use a local variable for internal changes.
OPT-PROC-001.what=You walk rows with a cursor only to update or delete one by one. A single set-based UPDATE or DELETE is usually much faster.
OPT-PROC-001.why=You walk rows with a cursor only to update or delete one by one. A single set-based UPDATE or DELETE is usually much faster.
OPT-PROC-002.what=Inside the loop you run a query per iteration for another row. Batch the work—bulk loads, temp tables, or set operations depending on your engine.
OPT-PROC-002.why=Inside the loop you run a query per iteration for another row. Batch the work—bulk loads, temp tables, or set operations depending on your engine.
OPT-PROC-003.what=The exact same query repeats each iteration while inputs do not change. Move it outside the loop and reuse the result.
OPT-PROC-003.why=The exact same query repeats each iteration while inputs do not change. Move it outside the loop and reuse the result.
OPT-PROC-004.what=You execute dynamic SQL even though the statement text is fixed. Use static SQL so the engine can optimize and the code stays clearer.
OPT-PROC-004.why=You execute dynamic SQL even though the statement text is fixed. Use static SQL so the engine can optimize and the code stays clearer.
OPT-PROC-005.what=You commit or roll back inside the loop. That multiplies engine work and can slow badly. Batch commits at the end when safe.
OPT-PROC-005.why=You commit or roll back inside the loop. That multiplies engine work and can slow badly. Batch commits at the end when safe.
OPT-PROC-006.what=You concatenate long text inside the loop without an efficient accumulator. Use your engine’s recommended string-building approach to avoid extra cost.
OPT-PROC-006.why=You concatenate long text inside the loop without an efficient accumulator. Use your engine’s recommended string-building approach to avoid extra cost.
PROC-ORA-001.what=The procedure does not say whether it runs with the definer’s rights or the invoker’s. Explicitly choose what fits your security and auditing policy.
PROC-ORA-001.why=The procedure does not say whether it runs with the definer’s rights or the invoker’s. Explicitly choose what fits your security and auditing policy.
PROC-ORA-002.what=You select into variables without handling "no row" or "too many rows." Add handling for NO_DATA_FOUND and TOO_MANY_ROWS.
PROC-ORA-002.why=You select into variables without handling "no row" or "too many rows." Add handling for NO_DATA_FOUND and TOO_MANY_ROWS.
PROC-ORA-003.what=A variable type refers to a table that does not appear in the known schema. Verify the table name and that analysis has the right schema context.
PROC-ORA-003.why=A variable type refers to a table that does not appear in the known schema. Verify the table name and that analysis has the right schema context.
PROC-ORA-004.what=Committing or rolling back inside a trigger is unsafe; it can break the main transaction. Keep COMMIT and ROLLBACK out of triggers.
PROC-ORA-004.why=Committing or rolling back inside a trigger is unsafe; it can break the main transaction. Keep COMMIT and ROLLBACK out of triggers.
PROC-ORA-005.what=You mark a transaction autonomous but the intent is unclear. Confirm you really need that behavior or simplify the design.
PROC-ORA-005.why=You mark a transaction autonomous but the intent is unclear. Confirm you really need that behavior or simplify the design.
PROC-ORA-006.what=You bulk-load many rows into a collection without a limit. On large tables that can exhaust memory. Process in batches with a reasonable size.
PROC-ORA-006.why=You bulk-load many rows into a collection without a limit. On large tables that can exhaust memory. Process in batches with a reasonable size.
PROC-ORA-007.what=You bulk-update without saving exceptions per row; one failure can cancel the whole batch. Consider allowing partial failures when your use case allows.
PROC-ORA-007.why=You bulk-update without saving exceptions per row; one failure can cancel the whole batch. Consider allowing partial failures when your use case allows.
PROC-ORA-008.what=For looping query results, an implicit FOR loop over the query is often simpler than an explicit cursor. Prefer the simplest form that meets your need.
PROC-ORA-008.why=For looping query results, an implicit FOR loop over the query is often simpler than an explicit cursor. Prefer the simplest form that meets your need.
PROC-SS-001.what=SQL Server procedures often benefit from turning off extra "rows affected" messages for less client noise. Enable SET NOCOUNT ON at the start when appropriate.
PROC-SS-001.why=SQL Server procedures often benefit from turning off extra "rows affected" messages for less client noise. Enable SET NOCOUNT ON at the start when appropriate.
PROC-SS-002.what=You opened TRY without CATCH. Errors have no defined handling. Always pair TRY with CATCH or another valid strategy.
PROC-SS-002.why=You opened TRY without CATCH. Errors have no defined handling. Always pair TRY with CATCH or another valid strategy.
PROC-SS-003.what=You use the older RAISERROR-style pattern; modern versions prefer THROW for clearer error reporting.
PROC-SS-003.why=You use the older RAISERROR-style pattern; modern versions prefer THROW for clearer error reporting.
PROC-SS-004.what=You opened a cursor without a final DEALLOCATE. Release the cursor when finished so it does not linger in the session.
PROC-SS-004.why=You opened a cursor without a final DEALLOCATE. Release the cursor when finished so it does not linger in the session.
PROC-SS-005.what=You join a large workload using a table variable; it can be limiting. For big sets consider an explicit temp table.
PROC-SS-005.why=You join a large workload using a table variable; it can be limiting. For big sets consider an explicit temp table.
PROC-SS-006.what=The code uses GOTO labels; structured IF and loops are easier to maintain. Refactor away from GOTO.
PROC-SS-006.why=The code uses GOTO labels; structured IF and loops are easier to maintain. Refactor away from GOTO.
PROC-SS-007.what=SELECT * INTO a temp table ties the shape to the source query; schema drift is silent. List only the columns you need.
PROC-SS-007.why=SELECT * INTO a temp table ties the shape to the source query; schema drift is silent. List only the columns you need.
PROC-SS-008.what=You read the last generated identity globally; triggers or other scopes can interfere. Use SCOPE_IDENTITY() (or equivalent) for the current INSERT scope.
PROC-SS-008.why=You read the last generated identity globally; triggers or other scopes can interfere. Use SCOPE_IDENTITY() (or equivalent) for the current INSERT scope.
PROC-SS-009.what=A very long deliberate wait holds the connection busy. Shorten the delay or move work off-session.
PROC-SS-009.why=A very long deliberate wait holds the connection busy. Shorten the delay or move work off-session.
PROC-SS-010.what=Dynamic SQL is built by concatenating values without parameters. That invites injection and bugs. Use parameterized sp_executesql.
PROC-SS-010.why=Dynamic SQL is built by concatenating values without parameters. That invites injection and bugs. Use parameterized sp_executesql.
PROC-PG-001.what=The function omits an explicit LANGUAGE clause (for example plpgsql). The server may reject or mis-handle the body. Add the proper LANGUAGE.
PROC-PG-001.why=The function omits an explicit LANGUAGE clause (for example plpgsql). The server may reject or mis-handle the body. Add the proper LANGUAGE.
PROC-PG-002.what=The function runs with elevated privileges but search_path is not locked down. Someone could hijack object resolution. Set a safe search_path on the definition.
PROC-PG-002.why=The function runs with elevated privileges but search_path is not locked down. Someone could hijack object resolution. Set a safe search_path on the definition.
PROC-PG-003.what=The function is marked non-volatile but the body writes to tables. Fix the volatility label or remove writes.
PROC-PG-003.why=The function is marked non-volatile but the body writes to tables. Fix the volatility label or remove writes.
PROC-PG-004.what=The function should return a set of rows but a path returns nothing. Ensure RETURN QUERY or RETURN on every branch.
PROC-PG-004.why=The function should return a set of rows but a path returns nothing. Ensure RETURN QUERY or RETURN on every branch.
PROC-PG-005.what=This is a trigger function and it does not return NEW or OLD as required. Return the correct row for BEFORE/AFTER triggers.
PROC-PG-005.why=This is a trigger function and it does not return NEW or OLD as required. Return the correct row for BEFORE/AFTER triggers.
PROC-PG-006.what=NOTIFY/LISTEN sits inside a very long transaction; messages may be delayed or work may stall. Shorten the transaction or move notifications.
PROC-PG-006.why=NOTIFY/LISTEN sits inside a very long transaction; messages may be delayed or work may stall. Shorten the transaction or move notifications.
PROC-PG-007.what=Dynamic SQL is built by concatenating untrusted fragments—a classic injection risk. Use safe quoting or parameterized EXECUTE.
PROC-PG-007.why=Dynamic SQL is built by concatenating untrusted fragments—a classic injection risk. Use safe quoting or parameterized EXECUTE.
PROC-PG-008.what=For dynamic SQL, EXECUTE ... USING is safer and clearer than pasting literals. Prefer USING when possible.
PROC-PG-008.why=For dynamic SQL, EXECUTE ... USING is safer and clearer than pasting literals. Prefer USING when possible.
PROC-PG-009.what=GET DIAGNOSTICS is requested but the result is unused. Remove it or use it for logging and error control.
PROC-PG-009.why=GET DIAGNOSTICS is requested but the result is unused. Remove it or use it for logging and error control.
PROC-PG-010.what=A catch-all exception handler swallows errors without RAISE or logging. Handle specific cases or at least log and re-throw.
PROC-PG-010.why=A catch-all exception handler swallows errors without RAISE or logging. Handle specific cases or at least log and re-throw.
PROC-MY-001.what=The procedure omits a deterministic declaration MySQL relies on for replication and planning. Declare DETERMINISTIC or NOT DETERMINISTIC appropriately.
PROC-MY-001.why=The procedure omits a deterministic declaration MySQL relies on for replication and planning. Declare DETERMINISTIC or NOT DETERMINISTIC appropriately.
PROC-MY-002.what=SQL SECURITY was not chosen; default is often DEFINER, which can surprise you on permissions. Pick INVOKER or DEFINER deliberately.
PROC-MY-002.why=SQL SECURITY was not chosen; default is often DEFINER, which can surprise you on permissions. Pick INVOKER or DEFINER deliberately.
PROC-MY-003.what=The cursor has no handler for end-of-result; the loop may not terminate cleanly. Add a NOT FOUND handler.
PROC-MY-003.why=The cursor has no handler for end-of-result; the loop may not terminate cleanly. Add a NOT FOUND handler.
PROC-MY-004.what=The handler exits the whole block when continuing might be enough. Consider CONTINUE vs EXIT for that error type.
PROC-MY-004.why=The handler exits the whole block when continuing might be enough. Consider CONTINUE vs EXIT for that error type.
PROC-MY-005.what=SIGNAL is raised without a standard SQLSTATE. Clients cannot classify the failure. Provide SQLSTATE and a clear message.
PROC-MY-005.why=SIGNAL is raised without a standard SQLSTATE. Clients cannot classify the failure. Provide SQLSTATE and a clear message.
PROC-MY-006.what=The trigger updates the same table that fired it; MySQL cannot recurse that way safely. Restructure logic or use another table.
PROC-MY-006.why=The trigger updates the same table that fired it; MySQL cannot recurse that way safely. Restructure logic or use another table.
PROC-MY-007.what=The function declares MODIFIES SQL DATA when it should only read or touch nothing. Align the SQL characteristic with actual behavior.
PROC-MY-007.why=The function declares MODIFIES SQL DATA when it should only read or touch nothing. Align the SQL characteristic with actual behavior.
PROC-MY-008.what=The procedure declares an OUT parameter that is never assigned on every path. Assign it on all exits or adjust the signature.
PROC-MY-008.why=The procedure declares an OUT parameter that is never assigned on every path. Assign it on all exits or adjust the signature.
MGO-SYNTAX-001.what=Invalid MongoDB syntax
MGO-SYNTAX-001.why=Check braces {}, brackets [], and parentheses () in documents and pipelines.
MGO-SYNTAX-001.correctedExample=db.users.find({ active: true }).limit(100)
MGO-CHAIN-001.what=Unrecognized method chained after find/aggregate
MGO-CHAIN-001.why=Chaining .limit(), .sort(), etc. is normal in mongosh; this method name is unsupported or misspelled.
MGO-CHAIN-001.correctedExample=db.users.find({ active: true }).limit(100).sort({ name: 1 })
MGO-WRONG-ENGINE.what=Wrong database engine
MGO-WRONG-ENGINE.why=This input does not look like MongoDB syntax. MongoDB queries must start with db.collectionName.method(...)
MGO-WRONG-ENGINE.correctedExample=Check the selected engine or use MongoDB shell syntax: db.users.find({ field: 'value' })
RDS-WRONG-ENGINE.what=Incorrect syntax for Redis
RDS-WRONG-ENGINE.why=This query does not look like a Redis command.
RDS-WRONG-ENGINE.correctedExample=Check the selected engine or use Redis commands: SET key value, GET key, HSET hash field value.
CQL-WRONG-ENGINE.what=Incorrect syntax for Cassandra
CQL-WRONG-ENGINE.why=This query does not look like Cassandra CQL.
CQL-WRONG-ENGINE.correctedExample=Use CQL syntax: SELECT … FROM keyspace.table WHERE partition_key \\= ?
ES-WRONG-ENGINE.what=Incorrect syntax for Elasticsearch
ES-WRONG-ENGINE.why=This query does not look like Elasticsearch JSON or REST syntax.
ES-WRONG-ENGINE.correctedExample=Use JSON Query DSL ({ "query": { … } }) or REST: GET index/_search
SQL-WRONG-ENGINE.what=Incorrect syntax for SQL
SQL-WRONG-ENGINE.why=This query does not look like SQL for the selected relational engine.
SQL-WRONG-ENGINE.correctedExample=Verify the engine (MySQL, PostgreSQL, SQL Server, Oracle, SQLite) or paste valid SQL.
DDB-WRONG-ENGINE.what=Incorrect syntax for DynamoDB
DDB-WRONG-ENGINE.why=This payload does not look like DynamoDB PartiQL, SDK expressions, or management JSON.
DDB-WRONG-ENGINE.correctedExample=Use PartiQL, SDK expressions (SET/REMOVE/ADD), or JSON with TransactItems.
UNKNOWN-ENGINE.what=Unrecognized engine
UNKNOWN-ENGINE.why=The selected database engine is not supported by the analyzer.
UNKNOWN-ENGINE.correctedExample=Choose a supported engine from the dropdown.
MGO-JS-001.what=$where operator detected — security risk
MGO-JS-001.why=$where executes JavaScript server-side on each document, opening NoSQL injection vectors and degrading performance.
MGO-JS-001.correctedExample=Replace $where with native filters ($eq, $in, $gte, $lte) or an aggregation pipeline.
MGO-REGEX-001.what=Regular expression without index
MGO-REGEX-001.why=$regex or /.../  patterns generally don't use B-tree indexes unless anchored by a fixed prefix (^text).
MGO-REGEX-001.correctedExample=Consider a text index, a normalized search field, or pre-filter documents with other criteria first.
MGO-NOFILTER-001.what=Operation without filter
MGO-NOFILTER-001.why=find/update/delete without a filter may affect ALL documents in the collection.
MGO-NOFILTER-001.correctedExample=Add an explicit filter criterion or confirm you intend to process the entire collection.
MGO-LOOKUP-001.what=Incomplete $lookup
MGO-LOOKUP-001.why=$lookup requires localField+foreignField, or the pipeline subquery syntax.
MGO-LOOKUP-001.correctedExample=Use: {$lookup:{from:'col',localField:'a',foreignField:'b',as:'res'}} or pipeline subquery syntax.
MGO-UNWIND-001.what=$unwind: path must start with $
MGO-UNWIND-001.why=The $unwind field must be a field reference starting with $.
MGO-UNWIND-001.correctedExample=Change to: {$unwind: '$fieldName'}
MGO-GROUP-001.what=$group missing _id field
MGO-GROUP-001.why=$group requires the _id field to define the grouping key.
MGO-GROUP-001.correctedExample=Add _id: null to group all documents, or _id: '$field' to group by a field.
MGO-FACET-001.what=Forbidden stage inside $facet
MGO-FACET-001.why=$out, $merge, and $indexStats cannot be used inside $facet sub-pipelines.
MGO-FACET-001.correctedExample=Move these stages outside the $facet or restructure the pipeline.
MGO-PIPELINE-001.what=Pipeline without early $match
MGO-PIPELINE-001.why=A pipeline with more than 5 stages that doesn't start with $match may process all documents unnecessarily.
MGO-PIPELINE-001.correctedExample=Add {$match: { criteria }} at the beginning of the pipeline to reduce documents processed.
MGO-GRAPH-001.what=$graphLookup with excessive depth
MGO-GRAPH-001.why=maxDepth greater than 10 in $graphLookup can cause severe performance issues on large graphs.
MGO-GRAPH-001.correctedExample=Reduce maxDepth or add restrictSearchWithMatch to limit the search space.
MGO-TX-OUT-001.what=$out / $merge inside transaction
MGO-TX-OUT-001.why=$out and $merge cannot be used inside MongoDB transactions.
MGO-TX-OUT-001.correctedExample=Execute the stage outside the transaction or use an intermediate temporary collection.
MGO-TX-001.what=Transaction started without visible commit/abort
MGO-TX-001.why=startTransaction() is present but commitTransaction() / abortTransaction() are not visible in the same script.
MGO-TX-001.correctedExample=Always commit on success and explicitly abort or roll back on failures, including async/error paths.
MGO-TX-002.what=Writes with manual transaction wiring
MGO-TX-002.why=There are db.* writes with manual startTransaction but session.withTransaction() is not used.
MGO-TX-002.correctedExample=Prefer withTransaction() — it retries on transient errors and keeps rollback paths centralized.
MGO-TX-003.what=Transaction window likely too long
MGO-TX-003.why=maxCommitTimeMS, timeoutMS, or similar options suggest a duration above ~60s, which MongoDB often aborts.
MGO-TX-003.correctedExample=Shorten work per attempt, move long I/O outside the transaction, and use reasonable timeouts.
MGO-TX-004.what=Invalid startTransaction options literal
MGO-TX-004.why=startTransaction expects an options document, not a bare string or JSON array literal.
MGO-TX-004.correctedExample=Pass an object like { readConcern: { level: 'local' }, maxCommitTimeMS: 9000 } as appropriate.
MGO-CS-001.what=Change stream cursor open
MGO-CS-001.why=db.collection.watch() keeps a server cursor until you close it.
MGO-CS-001.correctedExample=Use try-with-resources, explicit close, or your driver helper so cursors are not left open.
MGO-CS-002.what=watch() without pipeline
MGO-CS-002.why=No pipeline (e.g. $match) filters change events on the server.
MGO-CS-002.correctedExample=Prefer leading [{ $match: { ... } }] to cut network and load when you do not need every event.
MGO-CS-003.what=resumeAfter is not valid
MGO-CS-003.why=resumeAfter must be the opaque resume token document (with _id fields as the driver expects), not null or {}.
MGO-CS-003.correctedExample=Persist and reuse resumeToken / getResumeToken() from the previous watch iteration; do not hand-build tokens.
MGO-CS-004.what=fullDocument: updateLookup cost
MGO-CS-004.why=updateLookup fetches full documents on updates and can be expensive on large collections.
MGO-CS-004.correctedExample=Prefer default / whenNeeded or project early if you only need a subset of fields.
MGO-ARRAY-001.what=$elemMatch with no condition
MGO-ARRAY-001.why=$elemMatch with no conditions has no useful effect.
MGO-ARRAY-001.correctedExample=Add at least one condition inside $elemMatch: {$elemMatch: {field: value}}
MGO-ARRAY-002.what=$push / $addToSet: use $each for multiple values
MGO-ARRAY-002.why=To add multiple values at once, it's more efficient to use $each.
MGO-ARRAY-002.correctedExample=Use: {$push: {$each: [val1, val2]}} instead of multiple individual $push operations.
MGO-ARRAY-003.what=$pull with empty condition
MGO-ARRAY-003.why=An empty condition {} in $pull will remove all matching elements from the array.
MGO-ARRAY-003.correctedExample=Add a specific condition or confirm you intend to empty the array.
MGO-TEXT-001.what=Text search without text index
MGO-TEXT-001.why=$text requires a text index to exist on the collection to work.
MGO-TEXT-001.correctedExample=Create the index with: db.collection.createIndex({ field: 'text' })
MGO-TEXT-002.what=Unsupported language in $text
MGO-TEXT-002.why=The $language value is not a language recognized by MongoDB.
MGO-TEXT-002.correctedExample=Check MongoDB documentation for supported languages, or remove $language to use the default.
MGO-GEO-001.what=Geospatial query without geospatial index
MGO-GEO-001.why=$near and $nearSphere require a 2dsphere or 2d index on the coordinates field.
MGO-GEO-001.correctedExample=Create the index with: db.collection.createIndex({ location: '2dsphere' })
MGO-GEO-002.what=Unclosed GeoJSON polygon
MGO-GEO-002.why=GeoJSON polygons must be closed: the first and last coordinate points must be identical.
MGO-GEO-002.correctedExample=Make sure the last element of the coordinates array equals the first.
MGO-GEO-003.what=$near without $maxDistance
MGO-GEO-003.why=Without $maxDistance, $near may return results from the entire collection, degrading performance.
MGO-GEO-003.correctedExample=Add $maxDistance: meters to limit the search radius.
MGO-JS-002.what=$function detected — JavaScript on server
MGO-JS-002.why=$function executes custom JavaScript on the server, which may cause performance and security issues.
MGO-JS-002.correctedExample=Use native aggregation operators instead of $function whenever possible.
MGO-JS-003.what=mapReduce is deprecated
MGO-JS-003.why=mapReduce is deprecated since MongoDB 5.0 and may be removed in future versions.
MGO-JS-003.correctedExample=Migrate to aggregation pipeline: $group, $project, $reduce and similar operators offer the same functionality with better performance.
MGO-OBJECTID-001.what=ObjectId compared as string
MGO-OBJECTID-001.why=Comparing a 24-character hex string directly with _id will always fail, because _id is of type ObjectId.
MGO-OBJECTID-001.correctedExample=Use the ObjectId wrapper: { _id: ObjectId('your-id-here') }
RDS-SYNTAX-001.what=Empty or invalid Redis command
RDS-SYNTAX-001.why=The query has no content or its structure could not be parsed.
RDS-SYNTAX-001.correctedExample=Write a valid Redis command, for example: SET mykey "value" or GET mykey.
RDS-INJ-001.what=Possible command injection detected
RDS-INJ-001.why=The command contains dangerous characters (;, newlines, $(), backticks) that may allow injection.
RDS-INJ-001.correctedExample=Avoid concatenating user input directly into commands. Use parameterized clients or Lua with ARGV.
RDS-CMD-001.what=Unrecognized Redis command
RDS-CMD-001.why=The command is not in the analyzer's catalog of supported commands.
RDS-CMD-001.correctedExample=Use one of the cataloged commands: strings, hashes, lists, sets, sorted sets, admin, streams, geo, HLL, scripting, bitfield.
RDS-HMSET-001.what=HMSET is deprecated — use HSET
RDS-HMSET-001.why=HMSET was deprecated in Redis 4.0 and may be removed in future versions.
RDS-HMSET-001.correctedExample=Replace HMSET with HSET. Since Redis 4.0, HSET accepts multiple field/value pairs directly.
RDS-KEYS-001.what=KEYS * blocks the server
RDS-KEYS-001.why=KEYS * performs a full blocking scan of all keys. It can freeze Redis in production environments.
RDS-KEYS-001.correctedExample=Use SCAN with a cursor and MATCH to iterate keys without blocking, or maintain an index set.
RDS-KEYS-002.what=KEYS with a pattern still scans the entire keyspace
RDS-KEYS-002.why=KEYS user:* is not production-safe: Redis iterates all keys and filters by pattern, blocking the server.
RDS-KEYS-002.correctedExample=SCAN 0 MATCH user:* COUNT 100
RDS-FLUSH-001.what=Destructive operation: deletes ALL keys
RDS-FLUSH-001.why=FLUSHDB deletes all keys in the current database. FLUSHALL deletes all keys in every database.
RDS-FLUSH-001.correctedExample=Add CONFIRM as the last argument only in controlled environments, or remove the command entirely.
RDS-SESS-001.what=Session key without expiry — possible memory leak
RDS-SESS-001.why=A key named 'session' or 'token' was set without an expiration time.
RDS-SESS-001.correctedExample=Add EX/PX/EXAT/PXAT to SET or call EXPIRE so session/token keys are evicted automatically.
RDS-ARGS-001.what=Incorrect number of arguments
RDS-ARGS-001.why=The command received an invalid number of arguments according to its official signature.
RDS-ARGS-001.correctedExample=Check the command's signature in the official Redis documentation.
RDS-TX-001.what=WATCH inside an active transaction
RDS-TX-001.why=WATCH must be called before MULTI, not inside a transaction block.
RDS-TX-001.correctedExample=Call WATCH on keys before MULTI, or use UNWATCH before starting the transaction.
RDS-TX-002.what=EXEC without prior MULTI
RDS-TX-002.why=EXEC was called without opening a transaction with MULTI first.
RDS-TX-002.correctedExample=Send MULTI first, queue commands, then send EXEC.
RDS-TX-003.what=DISCARD without active MULTI block
RDS-TX-003.why=DISCARD only applies after MULTI and before EXEC has been executed.
RDS-TX-003.correctedExample=Open a transaction with MULTI before using DISCARD.
RDS-TX-004.what=Blocking commands inside MULTI/EXEC
RDS-TX-004.why=BLPOP/BRPOP/BRPOPLPUSH inside transactions may cause unexpected behavior.
RDS-TX-004.correctedExample=Avoid BLPOP/BRPOP/BRPOPLPUSH inside MULTI/EXEC. Use LPOP/RPOP or design the logic outside the transaction.
RDS-PUB-001.what=Mixing SUBSCRIBE and PSUBSCRIBE
RDS-PUB-001.why=Using SUBSCRIBE and PSUBSCRIBE on the same connection is allowed but may cause confusion.
RDS-PUB-001.correctedExample=Use one style or clearly document which channels are pattern-matched.
RDS-PUB-002.what=Empty channel name in PUBLISH
RDS-PUB-002.why=A PUBLISH command was issued with an empty channel name.
RDS-PUB-002.correctedExample=Use a non-empty channel string as the PUBLISH argument.
RDS-PUB-003.what=PUBSUB CHANNELS * may be slow
RDS-PUB-003.why=Listing all channels with PUBSUB CHANNELS * can be slow on high-traffic Redis instances.
RDS-PUB-003.correctedExample=Use a narrower pattern or monitor channel count in staging before running in production.
RDS-XStream-001.what=XREADGROUP requires GROUP group consumer
RDS-XStream-001.why=XREADGROUP needs the GROUP keyword followed by group name and consumer name.
RDS-XStream-001.correctedExample=Add GROUP mygroup myconsumer after options and stream keys.
RDS-XStream-002.what=Stream may not exist — use MKSTREAM
RDS-XStream-002.why=XGROUP CREATE will fail if the stream does not exist. MKSTREAM creates it automatically.
RDS-XStream-002.correctedExample=Add MKSTREAM at the end of XGROUP CREATE to create the stream if it does not exist yet.
RDS-XStream-003.what=XPENDING without range returns summary only
RDS-XStream-003.why=Without start/end/count parameters, XPENDING returns only an aggregate summary.
RDS-XStream-003.correctedExample=Pass start/end/count after key and group to inspect specific pending entries.
RDS-XStream-004.what=XADD MAXLEN without ~ uses exact trimming (slow)
RDS-XStream-004.why=Exact trimming with MAXLEN \\= is much more expensive than approximate trimming.
RDS-XStream-004.correctedExample=Use MAXLEN ~ N for approximate trimming unless you need a strictly exact length.
RDS-XStream-010.what=XADD requires key, ID, and at least one field-value pair
RDS-XStream-010.why=XADD needs: stream key, ID (* for auto), and at least one field/value pair.
RDS-XStream-010.correctedExample=Correct format: XADD key * field value [field value ...] (with optional MAXLEN/~).
RDS-GEO-001.what=GEORADIUS is deprecated since Redis 6.2
RDS-GEO-001.why=GEORADIUS and GEORADIUSBYMEMBER were replaced by GEOSEARCH in Redis 6.2.
RDS-GEO-001.correctedExample=Rewrite using GEOSEARCH/GEOSEARCHSTORE with FROMMEMBER/FROMLONLAT options.
RDS-GEO-002.what=Latitude out of valid range for GEOADD
RDS-GEO-002.why=Latitude must be between -85.05112878 and 85.05112878 to be representable in Redis's geospatial system.
RDS-GEO-002.correctedExample=Verify the order (longitude, latitude, member) and valid ranges in GEOADD.
RDS-GEO-003.what=Longitude out of valid range for GEOADD
RDS-GEO-003.why=Longitude must be between -180 and 180.
RDS-GEO-003.correctedExample=GEOADD expects longitude before latitude for each point: GEOADD key lon lat member.
RDS-GEO-004.what=Invalid distance unit in GEODIST
RDS-GEO-004.why=The specified unit is not valid for GEODIST.
RDS-GEO-004.correctedExample=Use one of the valid units as the last argument: m, km, mi, or ft.
RDS-HLL-001.what=PFCOUNT with many keys — consider PFMERGE first
RDS-HLL-001.why=PFCOUNT with more than 10 keys performs expensive cross-slot merging in Redis Cluster environments.
RDS-HLL-001.correctedExample=Use PFMERGE to merge into one key, then PFCOUNT once for cluster-friendly workloads.
RDS-HLL-002.what=PFMERGE destination key is also a source
RDS-HLL-002.why=PFMERGE has the same key as destination and source. This is valid but may be confusing.
RDS-HLL-002.correctedExample=Double-check that merging a HyperLogLog key with itself is intentional.
RDS-Script-001.what=SCRIPT FLUSH removes all cached scripts
RDS-Script-001.why=SCRIPT FLUSH clears all Lua scripts from the server cache. Do not run in production without caution.
RDS-Script-001.correctedExample=Use only in dev/staging environments or during controlled maintenance.
RDS-Script-002.what=Long script — consider EVALSHA with SCRIPT LOAD
RDS-Script-002.why=Long scripts are resent in full on every EVAL call. EVALSHA avoids retransmitting the script.
RDS-Script-002.correctedExample=Load once with SCRIPT LOAD, then call EVALSHA with the resulting SHA1 digest.
RDS-Script-003.what=Access Redis keys through the KEYS array in scripts
RDS-Script-003.why=Lua scripts that access keys without using KEYS[] may not work correctly in Redis Cluster.
RDS-Script-003.correctedExample=Replace literal key arguments with KEYS[1], KEYS[2], ... matching the numkeys value.
RDS-BIT-001.what=Bitfield offset must be non-negative
RDS-BIT-001.why=GET/SET/INCRBY inside BITFIELD do not accept negative offsets.
RDS-BIT-001.correctedExample=Use non-negative offsets (integers ≥ 0) for GET/SET/INCRBY in BITFIELD.
RDS-BIT-002.what=BITCOUNT on non-existent key returns 0
RDS-BIT-002.why=This is not an error — Redis treats a missing key as an empty zero bitmap.
RDS-BIT-002.correctedExample=No change needed. The behavior is correct and expected.
RDS-BIT-003.what=BITOP NOT requires exactly one source key
RDS-BIT-003.why=BITOP NOT only accepts one source key, not multiple.
RDS-BIT-003.correctedExample=Use the format: BITOP NOT destkey sourcekey
CQL-FILTER-001.what=ALLOW FILTERING detected — full cluster scan risk
CQL-FILTER-001.why=ALLOW FILTERING forces Cassandra to scan all cluster partitions to resolve the query. On large tables this causes timeouts and severe performance degradation.
CQL-FILTER-001.correctedExample=Add the partition key to the WHERE clause to restrict the scan. If you need to filter by this column frequently, consider a dedicated query table.
CQL-FULLSCAN-001.what=SELECT without WHERE — full cluster scan
CQL-FULLSCAN-001.why=A SELECT without a WHERE clause reads all cluster partitions, which is extremely expensive in Cassandra and can cause timeouts on tables with millions of rows.
CQL-FULLSCAN-001.correctedExample=Add a WHERE clause with the partition key to restrict the scan to the minimum necessary.
CQL-NOWHERE-001.what=UPDATE without WHERE — targets indeterminate partitions
CQL-NOWHERE-001.why=An UPDATE without a WHERE clause in Cassandra may affect unintended rows and most drivers will reject this operation.
CQL-NOWHERE-001.correctedExample=Specify the partition key in WHERE to target exactly the rows you want to update.
CQL-NOWHERE-002.what=DELETE without WHERE — uncontrolled mass deletion
CQL-NOWHERE-002.why=A DELETE without a WHERE clause may delete unintended rows. This is a dangerous operation in production clusters.
CQL-NOWHERE-002.correctedExample=Specify the partition key in WHERE to target exactly the rows you want to delete.
CQL-JOIN-001.what=JOIN not supported in Cassandra
CQL-JOIN-001.why=Cassandra does not support JOIN operations between tables. The data model is designed for single-table queries optimized by partition key.
CQL-JOIN-001.correctedExample=Denormalize your data model or perform separate queries and combine results on the client side.
CQL-ORDERBY-001.what=ORDER BY only valid on clustering columns
CQL-ORDERBY-001.why=ORDER BY in CQL is only valid for clustering key columns, and only in the opposite direction from the table definition. ORDER BY on other columns will fail at runtime.
CQL-ORDERBY-001.correctedExample=Ensure the ORDER BY column is a clustering column. If you need a different order, consider a query table with a different clustering order.
CQL-TTL-001.what=TTL too short (less than 60 seconds)
CQL-TTL-001.why=The specified TTL is less than 60 seconds, which may cause unexpected data expiration in production.
CQL-TTL-001.correctedExample=Use TTL >\\= 60 seconds or omit the TTL if the data should be persistent.
CQL-EMPTY.what=Empty CQL statement
CQL-EMPTY.why=No CQL content was provided for analysis.
CQL-EMPTY.correctedExample=Write a valid CQL query, for example: SELECT * FROM table WHERE id \\= ? or INSERT INTO table (col) VALUES (?).
CQL-LEX.what=Lexical error in CQL query
CQL-LEX.why=The analyzer encountered a character or sequence it could not interpret as a valid CQL token.
CQL-LEX.correctedExample=Review the query syntax and fix the indicated error to continue.
CQL-SYN-001.what=CQL syntax error
CQL-SYN-001.why=The CQL statement is not valid at the reported line or column.
CQL-SYN-001.correctedExample=Fix the syntax at the indicated position; check quotes, types, and keywords.
CQL-STRUCT-START.what=CQL statement does not begin with a valid command
CQL-STRUCT-START.why=A CQL statement must begin with SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, BATCH or another valid command.
CQL-STRUCT-START.correctedExample=Start the statement with a valid CQL command: SELECT, INSERT INTO, UPDATE, DELETE FROM, etc.
CQL-STRUCT-SELECT.what=SELECT without FROM clause
CQL-STRUCT-SELECT.why=Every SELECT statement in CQL must specify the source table with FROM.
CQL-STRUCT-SELECT.correctedExample=Use SELECT columns FROM keyspace.table WHERE condition.
CQL-STRUCT-INSERT.what=INSERT without INTO
CQL-STRUCT-INSERT.why=CQL INSERT syntax requires the INTO keyword followed by the table name.
CQL-STRUCT-INSERT.correctedExample=Use the format: INSERT INTO table [(columns)] VALUES (...) [USING TTL n].
CQL-STRUCT-INSERT-VALUES.what=INSERT without VALUES clause
CQL-STRUCT-INSERT-VALUES.why=An INSERT statement must include VALUES (...) with the data to insert.
CQL-STRUCT-INSERT-VALUES.correctedExample=Provide a VALUES clause or use INSERT JSON if your driver supports it.
CQL-STRUCT-UPDATE.what=UPDATE without SET clause
CQL-STRUCT-UPDATE.why=Every UPDATE statement in CQL must specify the columns to modify with SET.
CQL-STRUCT-UPDATE.correctedExample=Use the format: UPDATE table [USING TTL n] SET col \\= value [, ...] WHERE condition.
CQL-STRUCT-DELETE.what=DELETE without FROM clause
CQL-STRUCT-DELETE.why=The DELETE statement in CQL must specify the source table with FROM.
CQL-STRUCT-DELETE.correctedExample=Use the format: DELETE [columns] FROM table WHERE condition.
CQL-STRUCT-CREATE-TABLE.what=Incomplete or invalid CREATE TABLE structure
CQL-STRUCT-CREATE-TABLE.why=The CREATE TABLE statement does not follow the minimum structure required by CQL. The table name or column definition list is missing.
CQL-STRUCT-CREATE-TABLE.correctedExample=Use: CREATE TABLE [IF NOT EXISTS] table (column type [PRIMARY KEY], ..., PRIMARY KEY ((pk), ck)).
CQL-BATCH-001.what=BATCH does not end with APPLY BATCH
CQL-BATCH-001.why=A BATCH block must be closed with APPLY BATCH. Without this closing statement the batch is invalid and will be rejected by Cassandra.
CQL-BATCH-001.correctedExample=Add APPLY BATCH; at the end of the block to complete the batch transaction.
CQL-BATCH-002.what=COUNTER BATCH contains non-counter statements
CQL-BATCH-002.why=A BATCH marked as COUNTER can only contain counter column updates. INSERT, DELETE and regular updates are not allowed inside this batch type.
CQL-BATCH-002.correctedExample=Move INSERT/DELETE/regular UPDATE statements outside the COUNTER BATCH, or change the batch type.
CQL-BATCH-003.what=UNLOGGED BATCH spans multiple tables
CQL-BATCH-003.why=Unlogged batches spanning multiple tables lose atomicity. Only the same partition token guarantees atomicity in Cassandra.
CQL-BATCH-003.correctedExample=Restrict the UNLOGGED BATCH to a single table/partition, or use separate statements for clarity.
CQL-BATCH-004.what=Batch too large — anti-pattern in Cassandra
CQL-BATCH-004.why=Large batches increase coordinator memory pressure and can cause timeouts. They are a known anti-pattern in Cassandra.
CQL-BATCH-004.correctedExample=Split work into smaller batches or use async writes with concurrency limits in the driver.
CQL-BATCH-005.what=Performance BATCH — prefer UNLOGGED
CQL-BATCH-005.why=When all INSERTs target the same partition, BATCH can be used for performance. UNLOGGED is the most efficient option in this case.
CQL-BATCH-005.correctedExample=Use BEGIN UNLOGGED BATCH when all operations target the same partition.
CQL-COL-001.what=Empty list append has no effect
CQL-COL-001.why=Appending an empty list [] to a list column produces no change in the stored data. The operation is redundant.
CQL-COL-001.correctedExample=Remove the redundant operation or supply list elements before appending.
CQL-COL-002.what=Empty map merge has no effect
CQL-COL-002.why=Merging an empty map {} into a map column produces no change in the stored data. The operation is redundant.
CQL-COL-002.correctedExample=Remove the redundant operation or supply map entries before merging.
CQL-COL-003.what=Cannot delete cell of primary key column
CQL-COL-003.why=In Cassandra it is not possible to delete individual map entries when the referenced key is a primary key column.
CQL-COL-003.correctedExample=To delete the entire row use DELETE FROM table WHERE partition_key \\= ?.
CQL-COL-004.what=Negative list index
CQL-COL-004.why=List access index in CQL must be a non-negative integer. Negative indexes are not valid in Cassandra.
CQL-COL-004.correctedExample=Use a valid list index (>\\= 0) in the bracket expression.
CQL-LIST-001.what=Frequent list mutations are expensive
CQL-LIST-001.why=Mutation operations on list columns (append, prepend, by index) are internally expensive in Cassandra because they require read-before-write.
CQL-LIST-001.correctedExample=Prefer SET or MAP as collection type, or model one-to-many relationships with clustering columns.
CQL-LWT-001.what=Lightweight Transaction (LWT) — uses Paxos protocol
CQL-LWT-001.why=INSERT ... IF NOT EXISTS and UPDATE ... IF condition use the Paxos consensus protocol, which has significantly higher latency than regular writes.
CQL-LWT-001.correctedExample=Use LWT only when you need linearizable semantics. For conflict-free cases, prefer regular INSERT.
CQL-LWT-002.what=IF condition on primary key column
CQL-LWT-002.why=LWT conditions (IF condition) cannot reference partition key or clustering columns. They can only be applied to regular columns.
CQL-LWT-002.correctedExample=Move conditions to regular columns only. PK columns belong in the WHERE clause.
CQL-LWT-003.what=LWT inside BATCH — same partition only
CQL-LWT-003.why=Lightweight Transactions inside a BATCH are only allowed when all statements target the same partition. Cross-partition LWT BATCH is not supported.
CQL-LWT-003.correctedExample=Ensure all statements in the LWT BATCH share the same partition key.
CQL-LWT-004.what=BATCH with LWT across multiple partitions
CQL-LWT-004.why=Cassandra does not support BATCH combining Lightweight Transactions from different partitions. This will produce a runtime error.
CQL-LWT-004.correctedExample=Separate LWTs by partition or redesign to group data in the same partition.
CQL-LWT-005.what=Unrecognized columns in IF condition
CQL-LWT-005.why=The columns referenced in the IF condition do not match columns defined in the CREATE TABLE detected in this script.
CQL-LWT-005.correctedExample=Verify that column names in IF exactly match the table definition.
CQL-MV-001.what=Materialized view missing full primary key
CQL-MV-001.why=A Materialized View must include all primary key columns of the base table. If any is missing, Cassandra will reject the statement.
CQL-MV-001.correctedExample=Include all partition key and clustering key columns of the base table in the view PRIMARY KEY.
CQL-MV-002.what=Materialized view WHERE missing IS NOT NULL for PK columns
CQL-MV-002.why=The WHERE clause of a Materialized View must include IS NOT NULL for all primary key columns. Rows with null PK cannot be replicated into views.
CQL-MV-002.correctedExample=Add AND column IS NOT NULL to the WHERE for each partition/clustering key column of the base table.
CQL-MV-003.what=Too many Materialized Views per table
CQL-MV-003.why=Having more than 3 Materialized Views on the same base table multiplies write overhead in Cassandra, as each write must be replicated to all views.
CQL-MV-003.correctedExample=Reduce the number of views or explicitly denormalize data into separate query tables.
CQL-UDT-001.what=UDT in collection without FROZEN wrapper
CQL-UDT-001.why=In Cassandra, User-Defined Types used inside collections (LIST, SET, MAP) must be wrapped with FROZEN<TypeName>. Without FROZEN the server will reject the statement.
CQL-UDT-001.correctedExample=Use FROZEN<TypeName> inside the collection type: LIST<FROZEN<my_type>> or MAP<text, FROZEN<my_type>>.
CQL-UDT-002.what=Unsupported operation on UDT
CQL-UDT-002.why=Cassandra only supports adding fields to a User-Defined Type with ALTER TYPE ... ADD. Renaming or dropping fields is not supported and requires recreating dependent tables.
CQL-UDT-002.correctedExample=Create a new UDT with the desired structure and migrate data, or recreate tables that depend on this type.
CQL-TTL-002.what=TTL of 0 removes data expiration
CQL-TTL-002.why=A TTL of 0 does not delete the data — it removes the existing TTL and makes the data permanent. This behavior is frequently confused with deletion.
CQL-TTL-002.correctedExample=Omit USING TTL if you want the data to be permanent, or use DELETE if you want to remove it.
CQL-TTL-003.what=Negative TTL is invalid
CQL-TTL-003.why=The TTL value must be a positive integer representing the time-to-live in seconds. A negative TTL is invalid and will be rejected by Cassandra.
CQL-TTL-003.correctedExample=Provide a positive TTL in seconds, for example: USING TTL 86400 for 24 hours.
CQL-TTL-004.what=TTL() not available on primary key columns
CQL-TTL-004.why=The TTL() function can only be applied to regular columns. Partition key and clustering key columns do not have individual TTL.
CQL-TTL-004.correctedExample=Use TTL(regular_column) selecting only columns that are not part of the primary key.
CQL-TTL-005.what=TTL() requires a specific column name
CQL-TTL-005.why=TTL(*) is not valid syntax in Cassandra. The TTL() function requires the name of a specific column, not a wildcard.
CQL-TTL-005.correctedExample=Use TTL(column_name) with a specific regular column: SELECT TTL(description) FROM table WHERE id \\= ?.
CQL-WT-001.what=WRITETIME not available on primary key columns
CQL-WT-001.why=The WRITETIME() function can only be applied to regular columns. Partition key and clustering key columns do not have individual write timestamps.
CQL-WT-001.correctedExample=Select WRITETIME(regular_column) with a column that is not part of the primary key.
CQL-WT-002.what=WRITETIME() requires a specific column name
CQL-WT-002.why=WRITETIME(*) is not valid syntax in Cassandra. The WRITETIME() function requires the name of a specific column, not a wildcard.
CQL-WT-002.correctedExample=Use WRITETIME(column_name) with a regular column: SELECT WRITETIME(email) FROM users WHERE id \\= ?.
CQL-IDX-001.what=Secondary index on partition key is redundant
CQL-IDX-001.why=Partition key columns are already natively indexed in Cassandra. Creating a secondary index on them is redundant and does not improve performance.
CQL-IDX-001.correctedExample=Drop the secondary index on the partition key. Partition key queries are already efficient without an additional index.
CQL-IDX-002.what=Unnamed secondary index
CQL-IDX-002.why=Unnamed indexes receive auto-generated names from Cassandra. This makes administration and long-term maintenance more difficult.
CQL-IDX-002.correctedExample=Assign a descriptive name to the index: CREATE INDEX descriptive_name ON table (column).
CQL-IDX-003.what=Secondary index on high-cardinality column
CQL-IDX-003.why=Secondary indexes in Cassandra are inefficient for columns with many unique values (high cardinality) such as emails or UUIDs. Every node must be queried.
CQL-IDX-003.correctedExample=Consider denormalization with query tables, or use SASI/SAI (Storage-Attached Index) if your Cassandra version supports it.
CQL-IDX-004.what=CREATE CUSTOM INDEX without USING class
CQL-IDX-004.why=A CREATE CUSTOM INDEX requires specifying the implementation with USING 'index.class'. Without this clause the statement is incomplete.
CQL-IDX-004.correctedExample=Specify the attached index class: CREATE CUSTOM INDEX ON table(column) USING 'org.apache.cassandra.index.sasi.SASIIndex'.
CQL-DCL-001.what=DCL permissions operation detected
CQL-DCL-001.why=GRANT, REVOKE or CREATE/DROP USER/ROLE statements affect cluster security. Applying incorrect permissions can block access or create vulnerabilities.
CQL-DCL-001.correctedExample=Apply the principle of least privilege. Verify role scope and keyspace/table target before executing in production.
DDB-JOIN.what=DynamoDB PartiQL does not support JOINs
DDB-JOIN.why=PartiQL on DynamoDB cannot combine tables with JOINs. Each statement must target a single table.
DDB-JOIN.correctedExample=Use one table per statement, query related items with separate requests, or design PK/SK and GSI patterns for your access paths.
DDB-GROUP.what=DynamoDB PartiQL does not support GROUP BY
DDB-GROUP.why=GROUP BY is not available in DynamoDB PartiQL; aggregation should happen outside the engine or via precomputed data.
DDB-GROUP.correctedExample=Pre-aggregate in application code, use a GSI with precomputed aggregates, or use another analytics tool.
DDB-HAVING.what=DynamoDB PartiQL does not support HAVING
DDB-HAVING.why=HAVING is not supported in DynamoDB PartiQL because classic SQL-style grouping is not part of that surface.
DDB-HAVING.correctedExample=Filter before aggregating outside DynamoDB, or redesign the access pattern.
DDB-WHERE-SELECT.what=SELECT without WHERE — expensive table scan
DDB-WHERE-SELECT.why=A read without a partition key condition often implies a broad Scan, costly in RCUs and latency.
DDB-WHERE-SELECT.correctedExample=Add equality (or an allowed key operator) on the partition key in WHERE to scope the read.
DDB-SELECT-STAR.what=Avoid SELECT * in DynamoDB
DDB-SELECT-STAR.why=Fetching every attribute consumes more read capacity than necessary.
DDB-SELECT-STAR.correctedExample=List only the columns or attributes you need (projection) to reduce RCU cost.
DDB-ORDER.what=ORDER BY is efficient on sort key within one partition
DDB-ORDER.why=With Query, ordering aligns with the sort key within a single partition key; otherwise patterns may be surprising or costly.
DDB-ORDER.correctedExample=Ensure ORDER BY uses the sort key within one partition key, or remove it if it does not match your model.
DDB-UPDATE-NO-WHERE.what=UPDATE without WHERE — partition key required
DDB-UPDATE-NO-WHERE.why=In DynamoDB PartiQL, UPDATE must identify items via key conditions; without WHERE the operation is invalid in practice.
DDB-UPDATE-NO-WHERE.correctedExample=Add WHERE with the partition key (and sort key when the table defines one).
DDB-DELETE-NO-WHERE.what=DELETE without WHERE — partition key required
DDB-DELETE-NO-WHERE.why=Deleting without a partition key does not safely define which items to remove.
DDB-DELETE-NO-WHERE.correctedExample=Add WHERE with the partition key (and sort key when required).
DDB-PK-NEG.what=Inequality or NOT IN on partition key column
DDB-PK-NEG.why=DynamoDB does not support not-equal style conditions on the partition key as part of an efficient key condition.
DDB-PK-NEG.correctedExample=If the column is the PK, use equality or supported key shapes; if it is not the PK, confirm your schema. For NOT IN on key attributes, consider filters or redesign.
DDB-LIKE-LEAD.what=Leading wildcard in LIKE — scan risk
DDB-LIKE-LEAD.why=A LIKE pattern starting with '%' cannot use prefix indexing and tends to scan a lot of data.
DDB-LIKE-LEAD.correctedExample=Avoid a leading '%'; anchor the prefix or use begins_with / prefix queries in the SDK.
DDB-EXPR-EMPTY.what=Empty DynamoDB expression
DDB-EXPR-EMPTY.why=No expression text was provided for analysis (FilterExpression, KeyConditionExpression, etc.).
DDB-EXPR-EMPTY.correctedExample=Provide a non-empty expression string.
DDB-EXPR-LEX.what=Lexical error in DynamoDB expression
DDB-EXPR-LEX.why=The analyzer hit an invalid character or token in SDK expression syntax.
DDB-EXPR-LEX.correctedExample=Fix the syntax near the location indicated in the server message (or detail payload).
DDB-EXPR-PARSE.what=Parse error in DynamoDB expression
DDB-EXPR-PARSE.why=The expression could not be parsed as a valid tree (parentheses, operators, or malformed call arguments).
DDB-EXPR-PARSE.correctedExample=Check parentheses, operators, and function call arguments.
DDB-EXPR-INPUT.what=Invalid JSON input for expression analyzer
DDB-EXPR-INPUT.why=Structured payloads must include kind, expression, and consistent maps when applicable.
DDB-EXPR-INPUT.correctedExample=Provide valid JSON with kind and expression per the analyzer API.
DDB-KCE-NO-OR.what=KeyConditionExpression does not support OR
DDB-KCE-NO-OR.why=Key conditions for Query must be a conjunction (AND), not OR across branches.
DDB-KCE-NO-OR.correctedExample=Use AND only, or issue separate query operations.
DDB-KCE-PK-META.what=Partition key metadata missing
DDB-KCE-PK-META.why=Without the partition key attribute name, KeyConditionExpression cannot be validated.
DDB-KCE-PK-META.correctedExample=Include partitionKeyAttributeName and expressionAttributeNames in the analysis JSON.
DDB-KCE-PK-MISSING.what=KeyConditionExpression must include the partition key
DDB-KCE-PK-MISSING.why=Query key conditions must reference the partition key with a supported operator.
DDB-KCE-PK-MISSING.correctedExample=Add an equality between the PK path (or its #placeholder) and a :value placeholder.
DDB-KCE-PK-MULTI.what=More than one partition key condition
DDB-KCE-PK-MULTI.why=Only one atomic condition on the partition key is allowed in KeyConditionExpression.
DDB-KCE-PK-MULTI.correctedExample=Combine logic into a single partition key condition.
DDB-KCE-PK-OP.what=Invalid operator or shape for partition key
DDB-KCE-PK-OP.why=The partition key in KeyConditionExpression only supports \\= (not BETWEEN or IN or begins_with on the PK).
DDB-KCE-PK-OP.correctedExample=Use \\= between the PK path and a single value placeholder; use begins_with on the sort key only when applicable.
DDB-KCE-SK-OP.what=Unsupported operator on sort key
DDB-KCE-SK-OP.why=The sort key in KeyConditionExpression allows \\=, range comparisons, BETWEEN, and begins_with; IN and some other operators are not valid there.
DDB-KCE-SK-OP.correctedExample=Use \\=, <, >, <\\=, >\\=, BETWEEN, or begins_with as appropriate; IN is not supported for sort keys in KeyConditionExpression.
DDB-KCE-SK-FUNC.what=Only begins_with() allowed on sort key here
DDB-KCE-SK-FUNC.why=Besides comparators, begins_with is the typical function allowed on the sort key path in KeyConditionExpression.
DDB-KCE-SK-FUNC.correctedExample=Remove other function calls on the sort key path.
DDB-FE-ATTR-EXISTS-ARGS.what=attribute_exists requires one argument
DDB-FE-ATTR-EXISTS-ARGS.why=attribute_exists must take exactly one attribute path.
DDB-FE-ATTR-EXISTS-ARGS.correctedExample=Use attribute_exists(#name.path).
DDB-FE-ATTR-NOT-EXISTS-ARGS.what=attribute_not_exists requires one argument
DDB-FE-ATTR-NOT-EXISTS-ARGS.why=attribute_not_exists must take exactly one attribute path.
DDB-FE-ATTR-NOT-EXISTS-ARGS.correctedExample=Use attribute_not_exists(#name.path).
DDB-FE-CONTAINS-ARGS.what=contains requires two arguments
DDB-FE-CONTAINS-ARGS.why=Signature is contains(path, operand).
DDB-FE-CONTAINS-ARGS.correctedExample=Provide the attribute path and the value or substring placeholder.
DDB-FE-BEGINS-ARGS.what=begins_with requires two arguments
DDB-FE-BEGINS-ARGS.why=Signature is begins_with(path, substr).
DDB-FE-BEGINS-ARGS.correctedExample=Provide the attribute path and the prefix placeholder.
DDB-FE-SIZE-COMP.what=size() must appear in a comparison
DDB-FE-SIZE-COMP.why=size(attr) only makes sense compared to a value (e.g. size(#a) > :n).
DDB-FE-SIZE-COMP.correctedExample=Place size(...) on the left or right side of \\=, <>, <, >, <\\=, or >\\=.
DDB-FE-IN-LARGE.what=IN with many values may hurt performance
DDB-FE-IN-LARGE.why=Very long IN lists increase pressure and expression size.
DDB-FE-IN-LARGE.correctedExample=Split into batches or redesign the access pattern.
DDB-FE-TYPE-MIX.what=Comparing two attribute paths can be misleading
DDB-FE-TYPE-MIX.why=Attribute-to-attribute comparisons without typed value placeholders can yield unexpected results in DynamoDB.
DDB-FE-TYPE-MIX.correctedExample=Compare each side to a typed value placeholder when possible.
DDB-FE-KEY-FILTER.what=Partition key equality in FilterExpression
DDB-FE-KEY-FILTER.why=FilterExpression is applied after data is read; PK equality there wastes RCUs versus KeyConditionExpression on Query.
DDB-FE-KEY-FILTER.correctedExample=Promote partition-key equality to KeyConditionExpression on Query operations.
DDB-PE-NAME-MAP.what=ExpressionAttributeNames entry missing
DDB-PE-NAME-MAP.why=Each #name placeholder must map to the real attribute name.
DDB-PE-NAME-MAP.correctedExample=Add expressionAttributeNames entries for every # token used.
DDB-PE-VAL-MAP.what=ProjectionExpression should not use unmapped :values
DDB-PE-VAL-MAP.why=Projections list attribute paths; :value placeholders belong in ExpressionAttributeValues for other expression types.
DDB-PE-VAL-MAP.correctedExample=Remove :values from ProjectionExpression or map only names with # per the API.
DDB-PE-DUP.what=Duplicate attribute in ProjectionExpression
DDB-PE-DUP.why=The same path appears more than once in the comma-separated list.
DDB-PE-DUP.correctedExample=Remove repeated paths.
DDB-UE-SET-REMOVE.what=SET and REMOVE the same attribute
DDB-UE-SET-REMOVE.why=You cannot assign and remove the same path in one UpdateExpression.
DDB-UE-SET-REMOVE.correctedExample=Keep either SET or REMOVE for that attribute.
DDB-UE-ADD-TYPE.what=ADD only for Number and Set
DDB-UE-ADD-TYPE.why=The ADD action in UpdateExpression does not apply to String or Map.
DDB-UE-ADD-TYPE.correctedExample=Use SET for strings/maps or change the attribute type.
DDB-UE-DEL-TYPE.what=DELETE only on sets
DDB-UE-DEL-TYPE.why=DELETE removes elements from SS, NS, or BS sets.
DDB-UE-DEL-TYPE.correctedExample=Ensure the attribute is a typed set before using DELETE.
DDB-UE-IFNE-WHERE.what=if_not_exists only in SET
DDB-UE-IFNE-WHERE.why=if_not_exists cannot be used in REMOVE, ADD, or DELETE clauses of the same UpdateExpression.
DDB-UE-IFNE-WHERE.correctedExample=Move if_not_exists into a SET clause.
DDB-UE-LAPPEND.what=list_append expects lists
DDB-UE-LAPPEND.why=The second argument to list_append should map to a list in ExpressionAttributeValues.
DDB-UE-LAPPEND.correctedExample=Ensure the second operand is a placeholder bound to a JSON array.
DDB-CE-TAUTO.what=Condition always evaluates to true
DDB-CE-TAUTO.why=Comparing the same placeholder to itself does not guard unwanted writes.
DDB-CE-TAUTO.correctedExample=Compare against a distinct value or use attribute_exists / size checks.
DDB-CE-PK-EXISTS.what=attribute_exists on primary key is redundant
DDB-CE-PK-EXISTS.why=The primary key always exists on a stored item in DynamoDB.
DDB-CE-PK-EXISTS.correctedExample=You can drop attribute_exists for the partition key (and sort key).
ES-STRUCT-001.what=Aggregation type used as query type
ES-STRUCT-001.why=An aggregation key appears directly inside 'query' instead of inside 'aggs'.
ES-STRUCT-001.correctedExample=Move the aggregation to the correct block: {"aggs":{"name":{"type":{...}}}}
ES-MATCH-ALL.what=match_all without filters scans ALL documents
ES-MATCH-ALL.why=A match_all query without filters traverses the entire index, which is very expensive on large indices.
ES-MATCH-ALL.correctedExample=Add a filter inside bool: {"query":{"bool":{"filter":[...]}}}
ES-WILDCARD-LEAD.what=Leading wildcard causes full index scan
ES-WILDCARD-LEAD.why=A pattern starting with * or ? cannot use the inverted index and scans the entire index.
ES-WILDCARD-LEAD.correctedExample=Use edge n-grams in the field mapping instead of leading wildcards.
ES-REGEX.what=Regexp query is CPU-intensive
ES-REGEX.why=Regular expression queries are evaluated term by term and can destabilize the cluster on large indices.
ES-REGEX.correctedExample=Use a keyword field with a terms query, or edge n-grams for prefix matching.
ES-SCRIPT.what=Script query executes on every document
ES-SCRIPT.why=Scripts are evaluated for each document in the index — very slow and potentially unsafe in production.
ES-SCRIPT.correctedExample=Index the computed value at write time and query the indexed field instead.
ES-SIZE-LIMIT.what=size exceeds Elasticsearch maximum limit (10000)
ES-SIZE-LIMIT.why=Elasticsearch cannot return more than 10000 documents in a single request.
ES-SIZE-LIMIT.correctedExample=Use search_after or the Scroll API for pagination beyond 10000 results.
ES-DEEP-PAGE.what=Deep pagination (from + size > 10000)
ES-DEEP-PAGE.why=Deep pagination via from+size is expensive and disabled by default in Elasticsearch.
ES-DEEP-PAGE.correctedExample=Use search_after for deep pagination — it is stateless and scales well.
ES-CROSS-001.what=Multiple queries without size limit
ES-CROSS-001.why=Several queries in the script have no 'size' defined and may retrieve large result sets.
ES-CROSS-001.correctedExample=Add 'size' to each query to control the result window.
ES-CROSS-002.what=Mixed query types in script
ES-CROSS-002.why=The script combines aggregation-only queries with search queries. Verify the intent of each.
ES-CROSS-002.correctedExample=Separate aggregation and search queries if they serve different purposes.
ES-NESTED-DEPTH.what=Query too deeply nested (depth > 5)
ES-NESTED-DEPTH.why=Queries with more than 5 levels of nesting significantly reduce performance.
ES-NESTED-DEPTH.correctedExample=Flatten the query or use bool to combine conditions at the same level.
ES-TRACK-TOTAL.what=track_total_hits: false skips exact document count
ES-TRACK-TOTAL.why=This option improves performance but the response will not include the exact total document count.
ES-TRACK-TOTAL.correctedExample=This is a valid optimization. Remove it if you need the exact total count.
ES-SOURCE-FETCH.what=Fetching full _source is expensive for large result sets
ES-SOURCE-FETCH.why=Returning full _source transfers all fields even if you don't need them.
ES-SOURCE-FETCH.correctedExample=Use 'fields' to select only the needed attributes instead of _source: true.
ES-EXPLAIN.what=explain: true is for debugging only
ES-EXPLAIN.why=Explain mode computes and returns detailed relevance scoring, adding significant overhead.
ES-EXPLAIN.correctedExample=Remove explain: true before using the query in production.
ES-PROFILE.what=profile: true is for debugging only
ES-PROFILE.why=Profile mode measures internal execution times, adding significant overhead.
ES-PROFILE.correctedExample=Remove profile: true before using the query in production.
ES-DATE-FORMAT.what=Date range without 'format' may cause ambiguous parsing
ES-DATE-FORMAT.why=Without specifying the format, Elasticsearch may interpret the date incorrectly depending on the index configuration.
ES-DATE-FORMAT.correctedExample=Specify 'format' in the range query to avoid ambiguity: "format": "yyyy-MM-dd"
ES-DATE-TZ.what=Date range without time_zone may return unexpected results
ES-DATE-TZ.why=Without time_zone, date comparisons use UTC, which may be incorrect for multi-timezone data.
ES-DATE-TZ.correctedExample=Add time_zone: '+00:00' or your target timezone to the range query.
ES-DATE-HIST-INTERVAL.what=date_histogram requires calendar_interval or fixed_interval
ES-DATE-HIST-INTERVAL.why=Without specifying an interval, the date_histogram aggregation cannot group documents by time.
ES-DATE-HIST-INTERVAL.correctedExample=Add calendar_interval (e.g. '1d', '1M') or fixed_interval (e.g. '7d', '1h').
ES-DATE-HIST-DEPRECATED.what='interval' in date_histogram is deprecated since ES 7.2
ES-DATE-HIST-DEPRECATED.why=The 'interval' field was replaced by 'calendar_interval' and 'fixed_interval' in Elasticsearch 7.2.
ES-DATE-HIST-DEPRECATED.correctedExample=Replace 'interval' with 'calendar_interval' or 'fixed_interval'.
ES-FUZZY-HIGH.what=fuzziness > 2 impacts performance without improving recall
ES-FUZZY-HIGH.why=Fuzziness values greater than 2 generate too many term variations and slow down the search.
ES-FUZZY-HIGH.correctedExample=Use fuzziness: 1 or 2; consider AUTO for field-length-aware fuzziness.
ES-REGEXP-STATES.what=Regexp without max_determinized_states limit may cause out-of-memory errors
ES-REGEXP-STATES.why=Complex regular expressions generate large automata. Without a limit, they may exhaust node memory.
ES-REGEXP-STATES.correctedExample=Add max_determinized_states: 10000 to limit automaton complexity.
ES-MLT-FREQ.what=more_like_this without min_term_freq includes very rare terms
ES-MLT-FREQ.why=Without min_term_freq, the query includes terms that appear very few times and contribute little to results.
ES-MLT-FREQ.correctedExample=Set min_term_freq: 2 to filter out terms that appear only once.
ES-PHRASE-SLOP.what=High slop in match_phrase reduces precision significantly
ES-PHRASE-SLOP.why=A slop greater than 5 allows too much distance between phrase words, returning irrelevant results.
ES-PHRASE-SLOP.correctedExample=Keep slop <\\= 2 for reasonable precision; use match for looser matching.
ES-NESTED-NO-PATH.what=nested aggregation requires 'path' field
ES-NESTED-NO-PATH.why=Without 'path', the nested aggregation does not know which document field is of type nested.
ES-NESTED-NO-PATH.correctedExample=Add path: 'field_name' where field_name is the nested object field.
ES-REV-NESTED-CONTEXT.what=reverse_nested must be used inside a nested aggregation
ES-REV-NESTED-CONTEXT.why=reverse_nested only makes sense as a sub-aggregation of nested to return to the root document.
ES-REV-NESTED-CONTEXT.correctedExample=Place reverse_nested as a sub-aggregation of a nested aggregation.
ES-TERMS-NO-SIZE.what=terms aggregation without explicit size returns only the top 10
ES-TERMS-NO-SIZE.why=The default size in terms is 10, which may hide relevant buckets.
ES-TERMS-NO-SIZE.correctedExample=Set size explicitly to control how many buckets are returned.
ES-CARDINALITY-THRESHOLD.what=precision_threshold > 40000 uses excessive memory with minimal gain
ES-CARDINALITY-THRESHOLD.why=Values above 40000 consume a lot of memory without significantly improving precision.
ES-CARDINALITY-THRESHOLD.correctedExample=Set precision_threshold between 1000 and 40000 for the best memory/accuracy balance.
ES-BUCKET-SCRIPT-PATH.what=bucket_script requires buckets_path to reference sibling aggregations
ES-BUCKET-SCRIPT-PATH.why=Without buckets_path, the bucket_script script has no access to sibling aggregation values.
ES-BUCKET-SCRIPT-PATH.correctedExample=Add buckets_path: { var1: 'agg_name' } to bucket_script.
ES-BUCKET-SEL-FIELDS.what=bucket_selector requires both buckets_path and script
ES-BUCKET-SEL-FIELDS.why=bucket_selector needs both fields: references to sibling aggregations and the filter condition.
ES-BUCKET-SEL-FIELDS.correctedExample=Add buckets_path (references) and script (condition) to bucket_selector.
ES-MOVING-AVG-DEPRECATED.what=moving_avg is deprecated — use moving_fn instead
ES-MOVING-AVG-DEPRECATED.why=The moving_avg aggregation was replaced by moving_fn in recent versions of Elasticsearch.
ES-MOVING-AVG-DEPRECATED.correctedExample=Replace moving_avg with moving_fn using MovingFunctions.unweightedAvg(values).
ES-AGG-DEPTH.what=Deeply nested aggregations (> 4 levels) impact memory and performance
ES-AGG-DEPTH.why=Aggregations with more than 4 nesting levels impact cluster memory and performance.
ES-AGG-DEPTH.correctedExample=Restructure aggregations to reduce nesting or use composite aggregation.
ES-FUNC-SCORE-QUERY.what=function_score without query evaluates ALL documents
ES-FUNC-SCORE-QUERY.why=Without an inner query, function_score applies scoring functions to all documents in the index.
ES-FUNC-SCORE-QUERY.correctedExample=Add a query inside function_score to filter documents before applying functions.
ES-FUNC-SCORE-REPLACE.what=boost_mode 'replace' ignores the original relevance score
ES-FUNC-SCORE-REPLACE.why=With boost_mode: replace, the original query score is completely discarded.
ES-FUNC-SCORE-REPLACE.correctedExample=Use boost_mode: 'multiply' or 'sum' to combine the original score with the function score.
ES-SCRIPT-SCORE-LANG.what=script_score without lang defaults to 'painless'
ES-SCRIPT-SCORE-LANG.why=Without specifying the language, Elasticsearch assumes painless. It is good practice to be explicit.
ES-SCRIPT-SCORE-LANG.correctedExample=Add lang: 'painless' to make the intent clear.
ES-CONST-SCORE-BOOST.what=constant_score without boost defaults to 1.0
ES-CONST-SCORE-BOOST.why=Without specifying boost, all documents receive a score of 1.0, which may not be the intent.
ES-CONST-SCORE-BOOST.correctedExample=Add boost: 1.5 (or desired value) to make the score explicit.
ES-GEO-DIST-UNIT.what=geo_distance without unit defaults to meters
ES-GEO-DIST-UNIT.why=Without specifying the unit, the distance is interpreted in meters, which may be unexpected.
ES-GEO-DIST-UNIT.correctedExample=Add unit: 'km', 'mi', 'm', etc. to make the intent explicit.
ES-GEO-BBOX-LAT.what=geo_bounding_box: top_left latitude must be greater than bottom_right latitude
ES-GEO-BBOX-LAT.why=The bounding box coordinates are inverted — top_left must have a greater latitude than bottom_right.
ES-GEO-BBOX-LAT.correctedExample=Swap top_left and bottom_right coordinates, or correct the latitude values.
ES-GEO-SHAPE-REL.what=geo_shape without relation defaults to 'intersects'
ES-GEO-SHAPE-REL.why=Without specifying the spatial relation, Elasticsearch uses 'intersects', which may not be the intent.
ES-GEO-SHAPE-REL.correctedExample=Add relation: 'intersects', 'within', or 'contains' to make the intent explicit.
ES-KNN-K.what=knn requires the 'k' field (number of nearest neighbors)
ES-KNN-K.why=Without 'k', the knn query does not know how many neighbors to return.
ES-KNN-K.correctedExample=Add k: 10 (or your desired number) to the knn query.
ES-KNN-CANDIDATES.what=knn without num_candidates may reduce recall
ES-KNN-CANDIDATES.why=Without num_candidates, Elasticsearch uses a default value that may not be sufficient for good accuracy.
ES-KNN-CANDIDATES.correctedExample=Set num_candidates to at least 1.5 * k for good accuracy (e.g. k\\=10 → num_candidates\\=15).
MGO-SV-001.what=Required field missing for your collection rules
MGO-SV-001.why=Think of a form with a required box left empty: the office will reject it. Your insert is that form and one required box is empty.
MGO-SV-001.correctedExample=Add the missing field with a sensible value, or update the rules if the requirement changed.
MGO-SV-002.what=Extra field not allowed by your rules
MGO-SV-002.why=Like bringing an extra item to a potluck when the host said only three dishes—your data brought something not on the approved list.
MGO-SV-002.correctedExample=Remove the unexpected field or extend the rules to list it under allowed properties.
MGO-SV-003.what=Value type does not match the rule
MGO-SV-003.why=It is like writing a word where a number was asked—the slot shape does not match what you put in.
MGO-SV-003.correctedExample=Match the value to the expected shape (text, number, date, list, etc.) or adjust the rule if the model changed.
LUA-001.what=Fragile error handling in the script
LUA-001.why=Like pulling one wrong lever that shuts down the whole factory line instead of flashing a warning you can fix.
LUA-001.correctedExample=Use the safer call style so failures can be handled without aborting the entire script.
LUA-002.what=Loop may never finish
LUA-002.why=Like a merry-go-round with no brake—if nothing changes, it could spin without stopping.
LUA-002.correctedExample=Add a clear stop condition, a counter limit, or an exit path so the script cannot spin forever.
LUA-003.what=Global variable in the script
LUA-003.why=Like writing everyone’s notes on a shared whiteboard instead of your own notepad—others might overwrite and it is messier.
LUA-003.correctedExample=Declare variables with local so each run stays tidy and faster.
LUA-004.what=Keys and script may disagree in cluster mode
LUA-004.why=Like a delivery list that names three doors but the driver tries a fourth—cluster mode needs the exact named doors.
LUA-004.correctedExample=Pass every key you read or write through the declared keys list and use KEYS[n] inside the script.
LUA-005.what=Arguments treated as numbers without converting
LUA-005.why=Like doing math on price tags still in their plastic sleeves—the number is there but you should unwrap it first.
LUA-005.correctedExample=Convert arguments with a numeric cast before doing arithmetic.
LUA-006.what=Very long script
LUA-006.why=Like a single recipe that fills ten pages—easier to follow when split into steps or cards.
LUA-006.correctedExample=Split logic into smaller scripts or load helpers once and reuse their hash.
LUA-007.what=Many Redis calls inside a loop
LUA-007.why=Like calling the front desk once per sock instead of asking for the whole drawer—many small trips add up.
LUA-007.correctedExample=Batch work with a client-side pipeline outside Lua or shrink what each iteration does.
RDS-PIP-001.what=Risky command queued inside a transaction block
RDS-PIP-001.why=Like locking the building doors and then planning to search every room with a bulldozer—dangerous while the queue is active.
RDS-PIP-001.correctedExample=Move broad scans and full-database wipes outside MULTI/EXEC or avoid them entirely in production.
RDS-PIP-002.what=Very large batch of queued commands
RDS-PIP-002.why=Like stacking a thousand plates for one trip—easier and safer in several smaller stacks.
RDS-PIP-002.correctedExample=Split into smaller batches or raise client timeouts only after measuring safe sizes.
RDS-PIP-003.what=Watch without a matching finish
RDS-PIP-003.why=Like setting an alarm but never pressing start or stop—the system stays waiting awkwardly.
RDS-PIP-003.correctedExample=Pair watch with MULTI, queued work, EXEC, or explicitly cancel with UNWATCH.
RDS-ACL-001.what=Account rules look too powerful
RDS-ACL-001.why=Like giving a temp badge that opens every door including the vault—trim access to real needs.
RDS-ACL-001.correctedExample=Narrow categories and key patterns to what that identity truly needs.
RDS-ACL-002.what=Read-only style rules with broad key reach
RDS-ACL-002.why=Like a library pass that says reading only but works for every shelf in every branch—still risky if lost.
RDS-ACL-002.correctedExample=Tighten the key pattern to real prefixes your app uses.
RDS-ACL-003.what=Removing a protected default user
RDS-ACL-003.why=Like removing the only master key copy—make sure someone else can still open the office.
RDS-ACL-003.correctedExample=Ensure another admin account exists before removing defaults.
RDS-MOD-001.what=JSON module dependency
RDS-MOD-001.why=Like needing a special attachment for your drill—without the module the command will not exist on plain Redis.
RDS-MOD-001.correctedExample=Install and enable RedisJSON on every node before relying on this in production.
RDS-MOD-002.what=Search module dependency
RDS-MOD-002.why=Like expecting a bookstore search desk in a warehouse that only stacks boxes—add the search service first.
RDS-MOD-002.correctedExample=Provision the search module and index before using FT.* in production paths.
CAS-BATCH-001.what=Batch is extremely large
CAS-BATCH-001.why=Like handing a courier fifty heavy boxes at once—split trips so nothing collapses.
CAS-BATCH-001.correctedExample=Split into smaller batches or use asynchronous writes with a concurrency cap.
CAS-BATCH-002.what=Batch crosses partition boundaries
CAS-BATCH-002.why=Like mailing letters to many cities in one envelope—sort by destination before posting.
CAS-BATCH-002.correctedExample=Group writes that share one partition or send separate batches per partition.
CAS-BATCH-003.what=Good use of an unlogged single-partition batch
CAS-BATCH-003.why=Like loading one moving truck for one neighborhood—efficient when everything shares the same stop.
CAS-BATCH-003.correctedExample=Keep this pattern; avoid mixing unrelated partitions in the same batch.
CAS-BATCH-004.what=Logged batch used where unlogged would do
CAS-BATCH-004.why=Like insured overnight shipping for a letter you could walk next door—lighter option fits.
CAS-BATCH-004.correctedExample=Switch to BEGIN UNLOGGED BATCH when every mutation shares the same partition key.
CAS-BATCH-005.what=Counter batch mixes regular writes
CAS-BATCH-005.why=Like a coins-only lane with someone trying to pay with a couch—split incompatible items.
CAS-BATCH-005.correctedExample=Move inserts, deletes, and normal updates outside the counter batch.
CAS-LWT-001.what=Conditional write on a hot partition
CAS-LWT-001.why=Like asking everyone in a stadium line to re-vote each step—works but jams if the line is huge.
CAS-LWT-001.correctedExample=Spread hot keys, reduce Paxos use, or redesign access so consensus hits cooler partitions.
CAS-LWT-002.what=Several conditional writes in one batch
CAS-LWT-002.why=Like several veto votes stacked in one envelope—Cassandra still counts them separately.
CAS-LWT-002.correctedExample=Keep at most one conditional statement per batch or run them outside BATCH.
CAS-LWT-003.what=Remember to read the yes-or-no flag
CAS-LWT-003.why=Like asking “did the door actually lock?” instead of walking away assuming it clicked.
CAS-LWT-003.correctedExample=In application code read the applied or CAS result before assuming data changed.
CAS-UDF-001.what=Function stability not declared
CAS-UDF-001.why=Like a recipe that never says bake time—engines need a hint whether output is repeatable.
CAS-UDF-001.correctedExample=Add the deterministic clause your Cassandra version supports, or keep the body free of randomness and side effects.
CAS-UDF-002.what=Function may run too long inside queries
CAS-UDF-002.why=Like doing a marathon inside a checkout line—everyone behind you waits.
CAS-UDF-002.correctedExample=Simplify logic, lower iteration counts, or move heavy work to the application tier.
CAS-UDF-003.what=Function touches the outside world
CAS-UDF-003.why=Like asking the bank teller to step out mid-transaction—breaks the safe sandbox.
CAS-UDF-003.correctedExample=Remove external access; UDFs must stay pure and fast for safe execution in Cassandra.
CAS-UDA-001.what=Aggregate missing starting value
CAS-UDA-001.why=Like a scoreboard with no starting score—set zero or an agreed baseline.
CAS-UDA-001.correctedExample=Provide INITCOND with a literal compatible with the state type, even if null.
CAS-UDA-002.what=State function not found in script
CAS-UDA-002.why=Like referencing chapter five in a booklet that only has four chapters.
CAS-UDA-002.correctedExample=Define SFUNC earlier in the migration or fix the name and keyspace.
CAS-TRG-001.what=Trigger class cannot be verified here
CAS-TRG-001.why=Like hiring a magician without a rehearsal—you must test on the real stage.
CAS-TRG-001.correctedExample=Ship the JAR to every node and validate trigger behavior in staging.
CAS-TRG-002.what=Trigger targets system data
CAS-TRG-002.why=Like wiring a home alarm to the city hall breaker—off limits.
CAS-TRG-002.correctedExample=Point triggers only at application tables under your keyspaces.
CAS-DCL-001.what=Role can log in but has no password
CAS-DCL-001.why=Like issuing an ID badge that opens doors but never sets a PIN—unsafe.
CAS-DCL-001.correctedExample=Add a strong password and explicitly set LOGIN or SUPERUSER only when needed.
CAS-DCL-002.what=All-powerful grant or revoke
CAS-DCL-002.why=Like handing master keys to every room when one closet was requested.
CAS-DCL-002.correctedExample=List specific permissions on specific resources instead of ALL.
CAS-DCL-003.what=Superuser flag enabled
CAS-DCL-003.why=Like giving airport security master override to every intern—keep it rare.
CAS-DCL-003.correctedExample=Reserve superuser for break-glass accounts and use narrow roles elsewhere.
CAS-DCL-004.what=Keyspace-wide permission change
CAS-DCL-004.why=Like painting every room because one wall needed touch-up—narrow the brush.
CAS-DCL-004.correctedExample=If only one table needs access, scope the statement to that table.
CAS-DCL-005.what=Odd role nesting
CAS-DCL-005.why=Like giving your house key to a guest who only has a library card—mismatch of access types.
CAS-DCL-005.correctedExample=Enable LOGIN on the delegated role or grant a role meant for interactive use.
CAS-AUTH-001.what=Password looks weak
CAS-AUTH-001.why=Like a bike lock with three digits—easy for others to guess.
CAS-AUTH-001.correctedExample=Use at least eight characters mixing letters, numbers, and symbols for human accounts.
DDB-TX-001.what=Too many actions in one transaction
DDB-TX-001.why=Like stuffing a hundred envelopes through a mail slot that only accepts ten at a time.
DDB-TX-001.correctedExample=Split into multiple transactions or reorder work so unrelated writes are separate.
DDB-TX-002.what=Reads and writes mixed in one transaction API
DDB-TX-002.why=Like trying to checkout and inventory-count in one impossible single receipt line.
DDB-TX-002.correctedExample=Use the read-only transaction API for Gets or drop Gets from this payload.
DDB-TX-003.what=Condition check missing its rule text
DDB-TX-003.why=Like a referee asked to blow the whistle but no rule was written down.
DDB-TX-003.correctedExample=Add ConditionExpression describing what must be true before the check succeeds.
DDB-TX-004.what=Many tables touched in one transaction
DDB-TX-004.why=Like one contract signing for apartments in three cities—possible but needs a reason on file.
DDB-TX-004.correctedExample=Document why it is intentional or split work; you can mark the payload as justified in tooling.
DDB-COND-001.what=Update helpers used inside a condition
DDB-COND-001.why=Like using a oven timer to unlock a door—the gadget belongs in the kitchen step, not the lock.
DDB-COND-001.correctedExample=Move those checks into UpdateExpression or use a transaction item designed for checks.
DDB-COND-002.what=Exists-check missing a real field path
DDB-COND-002.why=Like asking “does it exist?” without saying what “it” is.
DDB-COND-002.correctedExample=Pass a name path such as #pk or status, not a :value token.
DDB-COND-003.what=Size check on a number field
DDB-COND-003.why=Like measuring the weight of a sound—numbers need math, not length rulers.
DDB-COND-003.correctedExample=Compare numbers directly or store lengths in a separate attribute if you need them.
DDB-STR-001.what=Change stream on but no item expiry rules
DDB-STR-001.why=Like recording security video without deciding how long to keep tapes—set retention for the rows too.
DDB-STR-001.correctedExample=Turn on table TTL if rows should disappear on their own, alongside streaming.
DDB-STR-002.what=Stream consumer without a dead-letter path
DDB-STR-002.why=Like a mailroom with no damaged-parcel shelf—problem letters need a side bin.
DDB-STR-002.correctedExample=Add on-failure routing so bad events cannot loop forever.
DDB-BAK-001.what=Production backups appear off
DDB-BAK-001.why=Like leaving the fire extinguisher pin in during opening night—turn safety on for prod.
DDB-BAK-001.correctedExample=Enable continuous backups and verify restore drills regularly.
DDB-BAK-002.what=Restore target name matches source
DDB-BAK-002.why=Like photocopying a book onto the original pages—use a blank notebook first.
DDB-BAK-002.correctedExample=Restore to a new table name first, then carefully swap traffic.
DDB-BAK-003.what=Point-in-time recovery disabled
DDB-BAK-003.why=Like having yearly photos instead of daily ones—you recover less detail.
DDB-BAK-003.correctedExample=Enable PITR when the table matters and you need minute-level recovery.
DDB-API-001.what=Star query on a large table
DDB-API-001.why=Like emptying a warehouse through a single door—go in batches and carry only what you need.
DDB-API-001.correctedExample=Page with continuation keys and project only needed attributes.
DDB-API-002.what=Update missing partition key filter
DDB-API-002.why=Like updating an address book without saying which contact—name the row first.
DDB-API-002.correctedExample=Add WHERE with partition key equality and sort key if the table defines one.
PNL-001.what=Loop may never stop
PNL-001.why=Like a treadmill stuck on max with no stop cord—give yourself a way off.
PNL-001.correctedExample=Add a finite bound, change the condition each pass, or return or break inside the body.
PNL-002.what=Field name not in the known list
PNL-002.why=Like asking for aisle twelve in a store that only has ten aisles.
PNL-002.correctedExample=Fix the spelling or refresh the mapping list you pass to the analyzer.
PNL-003.what=Changing stored data in the wrong script type
PNL-003.why=Like trying to rewrite a library book during a public reading—borrow the checkout desk instead.
PNL-003.correctedExample=Move changes to an update or ingest pipeline script instead.
PNL-004.what=Script must hand back a value
PNL-004.why=Like a math quiz that says “show your answer” and you only showed work.
PNL-004.correctedExample=End with an explicit return that hands back the score or value the caller needs.
PNL-005.what=Heavy loop inside an aggregation script
PNL-005.why=Like counting beans in every jar while customers wait at each checkout.
PNL-005.correctedExample=Prefer doc values, parameters, or precomputed metrics instead of big loops per bucket.
PNL-006.what=Document read without safety net
PNL-006.why=Like opening a locker without checking the number—have a plan if it jams.
PNL-006.correctedExample=Wrap doc access in try/catch or guard with safe defaults.
PNL-007.what=Randomness inside scoring logic
PNL-007.why=Like rolling dice to grade homework—results won’t match tomorrow.
PNL-007.correctedExample=Use fixed weights or pass any randomness through params from outside.
ES-IP-001.what=Pipeline lacks failure handling
ES-IP-001.why=Like a factory line with no red stop button when a machine jams.
ES-IP-001.correctedExample=Add on_failure at the pipeline or step level so errors surface clearly.
ES-IP-002.what=Very long processor chain
ES-IP-002.why=Like a recipe with twenty chapters—split into courses people can follow.
ES-IP-002.correctedExample=Split into smaller pipelines and link them with a pipeline processor.
ES-IP-003.what=Nested pipeline reference
ES-IP-003.why=Like linking to another book’s chapter without checking the book is on the shelf.
ES-IP-003.correctedExample=Confirm the child pipeline exists in every cluster before production rollout.
ES-IP-004.what=Foreach step missing inner processor
ES-IP-004.why=Like a loop that says “for each item do nothing”—define the action.
ES-IP-004.correctedExample=Add processor: { "set": { ... } } or another processor inside foreach.
ES-IP-005.what=Script language not spelled out
ES-IP-005.why=Like shipping a battery without saying rechargeable—state it clearly.
ES-IP-005.correctedExample=Write lang explicitly so operators know which engine runs.
ES-IP-006.what=Grok pattern very complex
ES-IP-006.why=Like asking one regex to read a whole newspaper—give it smaller paragraphs.
ES-IP-006.correctedExample=Simplify the pattern or split parsing across multiple processors.
ES-IP-007.what=Rename after remove on same field
ES-IP-007.why=Like erasing a name tag then asking someone to read it—fix the order.
ES-IP-007.correctedExample=Reorder processors so rename happens before remove, or rename a field that still exists.
ES-RX-001.what=Reindex runs single-threaded
ES-RX-001.why=Like moving a warehouse with one hand truck—rent more carts.
ES-RX-001.correctedExample=Set slices to auto or a positive integer to parallelize across shards.
ES-RX-002.what=Reindex script ignores delete events
ES-RX-002.why=Like packing boxes without checking if the order was cancelled.
ES-RX-002.correctedExample=Guard writes with if (ctx.op \\=\\= 'index' || ctx.op \\=\\= 'create') { ... }.
ES-RX-003.what=Same-cluster reindex note
ES-RX-003.why=Like photocopying in-house versus mailing to another office—this path is in-house.
ES-RX-003.correctedExample=For cross-cluster copies add source.remote with the remote cluster settings.
ES-ILM-001.what=Hot phase without rollover
ES-ILM-001.why=Like a trash can with no liner change schedule—it overflows eventually.
ES-ILM-001.correctedExample=Add rollover with max age, size, or document count thresholds.
ES-ILM-002.what=Delete phase without retention delay
ES-ILM-002.why=Like tossing files with no “keep for one year” rule—define how long to wait.
ES-ILM-002.correctedExample=Set min_age such as 90d so deletion happens after a clear retention window.
ES-ILM-003.what=Shrink listed before force merge
ES-ILM-003.why=Like folding laundry before washing—swap to the usual efficient order.
ES-ILM-003.correctedExample=Put forcemerge before shrink for clearer maintenance flow.
ES-ILM-004.what=Cold phase without freeze
ES-ILM-004.why=Like storing winter coats unpacked—freezing packs them tighter.
ES-ILM-004.correctedExample=Add freeze in cold when you want read-only archival with lower heap use.
ES-ILM-005.what=No delete phase in lifecycle policy
ES-ILM-005.why=Like a closet that never gets cleaned—eventually there is no room.
ES-ILM-005.correctedExample=Add a delete phase or another managed cleanup path for aged data.
ES-SNP-001.what=Snapshot repository not compressed
ES-SNP-001.why=Like mailing clothes without vacuum bags—they take more space.
ES-SNP-001.correctedExample=Enable compress where the repository type supports it.
ES-SNP-002.what=Restore without rename pattern
ES-SNP-002.why=Like moving furniture into a room that still has furniture—label new rooms.
ES-SNP-002.correctedExample=Set rename_pattern and rename_replacement to land on new names first.
ES-SNP-003.what=Repository lacks verification hint
ES-SNP-003.why=Like a smoke detector with no test reminder—schedule a check.
ES-SNP-003.correctedExample=Periodically verify the repository or use SLM with a cron schedule.
ES-SNP-004.what=Snapshot includes global cluster state
ES-SNP-004.why=Like backing up the whole building blueprint when you only meant one apartment.
ES-SNP-004.correctedExample=Prefer false unless you intentionally restore global metadata.
ES-TPL-001.what=Template params incomplete
ES-TPL-001.why=Like a form missing blanks the letter asks for—fill every referenced field.
ES-TPL-001.correctedExample=Add each name under params or add default inverted sections in the template.
ES-TPL-002.what=Optional params without defaults
ES-TPL-002.why=Like optional toppings without a “none” line on the order form.
ES-TPL-002.correctedExample=Add {{^name}}...{{/name}} for optional parameters that may be absent.
ES-TPL-003.what=Template looks like unsafe string assembly
ES-TPL-003.why=Like gluing stranger sentences into a contract—use placeholders and structured fields.
ES-TPL-003.correctedExample=Build queries from structured JSON fields instead of pasting user text into clauses.
ES-TPL-004.what=Validate template before production
ES-TPL-004.why=Like rehearsing a speech with the actual microphone, not only on paper.
ES-TPL-004.correctedExample=Call POST _render/template with production-like params before go-live.
ES-RND-001.what=Render params line up cleanly
ES-RND-001.why=Like a dress rehearsal where every actor showed up with the right props.
ES-RND-001.correctedExample=Keep using this dry-run style for CI checks on stored templates too.
ES-RND-002.what=Unused render parameter keys
ES-RND-002.why=Like packing shoes for a beach trip you never mention—drop unused baggage.
ES-RND-002.correctedExample=Remove unused keys to keep requests obvious and avoid confusion.
CQL-BATCH-APPLY.what=Batch not closed properly
CQL-BATCH-APPLY.why=Like sealing a letter but forgetting to write “end of letter” on a form that requires it.
CQL-BATCH-APPLY.correctedExample=Finish the batch with APPLY BATCH before the semicolon so the server accepts it.
CQL-BATCH-LARGE.what=Very large Cassandra batch
CQL-BATCH-LARGE.why=Like loading one elevator with everyone in the building—several trips are safer.
CQL-BATCH-LARGE.correctedExample=Split into smaller batches or use asynchronous writes with a safe concurrency limit.
DDB-MGMT-JSON.what=Invalid JSON for DynamoDB management
DDB-MGMT-JSON.why=Like a customs form smudged unreadable—the officer sends it back unread.
DDB-MGMT-JSON.correctedExample=Fix braces, commas, and quotes, then resend the management-style payload.
DDB-STR-VIEW.what=Unknown stream view type
DDB-STR-VIEW.why=Like picking a camera mode that your phone model does not offer.
DDB-STR-VIEW.correctedExample=Use KEYS_ONLY, NEW_IMAGE, OLD_IMAGE, or NEW_AND_OLD_IMAGES.
DDB-TX-JSON.what=Invalid JSON for a transaction request
DDB-TX-JSON.why=Like a shopping list torn in half—the cashier cannot read the cart.
DDB-TX-JSON.correctedExample=Validate JSON structure and ensure TransactItems is an array before retrying.
ES-CROSS-003.what=Mixed Elasticsearch API styles in one script
ES-CROSS-003.why=Like mailing letters, parcels, and legal filings in one envelope—sort them by counter.
ES-CROSS-003.correctedExample=Send each kind to its proper HTTP path (/_search, /_ingest/pipeline, /_reindex, etc.).
ES-CROSS-004.what=Several ingest pipeline definitions together
ES-CROSS-004.why=Like stacking several recipe cards—order of filing matters only to your kitchen, not the oven.
ES-CROSS-004.correctedExample=Document dependencies between pipelines in your runbook or CI.
LUA-PARSE-ERROR.what=Lua script could not be parsed
LUA-PARSE-ERROR.why=Like a knitting pattern with a skipped row—the next stitches do not line up.
LUA-PARSE-ERROR.correctedExample=Check quotes, brackets, if/for/end structure, and comments near the reported line.
MGO-AGG-PERF-001.what=Long pipeline without an early filter
MGO-AGG-PERF-001.why=Like washing every dish in the building before choosing which shelf to fill—rinse the pile first.
MGO-AGG-PERF-001.correctedExample=Put a selective $match stage first to shrink the working set.
MGO-ELEM-001.what=Element query with no real condition
MGO-ELEM-001.why=Like saying “any row in the spreadsheet” without saying which column to check.
MGO-ELEM-001.correctedExample=Add at least one predicate inside $elemMatch, for example a comparison on a field.
MGO-GEO-IDX-001.what=Geospatial query needs an index
MGO-GEO-IDX-001.why=Like using a map app offline with no downloaded tiles—the route cannot load.
MGO-GEO-IDX-001.correctedExample=Create the right geo index before relying on these queries in production.
MGO-GEO-NEAR-001.what=Near query without a distance cap
MGO-GEO-NEAR-001.why=Like asking for every restaurant on Earth sorted by distance—say how far you will travel.
MGO-GEO-NEAR-001.correctedExample=Add $maxDistance (and optionally $minDistance) to bound the search radius.
MGO-GEO-POLY-001.what=Polygon ring not closed
MGO-GEO-POLY-001.why=Like drawing a fence line that does not reconnect to the first post.
MGO-GEO-POLY-001.correctedExample=Close each linear ring by copying the first coordinate to the end.
MGO-JS-101.what=Server script reads fields with “this”
MGO-JS-101.why=Like using a magic notebook that rewrites itself—harder for others to review safely.
MGO-JS-101.correctedExample=Prefer query operators, aggregation, or $expr instead of server-side JavaScript.
MGO-JS-102.what=Dangerous call in server-side JavaScript
MGO-JS-102.why=Like handing a stranger a master remote for your house—revoke risky calls.
MGO-JS-102.correctedExample=Remove these calls; they can enable abuse or unexpected behavior.
MGO-OID-001.what=ObjectId compared as plain text
MGO-OID-001.why=Like comparing a locker number written on paper to the metal chip inside the key—different shapes.
MGO-OID-001.correctedExample=Use ObjectId("...") or the correct BSON type your driver expects.
MGO-PUSH-001.what=Push several values without $each
MGO-PUSH-001.why=Like loading several plates on one tray tag—stack them using the tray’s divider.
MGO-PUSH-001.correctedExample=Wrap values as { $each: [ ... ] } inside $push or $addToSet.
MGO-PULL-001.what=Pull rule is empty
MGO-PULL-001.why=Like “remove every sticker” with no rule about which sticker—everything may go.
MGO-PULL-001.correctedExample=Add explicit predicates to $pull or confirm you truly want to clear matching entries.
MGO-TEXT-LANG-001.what=Text search language not recognized
MGO-TEXT-LANG-001.why=Like choosing spell-check for a language your dictionary does not ship with.
MGO-TEXT-LANG-001.correctedExample=Pick a supported language code or omit $language to use the index default.
PNL-PARSE-ERROR.what=Painless script could not be parsed
PNL-PARSE-ERROR.why=Like a formula in a spreadsheet with one extra parenthesis—the sheet stops calculating.
PNL-PARSE-ERROR.correctedExample=Check braces, semicolons, def usage, and comments around the error location.
RDS-TX-005.what=Transaction left open at end of script
RDS-TX-005.why=Like leaving a checkout lane mid-ring without paying or voiding—the register stays stuck.
RDS-TX-005.correctedExample=Always close MULTI with EXEC to apply or DISCARD to cancel before finishing the script.
SEM-001.what=DELETE without a WHERE clause
SEM-001.why=Without WHERE, this command would delete ALL rows in the table — like saying delete every file in the folder without naming which one.
SEM-001.correctedExample=DELETE FROM users WHERE id \\= 42;
SEM-002.what=UPDATE without a WHERE clause
SEM-002.why=Without WHERE, this UPDATE would change every row — like editing every page when you meant one.
SEM-002.correctedExample=UPDATE users SET active \\= false WHERE id \\= 42;
