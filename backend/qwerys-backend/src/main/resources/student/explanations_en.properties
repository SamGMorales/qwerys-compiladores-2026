PARSE-INCOMPLETE.what=The query is incomplete. Check that the syntax is properly closed.
PARSE-INCOMPLETE.why=The query is incomplete. Check that the syntax is properly closed.
PARSE-INCOMPLETE-LIKE.what=LIKE requires a search value in quotes, for example: LIKE '%text%'
PARSE-INCOMPLETE-LIKE.why=LIKE requires a search value in quotes, for example: LIKE '%text%'
SYN-001-SQL.what=SQL syntax error
SYN-001-SQL.why=The parser reported invalid SQL at the indicated position.
SYN-001-SQL.correctedExample=Fix the construct shown in the detail message; check parentheses, commas, and keywords.
SYN-001-PARTIQL.what=PartiQL syntax error (DynamoDB)
SYN-001-PARTIQL.why=The PartiQL statement is not valid at the indicated position.
SYN-001-PARTIQL.correctedExample=Review PartiQL SELECT/INSERT/UPDATE/DELETE and literals supported by DynamoDB.
ES-SYNTAX-001.what=Invalid JSON — query cannot be parsed
ES-SYNTAX-001.why=The query is not valid JSON. The analyzer cannot continue.
ES-SYNTAX-001.correctedExample=Check JSON syntax: balanced braces, brackets, commas, and quotes.
SE-LIKE-ALL.what=LIKE '%' matches ALL records — it is equivalent to removing the WHERE clause. Specify a real search term.
SE-LIKE-ALL.why=LIKE '%' matches ALL records — it is equivalent to removing the WHERE clause. Specify a real search term.
SE-LIKE-SHORT.what=Search term is too short (1-2 characters). This could return millions of rows. Use at least 3 characters.
SE-LIKE-SHORT.why=Search term is too short (1-2 characters). This could return millions of rows. Use at least 3 characters.
SE-NULL-EQUALS.what=Use IS NULL or IS NOT NULL to compare with NULL. Comparisons using \\= NULL always return false in SQL.
SE-NULL-EQUALS.why=Use IS NULL or IS NOT NULL to compare with NULL. Comparisons using \\= NULL always return false in SQL.
SE-BETWEEN-INV.what=BETWEEN range is inverted. The first value must be less than the second. E.g.: BETWEEN 1 AND 100.
SE-BETWEEN-INV.why=BETWEEN range is inverted. The first value must be less than the second. E.g.: BETWEEN 1 AND 100.
SE-DIV-ZERO.what=Division by zero detected in the expression. This will cause a runtime error.
SE-DIV-ZERO.why=Division by zero detected in the expression. This will cause a runtime error.
SE-EMPTY-STR.what=Comparison with empty string ('') detected. Verify if this is intentional or if the real value is missing.
SE-EMPTY-STR.why=Comparison with empty string ('') detected. Verify if this is intentional or if the real value is missing.
SE-CARTESIAN.what=Cartesian product detected: multiple tables in FROM without a JOIN condition. This multiplies every row against every other row.
SE-CARTESIAN.why=Cartesian product detected: multiple tables in FROM without a JOIN condition. This multiplies every row against every other row.
SE-TAUTOLOGY.what=WHERE 1\\=1 filters nothing — it is always true. Returns every record in the table.
SE-TAUTOLOGY.why=WHERE 1\\=1 filters nothing — it is always true. Returns every record in the table.
SE-IMPOSSIBLE.what=WHERE 1\\=0 or WHERE FALSE never returns rows. This query will always return empty.
SE-IMPOSSIBLE.why=WHERE 1\\=0 or WHERE FALSE never returns rows. This query will always return empty.
SE-SELF-CMP.what=A column is compared to itself. This condition is always true and filters nothing.
SE-SELF-CMP.why=A column is compared to itself. This condition is always true and filters nothing.
SE-BETWEEN-SINGLE.what=BETWEEN with the same value on both ends is equivalent to a simple \\= . Use \\= value instead.
SE-BETWEEN-SINGLE.why=BETWEEN with the same value on both ends is equivalent to a simple \\= . Use \\= value instead.
SE-EMPTY-IN.what=The IN () list is empty. This condition is never true — the query will return zero rows.
SE-EMPTY-IN.why=The IN () list is empty. This condition is never true — the query will return zero rows.
SE-CONTRADICTS.what=The same column requires two different values with AND. This is impossible — no row can satisfy both conditions simultaneously.
SE-CONTRADICTS.why=The same column requires two different values with AND. This is impossible — no row can satisfy both conditions simultaneously.
SE-RANGE-IMPOSSIBLE.what=The numeric range is impossible: the condition requires the value to be simultaneously greater and less than values that contradict each other.
SE-RANGE-IMPOSSIBLE.why=The numeric range is impossible: the condition requires the value to be simultaneously greater and less than values that contradict each other.
SE-DANGER-SCOPE.what=DELETE or UPDATE with WHERE 1\\=1 will affect ALL records even though it has a WHERE clause. This is as dangerous as having no WHERE at all.
SE-DANGER-SCOPE.why=DELETE or UPDATE with WHERE 1\\=1 will affect ALL records even though it has a WHERE clause. This is as dangerous as having no WHERE at all.
SE-INSERT-NO-COLS.what=INSERT without an explicit column list is fragile. If the table schema changes (columns added, removed, or reordered), this INSERT will fail silently. Use: INSERT INTO table (col1, col2) VALUES (val1, val2).
SE-INSERT-NO-COLS.why=INSERT without an explicit column list is fragile. If the table schema changes (columns added, removed, or reordered), this INSERT will fail silently. Use: INSERT INTO table (col1, col2) VALUES (val1, val2).
SCH-001.what=A table in your query is not present in the connected database schema.
SCH-001.why=It may be a typo, a different schema, or the table has not been created yet in that database.
SCH-001.correctedExample=-- Check the name in Schema Explorer or create the table before querying.
SCH-001-MONGODB.what=Collection does not exist in the connected database
SCH-001-MONGODB.why=Collection does not exist in the connected database
SCH-001-CASSANDRA.what=Table does not exist in the connected keyspace
SCH-001-CASSANDRA.why=Table does not exist in the connected keyspace
SCH-001-ELASTICSEARCH.what=Index does not exist in the connected cluster
SCH-001-ELASTICSEARCH.why=Index does not exist in the connected cluster
SCH-001-REDIS.what=Key does not exist in the connected Redis database
SCH-001-REDIS.why=Key does not exist in the connected Redis database
SCH-001-DYNAMODB.what=Table does not exist in DynamoDB
SCH-001-DYNAMODB.why=Table does not exist in DynamoDB
SCH-002.what=A column in your query does not match the live table definition.
SCH-002.why=Check spelling, table aliases (t.col), and whether the column was renamed or dropped.
