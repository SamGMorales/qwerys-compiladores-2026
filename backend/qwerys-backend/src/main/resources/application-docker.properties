# Perfil Docker — sin secretos. Claves y contraseñas vía variables de entorno en docker-compose.
# NO incluir API keys ni jwt.secret aquí.

spring.config.activate.on-profile=docker

spring.datasource.url=jdbc:mysql://mysql:3306/qwerys?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

jwt.expiration=86400000

ai.provider=groq
ai.model=llama-3.3-70b-versatile
ai.base-url=https://api.groq.com/openai/v1
# API Fallback - no incluir en la estructura final en base a la instrucción proporcionada por el catedrático.
# ai.fallback-provider=openrouter
# ai.fallback-model=meta-llama/llama-3.3-70b-instruct
# ai.fallback-base-url=https://openrouter.ai/api/v1
# ai.fallback-http-referer=http://localhost
# ai.fallback-app-title=QWERYS

app.datasource.postgresql.url=jdbc:postgresql://postgresql:5432/qwerys_db
app.datasource.postgresql.username=postgres
app.datasource.postgresql.driver-class-name=org.postgresql.Driver
